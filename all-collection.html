<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>ALVEE - Videos & Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  html, body { min-height: 100%; }
  body {
    background: #09090B;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }
  .page { max-width: 1100px; margin: 0 auto; padding: 0 14px; }

  /* ---------- HEADER (unchanged, black) ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    background: #09090B;
    border-bottom: 1px solid rgba(255,255,255,.08);
    padding: calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .site-header .back {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; text-decoration: none; color: #fff;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  }
  .site-header .back svg { width: 18px; height: 18px; }
  .site-header .title { font-size: 15px; font-weight: 600; letter-spacing: .2px; }

  /* ---------- PROFILE CARD ---------- */
  .profile {
    margin-top: 16px;
    display: flex; align-items: center; gap: 16px;
    padding: 16px;
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .avatar {
    flex: 0 0 96px; width: 96px; height: 96px; border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 8px 22px rgba(0,0,0,.5);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile-info { min-width: 0; flex: 1; }

  .alvee-name {
    font-size: 30px; font-weight: 800; font-style: italic; letter-spacing: 1px;
    background: linear-gradient(90deg, #36B9E8, #ffffff 55%, #ff3b5c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(54,185,232,.25);
    line-height: 1.1;
  }

  .uploader-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(20,20,24,.45);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    font-size: 12px; font-weight: 600; color: #e5e7eb; letter-spacing: .3px;
  }

  /* ---------- STATS ---------- */
  .stats {
    margin-top: 14px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-radius: 20px; padding: 14px 6px;
    background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
  .stat + .stat { border-left: 1px solid rgba(255,255,255,.08); }
  .stat svg { width: 20px; height: 20px; color: #f5b82e; }
  .stat .stat-value { font-size: 18px; font-weight: 700; color: #fff; }
  .stat .stat-label { font-size: 11px; color: #9ca3af; letter-spacing: .3px; }
  .stat.views svg { color: #a78bfa; }

  /* ---------- HEADING & LATEST UPDATE ---------- */
  .section-head { margin-top: 26px; text-align: left; }
  .section-head h2 { font-size: 22px; font-weight: 800; letter-spacing: .2px; }

  .latest-wrap { display: flex; justify-content: center; margin: 18px 0 14px; }
  .latest {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 999px;
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.1);
    font-size: 13px; font-weight: 600; color: #e5e7eb;
  }
  .latest svg { width: 16px; height: 16px; color: #f5b82e; }

  /* ---------- GALLERY GRID ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .card {
    min-width: 0; border-radius: 18px; overflow: hidden;
    background: #121214;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    transition: transform .25s ease, border-color .25s ease;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.18); }
  .thumb {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    background: linear-gradient(110deg,#1a1a1e 30%,#26262c 50%,#1a1a1e 70%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite linear;
  }
  .thumb.loaded { animation: none; background: #1a1a1e; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease; }
  .thumb img.ok { opacity: 1; }
  .caption {
    padding: 10px 12px 12px; font-size: 12.5px; font-weight: 500; color: #e5e7eb;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .state { grid-column: 1 / -1; text-align: center; color: #9ca3af; font-size: 14px; padding: 30px 10px; }
  .state.error { color: #f87171; }

  /* ---------- ALBUM CARDS ---------- */
  .album-card .caption {
    white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    line-height: 1.35; min-height: calc(2 * 1.35em + 22px);
  }
  .badge {
    position: absolute; left: 8px; bottom: 8px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(10,10,12,.6);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.18);
    font-size: 11px; font-weight: 600; color: #fff;
  }
  .play {
    position: absolute; z-index: 2; right: 8px; top: 8px;
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(10,10,12,.6); border: 1px solid rgba(255,255,255,.2);
  }
  .play svg { width: 13px; height: 13px; fill: #fff; }

  /* ---------- ALBUM VIEW ---------- */
  .album-bar {
    margin-top: 22px; display: flex; align-items: center; gap: 12px;
  }
  .album-back {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  }
  .album-back svg { width: 18px; height: 18px; }
  .album-meta { min-width: 0; flex: 1; }
  .album-title {
    font-size: 17px; font-weight: 700; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .album-sub { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  #itemsGrid { margin-top: 16px; }
  .item-card .thumb { aspect-ratio: 3 / 4; }

  /* ---------- LIGHTBOX ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(0,0,0,.94);
    align-items: center; justify-content: center;
  }
  .lb.open { display: flex; }
  .lb-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 56px 0; }
  .lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; object-fit: contain; background: #000; }
  .lb-btn {
    position: absolute; z-index: 2; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .lb-btn svg { width: 20px; height: 20px; }
  .lb-close { top: calc(env(safe-area-inset-top,0px) + 12px); right: 12px; }
  .lb-prev { left: 10px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 10px; top: 50%; transform: translateY(-50%); }
  .lb-count {
    position: absolute; top: calc(env(safe-area-inset-top,0px) + 22px); left: 0; right: 0;
    text-align: center; font-size: 13px; font-weight: 600; color: #e5e7eb; pointer-events: none;
  }

  @media (max-width: 360px) {
    .avatar { flex-basis: 78px; width: 78px; height: 78px; }
    .alvee-name { font-size: 24px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="back" href="/dashboard.html" aria-label="Back to dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
  <div class="title">OC Collection Universe</div>
  <span style="width:38px"></span>
</header>

<main class="page">
  <section class="profile" aria-label="Profile">
    <div class="avatar">
      <img src="https://carder.top/imagens/1793417411592-885991335.jpg" alt="Alvee profile picture">
    </div>
    <div class="profile-info">
      <div class="alvee-name">Alvee</div>
      <span class="uploader-badge">Uploader</span>
    </div>
  </section>

  <section class="stats" aria-label="Statistics">
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
      <div class="stat-value" id="statVideos">—</div>
      <div class="stat-label">Video</div>
    </div>
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
      <div class="stat-value" id="statPhotos">—</div>
      <div class="stat-label">Photo</div>
    </div>
    <div class="stat views">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <div class="stat-value" id="statViews">—</div>
      <div class="stat-label">Views</div>
    </div>
  </section>

  <!-- ===== ALBUM LIST (home) ===== -->
  <div id="galleryHome">
    <h2 class="section-head"><span style="font-size:22px;font-weight:800">Videos &amp; Photos</span></h2>

    <div class="latest-wrap">
      <div class="latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Latest Update
      </div>
    </div>

    <div class="grid" id="albumsGrid">
      <div class="state">Loading...</div>
    </div>
  </div>

  <!-- ===== SINGLE ALBUM VIEW ===== -->
  <div id="albumView" hidden>
    <div class="album-bar">
      <div class="album-back" id="albumBack" role="button" aria-label="Back to albums">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div class="album-meta">
        <div class="album-title" id="albumTitle"></div>
        <div class="album-sub" id="albumSub"></div>
      </div>
    </div>
    <div class="grid" id="itemsGrid"></div>
  </div>
</main>

<!-- ===== LIGHTBOX ===== -->
<div class="lb" id="lb" aria-modal="true" role="dialog">
  <div class="lb-count" id="lbCount"></div>
  <div class="lb-btn lb-close" id="lbClose" role="button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </div>
  <div class="lb-btn lb-prev" id="lbPrev" role="button" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div class="lb-btn lb-next" id="lbNext" role="button" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="lb-stage" id="lbStage"></div>
</div>

<script>
(function () {
  'use strict';

  var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

  var albumsGrid = document.getElementById('albumsGrid');
  var itemsGrid = document.getElementById('itemsGrid');
  var galleryHome = document.getElementById('galleryHome');
  var albumView = document.getElementById('albumView');
  var albumTitle = document.getElementById('albumTitle');
  var albumSub = document.getElementById('albumSub');

  var currentItems = [];
  var lbIndex = 0;

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  }

  function fmt(n) {
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  function stateBox(parent, text, isError) {
    parent.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'state' + (isError ? ' error' : '');
    d.textContent = text;
    parent.appendChild(d);
  }

  function makeThumb(src) {
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var img = new Image();
    img.loading = 'lazy';
    img.alt = '';
    img.onload = function () { img.classList.add('ok'); thumb.classList.add('loaded'); };
    img.onerror = function () { thumb.classList.add('loaded'); };
    img.src = src;
    thumb.appendChild(img);
    return thumb;
  }

  function countLabel(a) {
    var parts = [];
    if (a.videos) parts.push(a.videos + (a.videos === 1 ? ' Video' : ' Videos'));
    if (a.photos) parts.push(a.photos + (a.photos === 1 ? ' Photo' : ' Photos'));
    return parts.join(' • ');
  }

  // ---------------- ALBUM LIST ----------------
  function renderAlbums(albums) {
    albumsGrid.innerHTML = '';
    if (!albums.length) {
      stateBox(albumsGrid, 'No albums published yet.');
      return;
    }
    var frag = document.createDocumentFragment();
    albums.forEach(function (a) {
      var card = document.createElement('article');
      card.className = 'card album-card';

      var thumb = makeThumb(a.cover);
      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = countLabel(a);
      thumb.appendChild(badge);

      var cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = a.title;

      card.appendChild(thumb);
      card.appendChild(cap);
      card.addEventListener('click', function () {
        location.hash = 'album/' + encodeURIComponent(a.slug);
      });
      frag.appendChild(card);
    });
    albumsGrid.appendChild(frag);
  }

  function loadAlbums() {
    fetch('/api/albums', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error('bad');
        renderAlbums(d.albums || []);
      })
      .catch(function () { stateBox(albumsGrid, 'Could not load albums. Please refresh.', true); });
  }

  // ---------------- SINGLE ALBUM ----------------
  function renderItems(items) {
    itemsGrid.innerHTML = '';
    if (!items.length) {
      stateBox(itemsGrid, 'This album is empty.');
      return;
    }
    var frag = document.createDocumentFragment();
    items.forEach(function (item, idx) {
      var card = document.createElement('article');
      card.className = 'card item-card';
      var thumb = makeThumb(item.thumb);
      if (item.type === 'video') {
        var p = document.createElement('div');
        p.className = 'play';
        p.innerHTML = PLAY_SVG;
        thumb.appendChild(p);
      }
      card.appendChild(thumb);
      card.addEventListener('click', function () { openLightbox(idx); });
      frag.appendChild(card);
    });
    itemsGrid.appendChild(frag);
  }

  function showAlbum(slug) {
    galleryHome.hidden = true;
    albumView.hidden = false;
    albumTitle.textContent = '';
    albumSub.textContent = '';
    stateBox(itemsGrid, 'Loading...');
    window.scrollTo(0, 0);

    fetch('/api/albums/' + encodeURIComponent(slug), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error('bad');
        currentItems = d.items || [];
        var v = currentItems.filter(function (i) { return i.type === 'video'; }).length;
        albumTitle.textContent = d.title || '';
        albumSub.textContent = countLabel({ videos: v, photos: currentItems.length - v });
        renderItems(currentItems);
      })
      .catch(function () { stateBox(itemsGrid, 'Could not load this album.', true); });
  }

  function showHome() {
    closeLightbox();
    albumView.hidden = true;
    galleryHome.hidden = false;
    currentItems = [];
  }

  function route() {
    var m = /^#album\/(.+)$/.exec(location.hash);
    if (m) {
      var slug;
      try { slug = decodeURIComponent(m[1]); } catch (e) { slug = m[1]; }
      showAlbum(slug);
    } else {
      showHome();
    }
  }

  document.getElementById('albumBack').addEventListener('click', function () {
    if (location.hash) {
      history.back();
      // hash না বদলালে (সরাসরি লিংকে ঢুকলে) হোমে ফেরা
      setTimeout(function () { if (/^#album\//.test(location.hash)) location.hash = ''; }, 150);
    } else {
      showHome();
    }
  });
  window.addEventListener('hashchange', route);

  // ---------------- LIGHTBOX ----------------
  var lb = document.getElementById('lb');
  var lbStage = document.getElementById('lbStage');
  var lbCount = document.getElementById('lbCount');

  function renderLightbox() {
    var item = currentItems[lbIndex];
    if (!item) return;
    lbStage.innerHTML = '';
    var el;
    if (item.type === 'video') {
      el = document.createElement('video');
      el.controls = true;
      el.autoplay = true;
      el.playsInline = true;
      el.preload = 'metadata';
      el.src = item.media;
    } else {
      el = new Image();
      el.alt = '';
      el.src = item.media;
    }
    lbStage.appendChild(el);
    lbCount.textContent = (lbIndex + 1) + ' / ' + currentItems.length;
  }

  function openLightbox(i) {
    lbIndex = i;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    renderLightbox();
  }

  function closeLightbox() {
    if (!lb.classList.contains('open')) return;
    lb.classList.remove('open');
    lbStage.innerHTML = '';   // ভিডিও থামানো
    document.body.style.overflow = '';
  }

  function step(delta) {
    if (!currentItems.length) return;
    lbIndex = (lbIndex + delta + currentItems.length) % currentItems.length;
    renderLightbox();
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', function () { step(-1); });
  document.getElementById('lbNext').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  // সোয়াইপ (মোবাইল)
  var touchX = null;
  lb.addEventListener('touchstart', function (e) {
    touchX = e.touches.length === 1 ? e.touches[0].clientX : null;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  // ---- Collection counts (video / photo) — আগের মতোই ----
  fetch('/api/collection/counts', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      setText('statVideos', fmt(d.videos));
      setText('statPhotos', fmt(d.photos));
    })
    .catch(function () { setText('statVideos', '—'); setText('statPhotos', '—'); });

  // ---- Website-wide views: একবার প্রতি পেজ লোডে ----
  fetch('/api/site/views', { method: 'POST', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { setText('statViews', fmt(d.total)); })
    .catch(function () { setText('statViews', '—'); });

  loadAlbums();
  route();
})();
</script>
</body>
</html>
