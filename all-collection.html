<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>ALVEE - Videos & Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <a class="back" href="/dashboard.html" aria-label="Back to dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
  <div class="title">OC Collection Universe</div>
  <span style="width:38px"></span>
</header>

<main class="page">
  <section class="profile" aria-label="Profile">
    <div class="avatar">
      <img src="https://carder.top/imagens/1793417411592-885991335.jpg" alt="Alvee profile picture">
    </div>
    <div class="profile-info">
      <div class="alvee-name">Alvee</div>
      <span class="uploader-badge">Uploader</span>
    </div>
  </section>

  <section class="stats" aria-label="Statistics">
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
      <div class="stat-value" id="statVideos">—</div>
      <div class="stat-label">Video</div>
    </div>
    <div class="stat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
      <div class="stat-value" id="statPhotos">—</div>
      <div class="stat-label">Photo</div>
    </div>
    <div class="stat views">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <div class="stat-value" id="statViews">—</div>
      <div class="stat-label">Views</div>
    </div>
  </section>

  <!-- ===== ALBUM LIST (home) ===== -->
  <div id="galleryHome">
    <h2 class="section-head"><span style="font-size:22px;font-weight:800">Videos &amp; Photos</span></h2>

    <div class="latest-wrap">
      <div class="latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Latest Update
      </div>
      <a class="upload-btn" id="uploadAlbumBtn" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
        Upload Album
      </a>
    </div>

    <div class="grid album-grid" id="albumsGrid">
      <div class="state">Loading...</div>
    </div>
  </div>

  <!-- ===== SINGLE ALBUM VIEW ===== -->
  <div id="albumView" hidden>
    <div class="album-bar">
      <div class="album-back" id="albumBack" role="button" aria-label="Back to albums">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div class="album-meta">
        <div class="album-title" id="albumTitle"></div>
        <div class="album-sub" id="albumSub"></div>
      </div>
    </div>
    <div class="album-hero" id="albumHero" hidden></div>
    <div class="grid" id="itemsGrid"></div>
  </div>
</main>

<!-- ===== LIGHTBOX ===== -->
<div class="lb" id="lb" aria-modal="true" role="dialog">
  <div class="lb-count" id="lbCount"></div>
  <div class="lb-btn lb-close" id="lbClose" role="button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </div>
  <div class="lb-btn lb-prev" id="lbPrev" role="button" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div class="lb-btn lb-next" id="lbNext" role="button" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="lb-stage" id="lbStage"></div>
</div>

<script>
(function () {
  'use strict';

  var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

  var albumsGrid = document.getElementById('albumsGrid');
  var itemsGrid = document.getElementById('itemsGrid');
  var galleryHome = document.getElementById('galleryHome');
  var albumView = document.getElementById('albumView');
  var albumTitle = document.getElementById('albumTitle');
  var albumSub = document.getElementById('albumSub');
  var albumHero = document.getElementById('albumHero');
  var uploadBtn = document.getElementById('uploadAlbumBtn');

  var currentItems = [];
  var lbIndex = 0;

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  }

  function fmt(n) {
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  function stateBox(parent, text, isError) {
    parent.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'state' + (isError ? ' error' : '');
    d.textContent = text;
    parent.appendChild(d);
  }

  function makeThumb(src, eager) {
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var img = new Image();
    img.loading = eager ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.alt = '';
    img.onload = function () { img.classList.add('ok'); thumb.classList.add('loaded'); };
    img.onerror = function () { thumb.classList.add('loaded'); };
    img.src = src;
    thumb.appendChild(img);
    return thumb;
  }

  function countLabel(a) {
    var parts = [];
    if (a.videos) parts.push(a.videos + (a.videos === 1 ? ' Video' : ' Videos'));
    if (a.photos) parts.push(a.photos + (a.photos === 1 ? ' Photo' : ' Photos'));
    return parts.join(' • ');
  }

  function renderAlbums(albums) {
    albumsGrid.innerHTML = '';
    if (!albums.length) {
      stateBox(albumsGrid, 'No albums published yet.');
      return;
    }
    var frag = document.createDocumentFragment();
    albums.forEach(function (a, i) {
      var card = document.createElement('article');
      card.className = 'card album-card';

      var thumb = makeThumb(a.cover, i < 6);
      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = countLabel(a);
      thumb.appendChild(badge);

      var cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = a.title;

      card.appendChild(thumb);
      card.appendChild(cap);
      card.addEventListener('click', function () {
        location.hash = 'album/' + encodeURIComponent(a.slug);
      });
      frag.appendChild(card);
    });
    albumsGrid.appendChild(frag);
  }

  function loadAlbums(silent) {
    fetch('/api/albums', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error('bad');
        renderAlbums(d.albums || []);
      })
      .catch(function () {
        if (!silent) stateBox(albumsGrid, 'Could not load albums. Please refresh.', true);
      });
  }

  function renderItems(items) {
    itemsGrid.innerHTML = '';
    if (!items.length) {
      stateBox(itemsGrid, 'This album is empty.');
      return;
    }
    var frag = document.createDocumentFragment();
    items.forEach(function (item, idx) {
      var card = document.createElement('article');
      card.className = 'card item-card';
      var thumb = makeThumb(item.thumb);
      if (item.type === 'video') {
        var p = document.createElement('div');
        p.className = 'play';
        p.innerHTML = PLAY_SVG;
        thumb.appendChild(p);
      }
      card.appendChild(thumb);
      card.addEventListener('click', function () { openLightbox(idx); });
      frag.appendChild(card);
    });
    itemsGrid.appendChild(frag);
  }

  function showAlbum(slug) {
    galleryHome.hidden = true;
    albumView.hidden = false;
    albumTitle.textContent = '';
    albumSub.textContent = '';
    albumHero.hidden = true;
    albumHero.innerHTML = '';
    stateBox(itemsGrid, 'Loading...');
    window.scrollTo(0, 0);

    fetch('/api/albums/' + encodeURIComponent(slug), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error('bad');
        currentItems = d.items || [];
        var v = currentItems.filter(function (i) { return i.type === 'video'; }).length;
        albumTitle.textContent = d.title || '';
        albumSub.textContent = countLabel({ videos: v, photos: currentItems.length - v });
        if (d.cover) {
          var himg = new Image();
          himg.alt = '';
          himg.onload = function () { himg.classList.add('ok'); albumHero.hidden = false; };
          himg.src = d.cover;
          albumHero.appendChild(himg);
        }
        renderItems(currentItems);
      })
      .catch(function () { stateBox(itemsGrid, 'Could not load this album.', true); });
  }

  function showHome() {
    closeLightbox();
    albumView.hidden = true;
    galleryHome.hidden = false;
    currentItems = [];
  }

  function route() {
    var m = /^#album\/(.+)$/.exec(location.hash);
    if (m) {
      var slug;
      try { slug = decodeURIComponent(m[1]); } catch (e) { slug = m[1]; }
      showAlbum(slug);
    } else {
      showHome();
    }
  }

  document.getElementById('albumBack').addEventListener('click', function () {
    if (location.hash) {
      history.back();
      setTimeout(function () { if (/^#album\//.test(location.hash)) location.hash = ''; }, 150);
    } else {
      showHome();
    }
  });
  window.addEventListener('hashchange', route);

  var lb = document.getElementById('lb');
  var lbStage = document.getElementById('lbStage');
  var lbCount = document.getElementById('lbCount');

  function renderLightbox() {
    var item = currentItems[lbIndex];
    if (!item) return;
    lbStage.innerHTML = '';
    var el;
    if (item.type === 'video') {
      el = document.createElement('video');
      el.controls = true;
      el.autoplay = true;
      el.playsInline = true;
      el.preload = 'metadata';
      el.src = item.media;
    } else {
      el = new Image();
      el.alt = '';
      el.src = item.media;
    }
    lbStage.appendChild(el);
    lbCount.textContent = (lbIndex + 1) + ' / ' + currentItems.length;
  }

  function openLightbox(i) {
    lbIndex = i;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    renderLightbox();
  }

  function closeLightbox() {
    if (!lb.classList.contains('open')) return;
    lb.classList.remove('open');
    lbStage.innerHTML = '';
    document.body.style.overflow = '';
  }

  function step(delta) {
    if (!currentItems.length) return;
    lbIndex = (lbIndex + delta + currentItems.length) % currentItems.length;
    renderLightbox();
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', function () { step(-1); });
  document.getElementById('lbNext').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  var touchX = null;
  lb.addEventListener('touchstart', function (e) {
    touchX = e.touches.length === 1 ? e.touches[0].clientX : null;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  fetch('/api/collection/counts?scope=all', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      setText('statVideos', fmt(d.videos));
      setText('statPhotos', fmt(d.photos));
    })
    .catch(function () { setText('statVideos', '—'); setText('statPhotos', '—'); });

  fetch('/api/site/views', { method: 'POST', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { setText('statViews', fmt(d.total)); })
    .catch(function () { setText('statViews', '—'); });

  fetch('/api/upload-link', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok && d.url) { uploadBtn.href = d.url; uploadBtn.hidden = false; }
    })
    .catch(function () {});

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !galleryHome.hidden) loadAlbums(true);
  });

  loadAlbums();
  route();
})();
</script>
</body>
</html>
