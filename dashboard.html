<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile / Leaderboard - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        /* পেজ সিকিউরিটি গার্ড: লগইন চেক না হওয়া পর্যন্ত পেজটি লুকিয়ে রাখবে যাতে ফ্লিকার না করে */
        #dashboardWrapper {
            opacity: 0;
            transition: opacity 0.4s ease;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px 100px 15px;
            position: relative;
        }

        body { 
            background-color: #0a1128; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative;
            overflow-x: hidden;
        }

        /* ব্যাকগ্রাউন্ড ভিডিও */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(0.4);
        }

        /* হেডার ন্যাভবার (ডানে রিফ্রেশ বাটন) */
        .header-nav {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .header-btn {
            position: relative;
            background: linear-gradient(145deg, #ff9bb0, #ff708f);
            border: none;
            border-radius: 50px;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.3), 
                        -3px -3px 10px rgba(255, 155, 176, 0.4),
                        inset 2px 2px 4px rgba(255, 255, 255, 0.4),
                        inset -2px -2px 4px rgba(180, 50, 80, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .header-btn:hover {
            transform: scale(1.05);
        }

        .refresh-btn {
            width: 95px;
            height: 38px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .refresh-btn.loading {
            width: 38px;
            border-radius: 50%;
            color: transparent;
            pointer-events: none;
            animation: pulseShrink 0.4s ease forwards;
        }

        .refresh-btn.loading::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes pulseShrink {
            0% { transform: scale(1); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* প্রোফাইল লিস্ট কন্টেইনার */
        .profile-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2;
        }

        .profile-card {
            background: rgba(20, 25, 45, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .profile-card.active-glow {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.4), rgba(20, 25, 45, 0.85));
            border: 1.5px solid #00bfff;
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.4), inset 0 0 10px rgba(0, 191, 255, 0.3);
        }

        .profile-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .user-info-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .user-details h3 {
            font-size: 14px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .user-details p {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* --- প্রিমিয়াম লাইভ ব্যাজ স্টাইল --- */
        .live-badge-container {
            display: inline-flex;
            align-items: center;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background-color: #ff1a1a;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-shadow: 0 0 8px #ff1a1a, 0 0 15px #ff1a1a;
            animation: livePulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            margin-right: 8px;
        }

        @keyframes livePulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0.7);
            }
            70% {
                transform: scale(1.18);
                box-shadow: 0 0 0 8px rgba(255, 26, 26, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0);
            }
        }

        .live-text {
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .live-text::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: shimmerSweep 3s ease-in-out infinite;
        }

        @keyframes shimmerSweep {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        /* --- বটম ন্যাভবার --- */
        .bottom-glass-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: 90%;
            max-width: 380px;
            height: 70px;
            background: rgba(20, 25, 45, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.05);
            z-index: 100;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
        }

        .bottom-glass-nav.slide-up {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .nav-item {
            background: transparent;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: #94a3b8;
            transition: fill 0.3s ease;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.6), rgba(0, 191, 255, 0.8));
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.4);
            width: 58px;
            height: 58px;
        }

        .nav-item.active svg {
            fill: #ffffff;
            width: 26px;
            height: 26px;
        }

        .nav-item:hover svg {
            fill: #ffffff;
        }

        /* মোডাল পপআপ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 999;
        }
        .modal-box {
            background: #141c3a; border: 1px solid rgba(255,255,255,0.15); width: 90%; max-width: 340px; padding: 25px;
            border-radius: 20px; text-align: center; color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-box h3 { margin-bottom: 10px; color: #00bfff; }
        .modal-box p { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; }
        .close-btn {
            background: #ff708f; color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-weight: 700; cursor: pointer;
        }
    </style>

    <script>
        // সিকিউরিটি গার্ড চেক
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("verify.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("dashboardWrapper").style.opacity = "1";
                setTimeout(() => {
                    document.getElementById('bottomNav').classList.add('slide-up');
                }, 100);
            });
        }
    </script>
</head>
<body>

        <!-- নিচে গ্লাস-মরফিজম বটম ন্যাভবার -->

        <!-- মোডাল পপআপ -->

                <button class="close-btn" onclick="closeModal()">Close</button>

    <script>
        function triggerRefresh(btn) {
            btn.classList.add('loading');
            setTimeout(() => {
                location.reload();
            }, 700);
        }

        function handleNavAction(type) {
            if (type === 'group') {
                alert("Telegram Group section coming soon!");
            }
        }

        function openProfile(name, subtitle) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalInfo').innerText = `Status: LIVE\nCategory: ${subtitle}\nBroadcasting Active`;
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('profileModal').style.display = 'none';
        }
    </script>
</body>
</html>
