<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1128">
<title>User Dashboard - OC Collection Universe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html, body { width: 100%; min-height: 100%; }

body {
    background: #0a1128;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
}

/* BACKGROUND */
.bg-container {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: -1; overflow: hidden; pointer-events: none;
    background: #0a1128; transform: translateZ(0);
}
.bg-image {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    opacity: 0; filter: blur(3px);
    transition: opacity .7s ease; will-change: opacity;
}
.bg-image.visible { opacity: 1; }
.bg-shade { position: absolute; inset: 0; background: transparent; }
#bgLoader { display: none !important; }

/* DASHBOARD */
#dashboardWrapper {
    opacity: 1; width: 100%; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 15px 40px; position: relative; z-index: 2;
}

/* GLASS HEADER (header + stories, both stay fixed on scroll) */
.glass-header {
    position: sticky;
    top: 0;
    z-index: 50;
    width: calc(100% + 30px);
    margin: 0 -15px 16px;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 15px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    backdrop-filter: blur(3px) saturate(160%);
    -webkit-backdrop-filter: blur(3px) saturate(160%);
    border-bottom: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.glass-header:has(.stories-row:empty) { padding-bottom: 8px; }
.header-nav {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-height: 40px;
}

.header-btn {
    position: relative;
    background: linear-gradient(145deg,#ff9bb0,#ff708f);
    border: 0; border-radius: 50px; color: #fff; cursor: pointer;
    box-shadow: 0 4px 10px #0004;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s ease; text-decoration: none;
}
.refresh-btn {
    width: 66px; height: 28px;
    font-size: 9px; font-weight: 700; letter-spacing: .8px;
    flex-shrink: 0;
}
.refresh-btn.loading {
    width: 28px; border-radius: 50%; color: transparent; pointer-events: none;
}
.refresh-btn.loading::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid #ffffff66; border-top-color: #fff; border-radius: 50%;
    animation: spinLoader .6s linear infinite;
}
@keyframes spinLoader { to { transform: rotate(360deg); } }

/* profile chip (left side of header) */
.header-profile {
    display: flex; align-items: center; gap: 8px;
    min-width: 0; max-width: 68%;
    padding: 3px 12px 3px 3px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .16s ease;
}
.header-profile:active { transform: scale(.95); }
.header-profile .pname {
    color: #fff; font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
}

/* ring (instagram-style colourful ring) */
.ring {
    flex: 0 0 auto;
    border-radius: 50%;
    padding: 2.5px;
    background: conic-gradient(from 210deg, #ffc400, #ff7a00, #ff0069, #d300c5, #7638fa, #ffc400);
    display: inline-flex;
}
.ring > img, .ring > .ph {
    width: 100%; height: 100%; border-radius: 50%;
    border: 2px solid #fff; object-fit: cover; background: #1b2240;
    pointer-events: none; display: block;
}
.ring.sm { width: 34px; height: 34px; }
.ring.seen { background: rgba(255,255,255,.35); }

.view-section {
    width: 100%; max-width: 440px;
    display: none; flex-direction: column; gap: 15px;
}
.view-section.active-view { display: flex; }

/* STORIES (inside sticky header, still swipes left/right) */
.stories-row {
    width: 100%; max-width: 440px;
    display: flex; gap: 12px;
    overflow-x: auto; overflow-y: hidden;
    padding: 8px 4px 10px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    touch-action: pan-x;
    scrollbar-width: none;
}
.stories-row::-webkit-scrollbar { display: none; }
.stories-row:empty { display: none; }

.story-item {
    flex: 0 0 auto; width: 68px; height: 68px;
    scroll-snap-align: start;
    cursor: pointer; position: relative;
    -webkit-tap-highlight-color: transparent;
    transition: transform .16s ease;
}
.story-item:active { transform: scale(.92); }
.story-item .ring { width: 100%; height: 100%; padding: 3px; position: relative; }
.story-item .ring > img { border-width: 2.5px; opacity: 0; transition: opacity .3s ease; }
.story-item .ring > img.ok { opacity: 1; }
.story-item .ring > .ph {
    position: absolute; inset: 3px; width: auto; height: auto;
    background: linear-gradient(110deg,#1b2240 30%,#2a3358 50%,#1b2240 70%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite linear;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.story-item .play-badge {
    position: absolute; right: 2px; bottom: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: rgba(0,0,0,.7); border: 1.5px solid #fff;
    display: flex; align-items: center; justify-content: center;
}
.story-item .play-badge::after {
    content: ""; border-left: 6px solid #fff;
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    margin-left: 2px;
}

/* story viewer */
.story-viewer {
    position: fixed; inset: 0; z-index: 3000;
    background: #000; display: none; flex-direction: column;
    align-items: center; justify-content: center;
}
.story-viewer.open { display: flex; }
.story-stage {
    position: relative; width: 100%; height: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: center; background: #000;
}
.story-stage img, .story-stage video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
}
.story-bars {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: 8px; right: 8px; display: flex; gap: 3px; z-index: 5;
}
.story-bars span {
    flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden;
}
.story-bars span i { display: block; height: 100%; width: 0; background: #fff; }
.story-bars span.done i { width: 100%; }
.story-close {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 12px; z-index: 6;
    width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.45); color: #fff; font-size: 20px; cursor: pointer;
}
.story-tap { position: absolute; top: 60px; bottom: 0; width: 35%; z-index: 4; }
.story-tap.left { left: 0; } .story-tap.right { right: 0; width: 65%; }
.story-spinner {
    position: absolute; width: 34px; height: 34px; z-index: 3;
    border: 3px solid #ffffff44; border-top-color: #fff; border-radius: 50%;
    animation: spinLoader .7s linear infinite; display: none;
}
.story-spinner.on { display: block; }

/* PROFILE CARDS */
.profile-card {
    background: rgba(20,25,45,.75);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid #ffffff1a; border-radius: 50px;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    box-shadow: 0 10px 30px #0008; cursor: pointer;
    transition: transform .18s ease, border-color .3s ease;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.profile-card.blink-glow {
    background: linear-gradient(135deg, #ff708f4d, rgba(20,25,45,.85));
    border: 1.5px solid #ff708f;
    animation: cardBlink 2s infinite ease-in-out;
}
@keyframes cardBlink {
    0%, 100% { box-shadow: 0 0 10px #ff708f66; border-color: #ff708f80; }
    50% { box-shadow: 0 0 25px #ff708fe6; border-color: #ff708f; }
}
.profile-card:hover { border-color: #ffffff4d; }

.oc-collection-card {
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .16s ease, border-color .3s ease;
}
.oc-collection-card:active, .profile-card.blink-glow:active { transform: scale(.94); }

.oc-collection-card.attention {
    position: relative; overflow: visible;
    animation: cardBlink 2s infinite ease-in-out, ocBounce 2.8s infinite ease-in-out;
}
.oc-collection-card.attention::before {
    content: ""; position: absolute; inset: 0; border-radius: 50px; overflow: hidden;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%);
    background-size: 250% 100%; background-position: 150% 0;
    animation: shineSweep 2.8s infinite; pointer-events: none;
}
.oc-collection-card.attention::after {
    content: ""; position: absolute; inset: -2px; border-radius: 52px;
    border: 2px solid #ff708f; opacity: 0; pointer-events: none;
    animation: ripple 2.2s infinite ease-out;
}
@keyframes ocBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    8% { transform: translateY(-4px) scale(1.015); }
    16% { transform: translateY(0) scale(1); }
    24% { transform: translateY(-2px) scale(1.008); }
    32% { transform: translateY(0) scale(1); }
}
@keyframes shineSweep { 0% { background-position: 150% 0; } 60%, 100% { background-position: -50% 0; } }
@keyframes ripple { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.09, 1.4); opacity: 0; } }
.tap-hint {
    position: absolute; right: 16px; bottom: -11px; z-index: 3;
    background: linear-gradient(135deg,#ff9bb0,#ff708f); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    padding: 3px 10px; border-radius: 20px; box-shadow: 0 4px 12px #0006;
    animation: hintPoke 1.2s infinite ease-in-out; pointer-events: none;
}
@keyframes hintPoke { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

.user-info-wrapper { display: flex; align-items: center; gap: 15px; min-width: 0; flex: 1; }
.avatar-container {
    position: relative; flex: 0 0 50px; width: 50px; height: 50px;
    border-radius: 50%; overflow: hidden; border: 2px solid #ffffff33;
}
.avatar { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.image-shield { position: absolute; inset: 0; z-index: 5; background: transparent; pointer-events: none; }
.user-details { min-width: 0; }
.user-details h3 { font-size: 14px; color: #fff; font-weight: 700; line-height: 1.5; }
.user-details p { font-size: 11px; color: #94a3b8; font-weight: 500; margin-top: 2px; }

.live-badge-container {
    display: inline-flex; align-items: center; background: #000;
    border: 1px solid #ffffff1a; padding: 6px 14px; border-radius: 20px; flex-shrink: 0;
}
.live-dot {
    width: 9px; height: 9px; background: #ff1a1a; border-radius: 50%;
    box-shadow: 0 0 8px #ff1a1a; animation: livePulse 1.8s infinite; margin-right: 8px;
}
@keyframes livePulse { 0%, 100% { transform: scale(1); } 70% { transform: scale(1.18); } }
.live-text { color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }

/* small info popup for channel cards */
.modal-overlay {
    position: fixed; inset: 0; background: #000d;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; z-index: 999;
}
.modal-box {
    background: #141c3a; border: 1.5px solid #ff708f66; width: 90%; max-width: 340px;
    padding: 25px; border-radius: 24px; text-align: center; color: #fff;
    box-shadow: 0 15px 40px #000b;
}
.modal-box h3 { margin-bottom: 15px; color: #ff708f; font-size: 20px; }
.close-btn {
    background: linear-gradient(135deg,#ff9bb0,#ff708f); color: #fff; border: 0;
    padding: 10px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 15px;
}

/* NAUGHTY NONSTOP */
.naughty-window {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    background: #080d20; z-index: 2000; display: none; flex-direction: column; overflow: hidden;
}
.naughty-window.open { display: flex; }
.naughty-window iframe {
    display: block; width: 100%; height: 100%; min-height: 0; flex: 1; border: 0; background: #080d20;
}

/* ================= ALVEE POPUP PROFILE CARD ================= */
.pc-overlay {
    position: fixed; inset: 0; z-index: 3500;
    display: none; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: rgba(30,6,36,.62);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.pc-overlay.open { display: flex; animation: pcFade .25s ease; }
@keyframes pcFade { from { opacity: 0; } }
@keyframes pcPop { from { opacity: 0; transform: translateY(18px) scale(.94); } }

.pc-card {
    --plum: #3b0a45; --pink: #ff4d8d; --magenta: #e5127d;
    position: relative; width: 100%; max-width: 400px; max-height: 100%;
    overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
    border-radius: 32px; color: var(--plum);
    background: linear-gradient(180deg, #fff 0%, #fff0f6 55%, #fde4f0 100%);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 24px 60px rgba(90,0,60,.45), 0 0 0 1px rgba(255,120,170,.25);
}
.pc-card::-webkit-scrollbar { display: none; }
.pc-overlay.open .pc-card { animation: pcPop .35s cubic-bezier(.2,.9,.3,1.1); }

.pc-cover { position: relative; height: 230px; overflow: hidden; background: #f7c6da; }
.pc-cover img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; pointer-events: none; }
.pc-cover::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 70%;
    background: linear-gradient(180deg, rgba(255,240,246,0), rgba(255,240,246,.75) 60%, #fff0f6);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 70%);
    mask-image: linear-gradient(180deg, transparent, #000 70%);
}

.pc-close {
    position: absolute; top: 14px; right: 14px; z-index: 5;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4);
    background: rgba(40,10,50,.4); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .25s ease, background .2s ease;
    -webkit-tap-highlight-color: transparent;
}
.pc-close:hover { background: rgba(229,18,125,.75); transform: rotate(90deg); }
.pc-close:active { transform: rotate(90deg) scale(.88); }
.pc-close svg { width: 18px; height: 18px; }

.pc-head { position: relative; z-index: 2; margin-top: -78px; text-align: center; padding: 0 18px; }
.pc-avatar {
    width: 128px; height: 128px; margin: 0 auto; border-radius: 50%;
    border: 4px solid #fff; background: #fff;
    box-shadow: 0 8px 24px rgba(229,18,125,.35), 0 0 0 3px rgba(255,150,190,.55);
    overflow: hidden;
}
.pc-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: auto; pointer-events: none; }
.pc-wordmark { display: block; width: 210px; max-width: 70%; height: auto; margin: 6px auto 0; overflow: visible; }

.pc-actions { display: flex; gap: 10px; padding: 14px 16px 0; align-items: center; }
.pc-sub {
    flex: 1; min-width: 0; height: 54px; border: 0; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 17px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, #ff4d8d, #e5127d 60%, #c40a8f);
    box-shadow: 0 10px 22px rgba(229,18,125,.4), 0 0 18px rgba(255,77,141,.35);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    -webkit-tap-highlight-color: transparent;
}
.pc-sub:hover { filter: brightness(1.06); box-shadow: 0 12px 28px rgba(229,18,125,.55), 0 0 26px rgba(255,77,141,.5); }
.pc-sub:active { transform: scale(.95); }
.pc-sub svg { width: 22px; height: 22px; flex: 0 0 auto; }
.pc-sub.subscribed { background: linear-gradient(90deg, #6d2a78, #3b0a45); box-shadow: 0 8px 18px rgba(59,10,69,.4); }

.pc-icon-btn {
    position: relative; flex: 0 0 54px; width: 54px; height: 54px; border-radius: 50%;
    border: 1px solid rgba(255,120,170,.35); background: #fff; color: var(--pink);
    cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 6px 16px rgba(229,18,125,.16);
    transition: transform .2s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
    -webkit-tap-highlight-color: transparent;
}
.pc-icon-btn:hover { box-shadow: 0 0 0 4px rgba(255,77,141,.15), 0 8px 20px rgba(229,18,125,.3); }
.pc-icon-btn:active { transform: scale(.9); }
.pc-icon-btn svg { width: 24px; height: 24px; transform-origin: 50% 12%; overflow: visible; }
.pc-bell.on { background: linear-gradient(145deg,#ff6aa2,#e5127d); color: #fff; border-color: transparent; }
.pc-bell.ring-anim svg { animation: bellRing .7s ease-in-out 3; }
.pc-bell.glow { animation: bellGlow 1.6s ease-in-out 1; }
@keyframes bellRing {
    0%,100% { transform: rotate(0); } 15% { transform: rotate(22deg); } 35% { transform: rotate(-20deg); }
    55% { transform: rotate(14deg); } 75% { transform: rotate(-10deg); }
}
@keyframes bellGlow {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,77,141,0); }
    30%,70% { box-shadow: 0 0 0 7px rgba(255,77,141,.28), 0 0 26px rgba(255,77,141,.8); }
}
.pc-heart:active svg { transform: scale(.8); }
.pc-heart svg { transition: transform .15s ease; }

.pc-cats { display: flex; gap: 8px; padding: 14px 16px 0; }
.pc-cat {
    flex: 1 1 0; min-width: 0; height: 42px; padding: 0 6px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap; text-decoration: none;
    transition: transform .2s ease, box-shadow .25s ease;
    -webkit-tap-highlight-color: transparent;
}
.pc-cat span { overflow: hidden; text-overflow: ellipsis; }
.pc-cat svg { width: 15px; height: 15px; flex: 0 0 auto; }
.pc-cat:hover { transform: translateY(-2px); }
.pc-cat:active { transform: scale(.94); }
.pc-cat.excl { background: #1d1424; color: #fff; border: 0; box-shadow: 0 6px 14px rgba(20,10,30,.35); }
.pc-cat.excl svg { color: #ffc400; }
.pc-cat.excl:hover { box-shadow: 0 8px 18px rgba(255,196,0,.35); }
.pc-cat.priv { background: #ffeaf3; color: var(--plum); border: 1.5px solid rgba(255,77,141,.45); }
.pc-cat.priv svg { color: var(--pink); }
.pc-cat.priv:hover { box-shadow: 0 6px 16px rgba(255,77,141,.35); }
.pc-cat.shift {
    background: linear-gradient(145deg, #2a2133, #14101a); color: #f4e6b8;
    border: 1px solid rgba(226,196,120,.7);
}
.pc-cat.shift svg { color: #e6c675; }
.pc-cat.shift:hover { box-shadow: 0 0 18px rgba(226,196,120,.55); }

.pc-eyes {
    position: relative; margin: 16px 16px 0; height: 168px; border-radius: 22px; overflow: hidden;
    border: 1.5px solid rgba(255,120,170,.55);
    box-shadow: 0 10px 26px rgba(229,18,125,.28);
    display: grid; place-items: center; text-align: center; color: #fff;
}
.pc-eyes .bgb {
    position: absolute; inset: -24px; background-size: cover; background-position: center;
    filter: blur(18px) saturate(1.1); transform: scale(1.1);
}
.pc-eyes::before { content: ""; position: absolute; inset: 0; z-index: 1; background: rgba(48,14,56,.5); }
.pc-eyes .inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pc-eyes .eye {
    width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.pc-eyes .eye svg { width: 28px; height: 28px; }
.pc-eyes .txt { font-size: 17px; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
.pc-eyes .lock {
    position: absolute; top: 12px; right: 12px; z-index: 2; width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4);
}
.pc-eyes .lock svg { width: 17px; height: 17px; }

.pc-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    margin: 16px 16px 18px; padding: 12px 4px; border-radius: 20px;
    background: rgba(255,255,255,.8); border: 1px solid rgba(255,150,190,.3);
    box-shadow: 0 6px 16px rgba(229,18,125,.1);
}
.pc-stat { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 4px; min-width: 0; }
.pc-stat + .pc-stat { border-left: 1px solid rgba(59,10,69,.14); }
.pc-stat svg { width: 22px; height: 22px; color: #6d4a78; flex: 0 0 auto; }

<script>
/* HEADER NAME */
const HEADER_NAME =
    "\u{1D1BA}\u{1D165}\u20DD" +
    "\u{1F5A4}" +
    "\u0F0F\u0640\uABED\u0640\uABED" +
    "\u{1F1E6}" +
    "\u{1D647}\u{1D651}\u{1D640}\u{1D640}" +
    "\u{1D1BA}\u{1D165}" +
    "\u2665\uFE0F" +
    "\u27F5\uABED";
document.getElementById('headerName').textContent = HEADER_NAME;

/* BACKGROUND IMAGE & DASHBOARD JS */
const backgroundImages = [
    "https://carder.top/imagens/1792211356900-71480222.jpg",
    "https://carder.top/imagens/1792211360124-891549584.jpg",
    "https://carder.top/imagens/1792211363191-784655850.jpg",
    "https://carder.top/imagens/1792211366774-641483995.jpg"
];

function shuffled(items) {
    const array = [...items];
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function initRandomBackground() {
    const container = document.getElementById('bgContainer');
    if (!container) return;
    const queueKey = 'dashboardBackgroundImageQueueV1';
    const previousKey = 'dashboardLastBackgroundImageV1';
    let queue = [];
    try { queue = JSON.parse(localStorage.getItem(queueKey) || '[]'); } catch (error) { queue = []; }
    queue = queue.filter(url => backgroundImages.includes(url));
    if (!queue.length) { queue = shuffled(backgroundImages); }
    let previous = null;
    try { previous = localStorage.getItem(previousKey); } catch (error) {}
    if (queue.length > 1 && queue[queue.length - 1] === previous) {
        [queue[0], queue[queue.length - 1]] = [queue[queue.length - 1], queue[0]];
    }
    const selected = queue.pop();
    try { localStorage.setItem(queueKey, JSON.stringify(queue)); } catch (error) {}
    const img = new Image();
    img.className = 'bg-image';
    img.alt = '';
    img.draggable = false;
    img.onload = function () {
        container.insertBefore(img, container.querySelector('.bg-shade'));
        requestAnimationFrame(function () { img.classList.add('visible'); });
        try { localStorage.setItem(previousKey, selected); } catch (error) {}
    };
    img.onerror = function () {
        if (queue.length) {
            const next = queue.pop();
            try { localStorage.setItem(queueKey, JSON.stringify(queue)); } catch (error) {}
            img.src = next;
        }
    };
    img.src = selected;
}

function initializeDashboard() {
    let loggedIn = false;
    try { loggedIn = localStorage.getItem('isLoggedIn') === 'true'; } catch (error) {}
    if (!loggedIn) { window.location.replace('verify.html'); return; }
    initRandomBackground();
    loadStories();
    initProfileCard();
    if (location.hash === '#profile') openProfileCard();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeDashboard);
} else { initializeDashboard(); }

function triggerRefresh(button) {
    if (button) { button.classList.add('loading'); button.disabled = true; }
    setTimeout(() => window.location.reload(), 300);
}
function openProfile(name, subtitle) {
    const modalName = document.getElementById('modalName');
    const info = document.getElementById('modalInfo');
    const modal = document.getElementById('profileModal');
    if (!modalName || !info || !modal) return;
    modalName.textContent = name;
    info.innerHTML = `Status: LIVE<br>Category: ${subtitle}<br>Broadcasting Active`;
    modal.style.display = 'flex';
}
function closeModal() {
    const modal = document.getElementById('profileModal');
    if (modal) modal.style.display = 'none';
}
function openNaughtyWithLandAnimation() {
    const modal = document.getElementById('naughtyWindow');
    if (modal) { modal.classList.add('open'); document.body.style.overflow = 'hidden'; }
}
function closeNaughtyWindow() {
    const modal = document.getElementById('naughtyWindow');
    if (modal) { modal.classList.remove('open'); }
    document.body.style.overflow = '';
}
function logoutUser() {
    try { localStorage.removeItem('isLoggedIn'); localStorage.removeItem('userPhone'); } catch (error) {}
    window.location.href = 'verify.html';
}

/* STORIES  (API: GET /api/stories) */
const STORY_API = '/api/stories';
const STORY_CACHE_KEY = 'storiesCacheV1';
const STORY_SEEN_KEY = 'storiesSeenV1';
const PHOTO_MS = 5000;

let stories = [];
let storyIdx = 0;
let storyTimer = null;

function getSeen() { try { return JSON.parse(localStorage.getItem(STORY_SEEN_KEY) || '[]'); } catch (e) { return []; } }
function markSeen(id) {
    const s = getSeen(); if (!s.includes(id)) { s.push(id); try { localStorage.setItem(STORY_SEEN_KEY, JSON.stringify(s.slice(-300))); } catch (e) {} }
}

function renderStories() {
    const row = document.getElementById('storiesRow');
    row.innerHTML = '';
    const seen = getSeen();
    stories.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'story-item';
        item.onclick = () => openStory(i);
        const ring = document.createElement('div');
        ring.className = 'ring' + (seen.includes(s.id) ? ' seen' : '');
        const ph = document.createElement('div'); ph.className = 'ph';
        const img = new Image();
        img.alt = ''; img.draggable = false; img.decoding = 'async';
        if (i > 5) img.loading = 'lazy';
        img.onload = () => { img.classList.add('ok'); ph.remove(); };
        img.onerror = () => { ph.style.animation = 'none'; };
        img.src = s.thumb || (s.type === 'photo' ? s.src : '');
        ring.append(img, ph);
        item.appendChild(ring);
        if (s.type === 'video') { const b = document.createElement('span'); b.className = 'play-badge'; item.appendChild(b); }
        row.appendChild(item);
    });
}

function normalize(list) {
    return (Array.isArray(list) ? list : [])
        .filter(s => s && s.src)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

async function loadStories() {
    try { const c = JSON.parse(localStorage.getItem(STORY_CACHE_KEY) || '[]'); stories = normalize(c); if (stories.length) renderStories(); } catch (e) {}
    try {
        const res = await fetch(STORY_API, { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        stories = normalize(data.stories || data);
        try { localStorage.setItem(STORY_CACHE_KEY, JSON.stringify(stories.slice(0, 40))); } catch (e) {}
        renderStories();
    } catch (e) {}
}

function clearStage() {
    clearTimeout(storyTimer);
    const stage = document.getElementById('storyStage');
    stage.querySelectorAll('img, video').forEach(el => { if (el.pause) el.pause(); el.remove(); });
}

function showStory() {
    clearStage();
    const s = stories[storyIdx]; if (!s) return closeStory();
    markSeen(s.id);
    const stage = document.getElementById('storyStage');
    const spinner = document.getElementById('storySpinner');
    const bars = document.getElementById('storyBars');
    bars.innerHTML = '';
    stories.forEach((_, i) => {
        const sp = document.createElement('span'); const fill = document.createElement('i'); sp.appendChild(fill);
        if (i < storyIdx) sp.className = 'done';
        bars.appendChild(sp);
    });
    const fill = bars.children[storyIdx].firstChild;
    spinner.classList.add('on');

    const startBar = ms => {
        fill.style.transition = 'none'; fill.style.width = '0';
        void fill.offsetWidth;
        fill.style.transition = `width ${ms}ms linear`; fill.style.width = '100%';
    };

    if (s.type === 'video') {
        const v = document.createElement('video');
        v.playsInline = true; v.autoplay = true; v.preload = 'auto'; v.poster = s.thumb || '';
        v.src = s.src;
        v.onplaying = () => { spinner.classList.remove('on'); startBar((v.duration || 8) * 1000); };
        v.onended = nextStory;
        v.onerror = () => { spinner.classList.remove('on'); storyTimer = setTimeout(nextStory, 1500); };
        stage.insertBefore(v, stage.firstChild);
        v.play().catch(() => {});
    } else {
        const im = new Image(); im.draggable = false;
        im.onload = () => { spinner.classList.remove('on'); startBar(PHOTO_MS); storyTimer = setTimeout(nextStory, PHOTO_MS); };
        im.onerror = () => { spinner.classList.remove('on'); storyTimer = setTimeout(nextStory, 1500); };
        im.src = s.src;
        stage.insertBefore(im, stage.firstChild);
    }
}

function openStory(i) {
    storyIdx = i;
    document.getElementById('storyViewer').classList.add('open');
    document.body.style.overflow = 'hidden';
    showStory();
}
function nextStory() { if (storyIdx < stories.length - 1) { storyIdx++; showStory(); } else closeStory(); }
function prevStory() { if (storyIdx > 0) { storyIdx--; } showStory(); }
function closeStory() {
    clearStage();
    document.getElementById('storySpinner').classList.remove('on');
    document.getElementById('storyViewer').classList.remove('open');
    document.body.style.overflow = '';
    renderStories();
}

    { value: '1.4K',  label: 'Posts',       icon: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3V9z"/>' },
    { value: '320',   label: 'Media',       icon: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/>' }
];

    '<svg viewBox="0 0 32 32"><use href="#hp" fill="url(#gPink)" stroke="#fff" stroke-width="1.2"/></svg>',
    '<svg viewBox="0 0 32 32"><path d="M2.5 16c4-5 8-7.5 13.5-4.2C21.5 8.5 25.5 11 29.5 16c-4 8-9.5 10-13.5 10S6.5 24 2.5 16z" fill="url(#gLip)"/><path d="M3 16.2c8 3 18 3 26 0" fill="none" stroke="#7a0a30" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="11" cy="14.2" rx="3.2" ry="1.2" fill="#fff" opacity=".5"/></svg>',
    '<svg viewBox="0 0 40 36"><use href="#hp" x="0" y="5" width="22" height="22" fill="#ff3d78"/><use href="#hp" x="14" y="9" width="24" height="24" fill="url(#gPink)" stroke="#fff" stroke-width="1"/></svg>',
    '<svg viewBox="0 0 40 36"><use href="#hp" x="4" y="4" width="30" height="30" fill="url(#gRed)"/><use href="#st" x="26" y="0" width="10" height="10" fill="#ffe27a"/><use href="#st" x="0" y="2" width="7" height="7" fill="#fff"/><use href="#st" x="31" y="16" width="6" height="6" fill="#fff"/></svg>',
    '<svg viewBox="0 0 32 32"><g transform="rotate(-18 16 16)"><path d="M3 16c3.5-4.5 7-6.5 13-3.8 6-2.7 9.5-.7 13 3.8-3.5 7-8 9-13 9S6.5 23 3 16z" fill="#ff9ec4" stroke="#ff4d8d" stroke-width="1.4"/><path d="M4 16c7 2.6 17 2.6 24 0" fill="none" stroke="#ff4d8d" stroke-width="1.2" stroke-linecap="round"/></g><use href="#st" x="22" y="2" width="7" height="7" fill="#ff7fb0"/></svg>'
];

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)');
let pcLastFocus = null;

function initProfileCard() {
    const overlay = document.getElementById('pcOverlay');
    const sub = document.getElementById('pcSub');
    const bell = document.getElementById('pcBell');
    const heart = document.getElementById('pcHeart');

    document.getElementById('pcStats').innerHTML = PROFILE_STATS.map(s =>
        `<div class="pc-stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg><div><b>${s.value}</b><small>${s.label}</small></div></div>`
    ).join('');

    document.getElementById('pcClose').addEventListener('click', closeProfileCard);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeProfileCard(); });

    const chip = document.querySelector('.header-profile');
    chip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProfileCard(); } });

    sub.addEventListener('click', () => {
        const on = sub.classList.toggle('subscribed');
        sub.setAttribute('aria-pressed', on);
        document.getElementById('pcSubText').textContent = on ? 'Subscribed' : 'Subscribe';
        if (on) { setBell(true); ringBell(); }
    });

    bell.addEventListener('click', () => {
        const on = !bell.classList.contains('on');
        setBell(on);
        if (on) ringBell();
    });

    heart.addEventListener('click', () => loveBurst(heart));

    document.getElementById('pcPrivate').addEventListener('click', () => {
        closeProfileCard();
        openNaughtyWithLandAnimation();
    });
}

function setBell(on) {
    const bell = document.getElementById('pcBell');
    bell.classList.toggle('on', on);
    bell.setAttribute('aria-pressed', on);
    bell.setAttribute('aria-label', on ? 'Notifications on' : 'Notifications off');
}
function ringBell() {
    const bell = document.getElementById('pcBell');
    bell.classList.remove('ring-anim', 'glow');
    void bell.offsetWidth;
    bell.classList.add('ring-anim', 'glow');
    setTimeout(() => bell.classList.remove('ring-anim', 'glow'), 2200);
}

function openProfileCard() {
    const overlay = document.getElementById('pcOverlay');
    pcLastFocus = document.activeElement;
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.getElementById('pcCard').focus({ preventScroll: true });
}
function closeProfileCard() {
    const overlay = document.getElementById('pcOverlay');
    if (!overlay.classList.contains('open')) return;
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    if (location.hash === '#profile') history.replaceState(null, '', location.pathname + location.search);
    if (!document.getElementById('storyViewer').classList.contains('open') &&
        !document.getElementById('naughtyWindow').classList.contains('open')) document.body.style.overflow = '';
    if (pcLastFocus && pcLastFocus.focus) pcLastFocus.focus({ preventScroll: true });
}

function loveBurst(btn) {
    if (REDUCED_MOTION.matches) return;
    const layer = document.getElementById('loveLayer');
    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const order = shuffled(LOVE_STICKERS);
    const count = 5 + Math.round(Math.random());
    for (let i = 0; i < count; i++) {
        const size = 26 + Math.random() * 18;
        const p = document.createElement('div');
        p.className = 'love-p';
        p.style.width = p.style.height = size + 'px';
        p.innerHTML = order[i % order.length];
        layer.appendChild(p);
        const base = -Math.PI / 2;
        const ang = base + (Math.random() - .5) * Math.PI * 1.25;
        const dist = 70 + Math.random() * 90;
        const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 30 - Math.random() * 40;
        const rot = (Math.random() - .5) * 120, s0 = .3, s1 = .9 + Math.random() * .5;
        const x0 = cx - size / 2, y0 = cy - size / 2;
        const anim = p.animate([
            { transform: `translate(${x0}px,${y0}px) scale(${s0}) rotate(0deg)`, opacity: 0 },
            { transform: `translate(${x0 + dx * .45}px,${y0 + dy * .45}px) scale(${s1}) rotate(${rot * .5}deg)`, opacity: 1, offset: .3 },
            { transform: `translate(${x0 + dx}px,${y0 + dy - 40}px) scale(${s1 * .85}) rotate(${rot}deg)`, opacity: 0 }
        ], { duration: 1100 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
        anim.onfinish = anim.oncancel = () => p.remove();
    }
}

/* ESC key closes open modals */
document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
        if (document.getElementById('pcOverlay').classList.contains('open')) { closeProfileCard(); return; }
        closeStory();
        closeNaughtyWindow();
        closeModal();
    }
});
</script>
