<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1128">
<title>User Dashboard - OC Collection Universe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #0a1128;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
}

.bg-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background: #0a1128;
    transform: translateZ(0);
}

.bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    filter: blur(3px);
    transition: opacity .7s ease;
    will-change: opacity;
}

.bg-image.visible {
    opacity: 1;
}

.bg-shade {
    position: absolute;
    inset: 0;
    background: transparent;
}

#bgLoader {
    position: fixed;
    inset: 0;
    background: rgba(10,17,40,.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity .5s ease;
}

.spinner-box {
    width: 55px;
    height: 55px;
    border: 3px solid rgba(255,255,255,.1);
    border-top: 3px solid #ff708f;
    border-radius: 50%;
    animation: spinLoader .8s linear infinite;
    margin-bottom: 12px;
}

.loader-text {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

@keyframes spinLoader {
    to { transform: rotate(360deg); }
}

#dashboardWrapper {
    opacity: 0;
    transition: opacity .4s ease;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px 100px;
    position: relative;
    z-index: 2;
}

.header-nav {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 20px;
    z-index: 10;
}

.header-btn {
    position: relative;
    background: linear-gradient(145deg,#ff9bb0,#ff708f);
    border: 0;
    border-radius: 50px;
    color: #fff;
    cursor: pointer;
    box-shadow: 6px 6px 15px #0004;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .3s ease;
    text-decoration: none;
}

.refresh-btn {
    width: 95px;
    height: 38px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

.refresh-btn.loading {
    width: 38px;
    border-radius: 50%;
    color: transparent;
    pointer-events: none;
}

.refresh-btn.loading::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2.5px solid #ffffff66;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spinLoader .6s linear infinite;
}

.view-section {
    width: 100%;
    max-width: 440px;
    display: none;
    flex-direction: column;
    gap: 15px;
}

.view-section.active-view {
    display: flex;
}

.profile-card {
    background: rgba(20,25,45,.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid #ffffff1a;
    border-radius: 50px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    box-shadow: 0 10px 30px #0008;
    cursor: pointer;
    transition: transform .18s ease, border-color .3s ease;
}

.profile-card.blink-glow {
    background: linear-gradient(135deg, #ff708f4d, rgba(20,25,45,.85));
    border: 1.5px solid #ff708f;
    animation: cardBlink 2s infinite ease-in-out;
}

@keyframes cardBlink {
    0%, 100% { box-shadow: 0 0 10px #ff708f66; border-color: #ff708f80; }
    50% { box-shadow: 0 0 25px #ff708fe6; border-color: #ff708f; }
}

.user-info-wrapper {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 0;
    flex: 1;
}

.avatar-container {
    position: relative;
    flex: 0 0 50px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #ffffff33;
}

.avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
}

.image-shield {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: transparent;
}

.user-details h3 {
    font-size: 14px;
    color: #fff;
    font-weight: 700;
    line-height: 1.5;
}

.user-details p {
    font-size: 11px;
    color: #94a3b8;
    font-weight: 500;
    margin-top: 2px;
}

.live-badge-container {
    display: inline-flex;
    align-items: center;
    background: #000;
    border: 1px solid #ffffff1a;
    padding: 6px 14px;
    border-radius: 20px;
    flex-shrink: 0;
}

.live-dot {
    width: 9px;
    height: 9px;
    background: #ff1a1a;
    border-radius: 50%;
    box-shadow: 0 0 8px #ff1a1a;
    animation: livePulse 1.8s infinite;
    margin-right: 8px;
}

@keyframes livePulse {
    0%, 100% { transform: scale(1); }
    70% { transform: scale(1.18); }
}

.live-text {
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
}

.profile-card-modern {
    width: 100%;
    background: #1a1f2eed;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid #ffffff1f;
    border-radius: 28px;
    padding: 16px 16px 24px;
    color: #fff;
}

.card-image-wrapper {
    width: 100%;
    height: 280px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    background: #ffffff0d;
}

.card-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .3s ease;
}

.card-user-info {
    padding: 16px 6px 4px;
}

.name-row h2 {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
}

.username-text {
    font-size: 13px;
    color: #00bfff;
    margin-bottom: 12px;
}

.card-bio {
    font-size: 13px;
    color: #cbd5e1;
    padding: 10px 12px;
    background: #ffffff0a;
    border-radius: 12px;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

.telegram-meta-details {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid #ffffff14;
    padding-top: 12px;
}

.meta-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.meta-label {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
}

.meta-value {
    font-size: 13px;
    color: #fff;
    font-weight: 600;
    word-break: break-all;
}

.logout-action-btn {
    width: 100%;
    background: #ff4d4d26;
    color: #ff4d4d;
    border: 1px solid #ff4d4d4d;
    padding: 12px;
    border-radius: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 15px;
}

.bottom-glass-nav {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    width: 90%;
    max-width: 380px;
    height: 70px;
    background: #14192da6;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid #ffffff26;
    border-radius: 50px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 15px;
    z-index: 100;
    opacity: 0;
    transition: all .6s ease;
}

.bottom-glass-nav.slide-up {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

.nav-item {
    background: transparent;
    border: 0;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.nav-item svg {
    width: 22px;
    height: 22px;
    fill: #94a3b8;
    transition: fill .3s;
}

.nav-item.active {
    background: linear-gradient(135deg,#0088cc99,#00bfffcc);
    width: 58px;
    height: 58px;
}

.nav-item.active svg {
    fill: #fff;
}

.naughty-window {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #080d20;
    z-index: 2000;
    display: none;
    flex-direction: column;
}

.naughty-window.open {
    display: flex;
}

.naughty-window iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

/* OC COLLECTION UNIVERSE POPUP */
.oc-channel-window {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 5000;
    background: linear-gradient(125deg, #e5e8ad 0%, #9bc995 48%, #6ba88e 100%);
    color: #17211d;
}

.oc-channel-window.open {
    display: flex;
}

.oc-doodle-wallpaper {
    position: absolute;
    inset: -10%;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    color: rgba(35,95,69,.15);
    font-size: clamp(22px,4vw,38px);
    line-height: 2.7;
    letter-spacing: 10px;
    transform: rotate(-10deg) scale(1.1);
}

.oc-channel-header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 12px 0;
    width: 100%;
}

.oc-back-btn, .oc-menu-btn {
    flex: 0 0 54px;
    width: 54px;
    height: 54px;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(249,250,241,.94);
    cursor: pointer;
}

.oc-back-btn svg {
    width: 28px;
    height: 28px;
    stroke: #1c2522;
    fill: none;
    stroke-width: 2.5;
}

.oc-channel-title-pill {
    flex: 1;
    min-width: 0;
    padding: 5px 12px 5px 5px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 100px;
    background: rgba(255,255,255,.80);
    border: 1px solid rgba(255,255,255,.65);
}

.oc-channel-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
}

.oc-channel-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.oc-channel-title-text h2 {
    font-size: 14px;
    font-weight: 700;
    color: #171b1d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.oc-channel-title-text p {
    font-size: 11px;
    color: #778078;
}

.oc-menu-popover {
    position: absolute;
    top: 80px;
    right: 16px;
    z-index: 5;
    display: none;
    width: 220px;
    padding: 14px;
    flex-direction: column;
    gap: 8px;
    background: #f8f9f2;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

.oc-menu-popover.open {
    display: flex;
}

.oc-menu-popover button {
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: #dcebdc;
    color: #234d38;
    font-weight: 600;
    cursor: pointer;
}

.oc-channel-body {
    position: absolute;
    inset: 80px 10px 80px 10px;
    z-index: 2;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 10px;
}

.oc-channel-timeline {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.oc-date-pill, .oc-today-pill, .oc-joined-pill {
    padding: 6px 14px;
    color: #fff;
    background: rgba(35,133,92,.84);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
}

.oc-post-bubble {
    background: #ffffff;
    color: #17211d;
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 85%;
    align-self: flex-start;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    word-break: break-word;
    font-size: 14px;
}

.oc-post-bubble img, .oc-post-bubble video {
    width: 100%;
    border-radius: 8px;
    margin-top: 8px;
    max-height: 300px;
    object-fit: cover;
}

.oc-bottom-actions {
    position: absolute;
    z-index: 3;
    left: 14px;
    right: 14px;
    bottom: 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.oc-unmute-btn {
    flex: 1;
    height: 100%;
    border: none;
    border-radius: 100px;
    background: rgba(250,251,248,.95);
    color: #747c78;
    font-weight: 600;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="bgLoader">
    <div class="spinner-box"></div>
    <div class="loader-text">Loading Background...</div>
</div>

<div class="bg-container" id="bgContainer">
    <div class="bg-shade"></div>
</div>

<div id="dashboardWrapper">

    <div class="header-nav">
        <button id="refreshBtn" onclick="triggerRefresh(this)" class="header-btn refresh-btn">REFRESH</button>
    </div>

    <div id="homeView" class="view-section active-view">

        <div class="profile-card blink-glow" onclick="openNaughtyWithLandAnimation()">
            <div class="user-info-wrapper">
                <div class="avatar-container">
                    <img src="https://carder.top/imagens/1792065172414-739661966.jpg" alt="Naughty NonStop" class="avatar">
                    <div class="image-shield"></div>
                </div>
                <div class="user-details">
                    <h3>⛔Naughty NonStop🚫</h3>
                    <p>Open Media 💋</p>
                </div>
            </div>
            <div class="live-badge-container">
                <span class="live-dot"></span>
                <span class="live-text">LIVE</span>
            </div>
        </div>

        <div class="profile-card blink-glow" onclick="openOCChannel()">
            <div class="user-info-wrapper">
                <div class="avatar-container">
                    <img src="https://carder.top/imagens/1792065174675-662575987.jpg" alt="OC Collection Universe" class="avatar">
                    <div class="image-shield"></div>
                </div>
                <div class="user-details">
                    <h3>𝗢𝗖 𝗖𝗼𝗹𝗹𝗲𝗰𝘁𝗶𝗼𝗻 𝗨𝗻𝗶𝘃𝗲𝗿𝘀𝗲 🍒</h3>
                    <p>Open Channel</p>
                </div>
            </div>
            <div class="live-badge-container">
                <span class="live-dot"></span>
                <span class="live-text">LIVE</span>
            </div>
        </div>

    </div>

    <!-- OC COLLECTION UNIVERSE POPUP -->
    <div class="oc-channel-window" id="ocChannelWindow" aria-hidden="true">
        <div class="oc-doodle-wallpaper" aria-hidden="true">☆ ♡ ✧ ♧ ◇ ☆ ♡ ✿ ♬</div>

        <div class="oc-channel-header">
            <button class="oc-back-btn" type="button" onclick="closeOCChannel()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
            </button>
            <div class="oc-channel-title-pill">
                <div class="oc-channel-avatar">
                    <img src="https://carder.top/imagens/1792065174675-662575987.jpg" alt="OC">
                </div>
                <div class="oc-channel-title-text">
                    <h2>OC Collection Universe 🍒</h2>
                    <p>public channel</p>
                </div>
            </div>
        </div>

        <div class="oc-channel-body">
            <div class="oc-channel-timeline">
                <div class="oc-today-pill">Today</div>
                <div class="oc-joined-pill">You joined this channel</div>
            </div>
            <div id="channelPostsContainer" style="display: flex; flex-direction: column; gap: 10px; width: 100%;"></div>
        </div>

        <div class="oc-bottom-actions">
            <button class="oc-unmute-btn" type="button" onclick="this.textContent = this.textContent === 'Unmute' ? 'Mute' : 'Unmute'">Unmute</button>
        </div>
    </div>

    <!-- NAUGHTY NONSTOP WINDOW -->
    <div class="naughty-window" id="naughtyWindow">
        <iframe src="naughty.html" title="Naughty NonStop"></iframe>
    </div>

</div>

<script>
const backgroundImages = [
    "https://carder.top/imagens/1792211356900-71480222.jpg",
    "https://carder.top/imagens/1792211360124-891549584.jpg"
];

function initRandomBackground() {
    const container = document.getElementById('bgContainer');
    const loader = document.getElementById('bgLoader');
    if (!container) return;
    
    const selected = backgroundImages[Math.floor(Math.random() * backgroundImages.length)];
    const img = new Image();
    img.className = 'bg-image';
    img.onload = () => {
        container.insertBefore(img, container.querySelector('.bg-shade'));
        requestAnimationFrame(() => img.classList.add('visible'));
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }
    };
    img.src = selected;
}

if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.replace('verify.html');
} else {
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dashboardWrapper').style.opacity = '1';
        initRandomBackground();
    });
}

function openNaughtyWithLandAnimation() {
    document.getElementById('naughtyWindow').classList.add('open');
}

function openOCChannel() {
    document.getElementById('ocChannelWindow').classList.add('open');
    fetchChannelPosts();
}

function closeOCChannel() {
    document.getElementById('ocChannelWindow').classList.remove('open');
}

function fetchChannelPosts() {
    fetch('/api/channel/posts')
        .then(res => res.json())
        .then(data => {
            if (data.ok && data.posts) {
                renderChannelPosts(data.posts);
            }
        })
        .catch(err => console.error("Error fetching channel posts:", err));
}

function renderChannelPosts(posts) {
    const container = document.getElementById('channelPostsContainer');
    if (!container) return;

    container.innerHTML = '';

    posts.forEach(post => {
        const bubble = document.createElement('div');
        bubble.className = 'oc-post-bubble';

        if (post.text) {
            const textEl = document.createElement('div');
            textEl.textContent = post.text;
            bubble.appendChild(textEl);
        }

        if (post.media_type === 'photo') {
            const img = document.createElement('img');
            img.src = `/api/channel/media/${post.id}`;
            bubble.appendChild(img);
        } else if (post.media_type === 'video') {
            const video = document.createElement('video');
            video.src = `/api/channel/media/${post.id}`;
            video.controls = true;
            video.preload = "metadata";
            bubble.appendChild(video);
        }

        container.appendChild(bubble);
    });
}

function triggerRefresh(button) {
    button.classList.add('loading');
    setTimeout(() => window.location.reload(), 300);
}
</script>

</body>
</html>
