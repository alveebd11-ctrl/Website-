<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile / Leaderboard - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: #0a1128; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* ব্যাকগ্রাউন্ড ভিডিও */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(0.4);
        }

        /* হেডার ন্যাভবার */
        .header-nav {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            z-index: 10;
        }

        .header-btn {
            position: relative;
            background: linear-gradient(145deg, #ff9bb0, #ff708f);
            border: none;
            border-radius: 50px;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.3), 
                        -3px -3px 10px rgba(255, 155, 176, 0.4),
                        inset 2px 2px 4px rgba(255, 255, 255, 0.4),
                        inset -2px -2px 4px rgba(180, 50, 80, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .header-btn:hover {
            transform: scale(1.05);
        }

        /* বাম পাশের হোম বাটন */
        .home-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .home-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .refresh-btn {
            width: 95px;
            height: 38px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .refresh-btn.loading {
            width: 38px;
            border-radius: 50%;
            color: transparent;
            pointer-events: none;
            animation: pulseShrink 0.4s ease forwards;
        }

        .refresh-btn.loading::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes pulseShrink {
            0% { transform: scale(1); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* প্রোফাইল লিস্ট কন্টেইনার */
        .profile-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2;
        }

        .profile-card {
            background: rgba(20, 25, 45, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .profile-card.active-glow {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.4), rgba(20, 25, 45, 0.85));
            border: 1.5px solid #00bfff;
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.4), inset 0 0 10px rgba(0, 191, 255, 0.3);
        }

        .profile-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .user-info-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .user-details h3 {
            font-size: 15px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .user-details p {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .balance-badge {
            font-size: 15px;
            font-weight: 700;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        /* মোডাল পপআপ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 999;
        }
        .modal-box {
            background: #141c3a; border: 1px solid rgba(255,255,255,0.15); width: 90%; max-width: 340px; padding: 25px;
            border-radius: 20px; text-align: center; color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-box h3 { margin-bottom: 10px; color: #00bfff; }
        .modal-box p { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; }
        .close-btn {
            background: #ff708f; color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ভিডিও -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
    </video>

    <!-- হেডার ন্যাভবার -->
    <div class="header-nav">
        <!-- হোম বাটন (ক্লিক করলে verify.html এ যাবে) -->
        <a href="verify.html" class="header-btn home-btn" title="Home">
            <svg class="home-icon" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>
        <!-- রিফ্রেশ বাটন -->
        <button id="refreshBtn" onclick="triggerRefresh(this)" class="header-btn refresh-btn">REFRESH</button>
    </div>

    <!-- প্রোফাইল কার্ড লিস্ট -->
    <div class="profile-container">
        
        <div class="profile-card active-glow" onclick="openProfile('Royal_Ninja', 'Level 292', '+$1521')">
            <div class="user-info-wrapper">
                <img src="https://carder.top/imagens/1791918460640-323067073.jpg" alt="Avatar" class="avatar">
                <div class="user-details">
                    <h3>Royal_Ninja</h3>
                    <p>Level 292</p>
                </div>
            </div>
            <div class="balance-badge">+$1521</div>
        </div>

        <div class="profile-card" onclick="openProfile('Killer_007', 'Level 124', '+$945')">
            <div class="user-info-wrapper">
                <img src="https://carder.top/imagens/1791918463157-201532531.jpg" alt="Avatar" class="avatar">
                <div class="user-details">
                    <h3>Killer_007</h3>
                    <p>Level 124</p>
                </div>
            </div>
            <div class="balance-badge">+$945</div>
        </div>

        <div class="profile-card" onclick="openProfile('Ghost_Buster', 'Level 90', '+$450')">
            <div class="user-info-wrapper">
                <img src="https://carder.top/imagens/1791918465627-141146469.jpg" alt="Avatar" class="avatar">
                <div class="user-details">
                    <h3>Ghost_Buster</h3>
                    <p>Level 90</p>
                </div>
            </div>
            <div class="balance-badge">+$450</div>
        </div>

        <div class="profile-card" onclick="openProfile('Grand_Master', 'Level 35', '+$124')">
            <div class="user-info-wrapper">
                <img src="https://carder.top/imagens/1791918468080-915885205.jpg" alt="Avatar" class="avatar">
                <div class="user-details">
                    <h3>Grand_Master</h3>
                    <p>Level 35</p>
                </div>
            </div>
            <div class="balance-badge">+$124</div>
        </div>

        <div class="profile-card" onclick="openProfile('Warrior909', 'Level 24', '+$78')">
            <div class="user-info-wrapper">
                <img src="https://carder.top/imagens/1791918470834-230739368.jpg" alt="Avatar" class="avatar">
                <div class="user-details">
                    <h3>Warrior909</h3>
                    <p>Level 24</p>
                </div>
            </div>
            <div class="balance-badge">+$78</div>
        </div>

    </div>

    <!-- মোডাল পপআপ -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-box">
            <h3 id="modalName">User Profile</h3>
            <p id="modalInfo">Details about user...</p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        function triggerRefresh(btn) {
            btn.classList.add('loading');
            setTimeout(() => {
                location.reload();
            }, 700);
        }

        function openProfile(name, level, balance) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalInfo').innerText = `Status: Active\nLevel: ${level}\nTotal Earnings: ${balance}`;
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('profileModal').style.display = 'none';
        }
    </script>
</body>
</html>
