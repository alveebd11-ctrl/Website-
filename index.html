  <style>
    :root {
      color-scheme: dark;
      --pink: #ff708f;
      --pink-light: #ff9bb0;
      --blue: #0088cc;
      --cyan: #00e5ff;
      --panel: rgba(15, 15, 15, 0.58);
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 88px 16px 24px;
      background: #0a0a0a;
      color: var(--white);
      isolation: isolate;
    }

    /* Background video: 3px blur, no dark overlay */
    .video-background-container {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: #111;
    }

    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(-50%, -50%) scale(1.04);
      filter: blur(3px);
      opacity: 0;
      transition: opacity 500ms ease-in-out;
    }

    .bg-video.active {
      opacity: 1;
    }

    /* Refresh button */
    .header-nav {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: max(15px, env(safe-area-inset-top)) 18px 15px;
      pointer-events: none;
    }

    .refresh-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 105px;
      min-height: 40px;
      padding: 10px 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: linear-gradient(145deg,var(--pink-light),var(--pink));
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 8px 22px rgba(255,112,143,.28);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255,112,143,.38);
    }

    .refresh-btn:active {
      transform: scale(.96);
    }

    .refresh-btn:disabled {
      cursor: wait;
      opacity: .8;
    }

    .refresh-icon {
      display: inline-block;
      font-size: 15px;
      line-height: 1;
      transition: transform 500ms ease;
    }

    .refresh-btn:hover .refresh-icon {
      transform: rotate(180deg);
    }

    .refresh-btn.loading {
      min-width: 40px;
      width: 40px;
      padding: 0;
      color: transparent;
      gap: 0;
    }

    .refresh-btn.loading .refresh-label,
    .refresh-btn.loading .refresh-icon {
      opacity: 0;
    }

    .refresh-btn.loading::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 650ms linear infinite;
    }

    /* Refresh overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: rgba(10,10,10,.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 250ms ease, visibility 250ms ease;
    }

    .loading-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255,255,255,.18);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .loading-text {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main glass card */
    .glass-box {
      position: relative;
      z-index: 3;
      width: min(100%, 440px);
      padding: 32px 22px 24px;
      border: 1px solid rgba(255,100,125,.9);
      border-radius: 25px;
      background: var(--panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: center;
      color: #fff;
      box-shadow:
        0 18px 45px rgba(0,0,0,.45),
        0 0 24px rgba(255,51,51,.16);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .crimson-orb {
      display: flex;
      flex: 0 0 36px;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid #ff9999;
      border-radius: 50%;
      background: radial-gradient(circle,#ff4d4d,#a80000);
      box-shadow: 0 0 12px rgba(255,51,51,.55),inset 0 0 5px #fff;
    }

    .crimson-orb span {
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      text-shadow: 0 0 5px #000;
    }

    .main-title {
      flex: 1;
      font-size: clamp(14px,3.7vw,17px);
      font-weight: 800;
      letter-spacing: .2px;
      line-height: 1.35;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,.8);
    }

    .neon-shield {
      flex: 0 0 29px;
      width: 29px;
      height: 29px;
      filter: drop-shadow(0 0 7px var(--cyan));
    }

    .sub-message {
      margin: 0 0 24px;
      padding: 0 3px;
      color: #f8fafc;
      font-size: 13px;
      line-height: 1.8;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }

    .small-icon {
      display: inline-block;
      margin: 0 2px;
      vertical-align: middle;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      margin-bottom: 13px;
      padding: 14px 16px;
      border: 1px solid transparent;
      border-radius: 15px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .35px;
      cursor: pointer;
      transition: transform 180ms ease,background 180ms ease,box-shadow 180ms ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-telegram {
      border-color: rgba(255,255,255,.24);
      background: rgba(255,255,255,.11);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-telegram:hover {
      background: rgba(255,255,255,.2);
    }

    .btn-verify {
      margin-bottom: 0;
      border: 0;
      background: linear-gradient(135deg,#0799dc,#006aa9);
      box-shadow: 0 0 16px rgba(0,136,204,.3);
      animation: zoomInOut 1.8s ease-in-out infinite alternate;

    .btn-verify:hover {

    @keyframes zoomInOut {
      from { transform: scale(1); }

    .privacy-note {
      margin-top: 16px;
      color: rgba(255,255,255,.72);
      font-size: 10px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      body {
        padding: 76px 12px 18px;
      }

      .header-nav {
        padding-right: 12px;
      }

      .glass-box {
        padding: 26px 16px 20px;
        border-radius: 21px;

      .crimson-orb {
        flex-basis: 32px;
        width: 32px;
        height: 32px;
      }

      .neon-shield {
        flex-basis: 25px;
        width: 25px;
        height: 25px;
      }

      .sub-message {
        font-size: 12px;
      }

      .btn {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    const video1 = document.getElementById("video1");
    const video2 = document.getElementById("video2");
    const refreshBtn = document.getElementById("refreshBtn");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const ageConfirmBtn = document.getElementById("ageConfirmBtn");

    const MIN_CLIP = 5;
    const MAX_CLIP = 6;
    const META_TIMEOUT = 12000;
    const WORKERS = 3;

    let activeVideo = video1;
    let standbyVideo = video2;
    let clipQueue = [];
    let lastSource = "";
    let switchTimer = null;
    let switchToken = 0;

    const indexedSources = new Set();

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function insertRandomly(clip) {
      const at = Math.floor(Math.random() * (clipQueue.length + 1));
      clipQueue.splice(at, 0, clip);
    }

    function addSegments(src, duration) {
      if (!Number.isFinite(duration) || duration <= 0) {
        insertRandomly({
          src,
          start: 0,
          length: 5.5
        });
        return;
      }

      const count = Math.max(1, Math.ceil(duration / 5.5));
      const segmentLength = duration / count;
      const segments = [];

      for (let i = 0; i < count; i++) {
        const start = i * segmentLength;
        const length = Math.min(segmentLength, duration - start);

        segments.push({
          src,
          start,
          length: Math.min(MAX_CLIP, Math.max(0.5, length))
        });
      }

      shuffle(segments);
      segments.forEach(insertRandomly);
    }

    function readDuration(src) {
      return new Promise(resolve => {
        const probe = document.createElement("video");
        let done = false;

        const timer = setTimeout(() => finish(null), META_TIMEOUT);

        function finish(duration) {
          if (done) return;
          done = true;

          clearTimeout(timer);
          probe.onloadedmetadata = null;
          probe.onerror = null;
          probe.removeAttribute("src");
          probe.load();

          resolve(
            Number.isFinite(duration) && duration > 0
              ? duration
              : null
          );
        }

        probe.preload = "metadata";
        probe.muted = true;
        probe.playsInline = true;

        probe.onloadedmetadata = () => finish(probe.duration);
        probe.onerror = () => finish(null);

        probe.src = src;
        probe.load();
      });
    }

    async function indexSource(src) {
      if (indexedSources.has(src)) return;

      indexedSources.add(src);

      const duration = await readDuration(src);
      addSegments(src, duration);
    }

    async function indexRemainingSources(firstSrc) {
      const remaining = shuffle(
        videoSources.filter(src => src !== firstSrc)
      );

      let cursor = 0;

      async function worker() {
        while (cursor < remaining.length) {
          const src = remaining[cursor++];
          await indexSource(src);
        }
      }

      await Promise.all(
        Array.from(
          { length: Math.min(WORKERS, remaining.length) },
          () => worker()
        )
      );
    }

    function nextClip() {
      if (!clipQueue.length) {
        const src =
          videoSources[Math.floor(Math.random() * videoSources.length)];

        return {
          src,
          start: 0,
          length: 5.5
        };
      }

      let choices = clipQueue;

      if (
        lastSource &&
        clipQueue.some(clip => clip.src !== lastSource)
      ) {
        choices = clipQueue.filter(
          clip => clip.src !== lastSource
        );
      }

      const clip =
        choices[Math.floor(Math.random() * choices.length)];

      const index = clipQueue.indexOf(clip);

      if (index >= 0) {
        clipQueue.splice(index, 1);
      }

      return clip;
    }

    function waitFor(video, eventName, timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        let done = false;

        const timer = setTimeout(() => {
          finish(new Error("Video load timed out"));
        }, timeoutMs);

        function cleanup() {
          clearTimeout(timer);
          video.removeEventListener(eventName, onReady);
          video.removeEventListener("error", onError);
        }

        function finish(error) {
          if (done) return;
          done = true;
          cleanup();

          if (error) reject(error);
          else resolve();
        }

        function onReady() {
          finish();
        }

        function onError() {
          finish(new Error("Video load failed"));
        }

        video.addEventListener(eventName, onReady, { once: true });
        video.addEventListener("error", onError, { once: true });
      });
    }

    async function playClip(clip, token) {
      const next = standbyVideo;
      const previous = activeVideo;

      try {
        next.pause();
        next.removeAttribute("src");
        next.load();

        next.src = clip.src;
        next.load();

        if (next.readyState < 1) {
          await waitFor(next, "loadedmetadata", META_TIMEOUT);
        }

        if (token !== switchToken) return;

        const duration = Number.isFinite(next.duration)
          ? next.duration
          : clip.start + clip.length;

        const clipLength = Math.min(
          clip.length || 5.5,
          duration
        );

        const maxStart = Math.max(0, duration - clipLength);
        const start = Math.min(
          Math.max(0, clip.start),
          maxStart
        );

        if (start > 0.1) {
          try {
            const seekPromise = waitFor(next, "seeked", 5000);
            next.currentTime = start;
            await seekPromise;
          } catch (_) {
            /* Continue if precise seeking is unavailable. */
          }
        }

        if (token !== switchToken) return;

        next.muted = true;
        next.playsInline = true;

        await next.play();

        if (token !== switchToken) {
          next.pause();
          return;
        }

        next.classList.add("active");
        previous.classList.remove("active");

        setTimeout(() => previous.pause(), 450);

        activeVideo = next;
        standbyVideo = previous;
        lastSource = clip.src;

        clearTimeout(switchTimer);

        const actualLength = Math.min(
          MAX_CLIP,
          Math.max(MIN_CLIP, clip.length || 5.5)
        );

        switchTimer = setTimeout(
          playNextClip,
          actualLength * 1000
        );

      } catch (error) {
        console.warn("Background clip could not play:", error.message);

        if (token === switchToken) {
          clearTimeout(switchTimer);
          switchTimer = setTimeout(playNextClip, 500);
        }
      }
    }

    function playNextClip() {
      const token = ++switchToken;
      playClip(nextClip(), token);
    }

    async function startVideos() {
      const candidates = shuffle([...videoSources]);

      let firstSrc = candidates[0];
      let duration = null;

      for (const src of candidates) {
        duration = await readDuration(src);

        if (duration) {
          firstSrc = src;
          break;
        }
      }

      indexedSources.add(firstSrc);
      addSegments(firstSrc, duration);

      playNextClip();

      indexRemainingSources(firstSrc).catch(error => {
        console.warn("Some video metadata could not be loaded:", error);
      });
    }

    /* Refresh page */
    refreshBtn.addEventListener("click", () => {
      if (refreshBtn.disabled) return;

      refreshBtn.disabled = true;
      refreshBtn.classList.add("loading");
      loadingOverlay.classList.add("show");

      setTimeout(() => {
        window.location.reload();
      }, 700);
    });

    /*
      Continue button:
      No popup. No login credentials are collected.
      Open the site's chat page directly.
    */
    ageConfirmBtn.addEventListener("click", () => {
      window.location.href =
        "https://alveecommunity.com/naughty.html";
    });

    startVideos();
  </script>
</body>
