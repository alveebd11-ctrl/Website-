<!DOCTYPE html>

<head>

<body>
    <div class="overlay"></div>

        <div class="content-box">
            
            <!-- Title with Custom SVG Icons -->

                        <line x1="6" y1="6" x2="18" y2="18" stroke="#ff3333" stroke-width="2"/>
                    </svg>
                </div>
                
                <span class="title-text">Welcome! Verify Your Age</span> 
                
                <div class="icon-group">
                    <svg viewBox="0 0 24 24" width="22" height="22" class="custom-shield">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="sparkles-container">
                        <svg viewBox="0 0 24 24" width="12" height="12" class="sparkle s1"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z" fill="#ffea00"/></svg>
                        <svg viewBox="0 0 24 24" width="9" height="9" class="sparkle s2"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z" fill="#ffea00"/></svg>
                    </div>
                </div>
            </h2>
            
            <!-- Subtitle with Custom Badges -->
            <p class="subtitle">
                <span class="badge-18">18+</span> To access our age-restricted content, please confirm that you are 18 years or older and complete a quick human verification. 
                <span class="subtitle-icons">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffd700">
                        <path d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V12a2 2 0 00-2-2h-1V7c0-2.757-2.243-5-5-5zm-3 5c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm3 11.5c-1.103 0-2-.897-2-2s.897-2 2-2 2 .897 2 2-.897 2-2 2z"/>
                    </svg>
                    <svg viewBox="0 0 24 24" width="14" height="14">
                        <rect width="24" height="24" rx="4" fill="#00e676"/>
                        <path d="M7 12l3.5 3.5 6.5-7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </p>

            <!-- Telegram Login Widget (Replacing old buttons) -->
            <div style="display: flex; justify-content: center; margin-top: 20px;">
                <script async src="https://telegram.org/js/telegram-widget.js?22" 
                        data-telegram-login="Desi_Magi909_Bot" 
                        data-size="large" 
                        data-onauth="onTelegramAuth(user)" 
                        data-request-access="write"></script>
            </div>

        </div>
    </div>

    <!-- ব্যাকএন্ডে ডেটা পাঠানোর জাভাস্ক্রিপ্ট -->
    <script>
        function onTelegramAuth(user) {
            // Render থেকে পাওয়া লিংকটি পরে এখানে বসাতে হবে
            fetch('https://আপনার-সার্ভারের-লিংক/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(user)
            })
            .then(response => response.json())
            .then(data => {
                alert("Verification Successful! 🔞");
                // ভেরিফাই হওয়ার পর সরাসরি আপনার বটে নিয়ে যাবে
                window.location.href = "https://t.me/Desi_Magi909_Bot?start=start"; 
            });
        }
    </script>
