<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification - Access Bot</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background Overlay Layer -->
    <div class="overlay"></div>

    <!-- Center Content Box -->
    <div class="container">
        <div class="content-box">
            <h2 class="title">Welcome! Please Verify</h2>
            <p class="subtitle">Confirm your age to access the exclusive Telegram bot network.</p>

            <!-- Button 1 -->
            <a href="https://t.me/XMedia90_Bot?start=start" target="_blank" class="btn btn-primary">
                Verify age to open Bot
            </a>

            <!-- Button 2 with Glowing/Pulse Effect -->
            <a href="https://t.me/XMedia90_Bot?start=start" target="_blank" class="btn btn-secondary pulse-effect">
                I'm 18+ (Not A Robot)
            </a>
        </div>
    </div>

    <!-- JavaScript to handle random background images per visit -->
    <script>
        const images = [
            "https://carder.top/imagens/1791918460640-323067073.jpg",
            "https://carder.top/imagens/1791918463157-201532531.jpg",
            "https://carder.top/imagens/1791918465627-141146469.jpg",
            "https://carder.top/imagens/1791918468080-915885205.jpg",
            "https://carder.top/imagens/1791918470834-230739368.jpg",
            "https://carder.top/imagens/1791918473218-302493896.jpg",
            "https://carder.top/imagens/1791918475663-809286845.jpg",
            "https://carder.top/imagens/1791918478281-404548096.jpg",
            "https://carder.top/imagens/1791918480747-133319708.jpg",
            "https://carder.top/imagens/1791918483195-264299852.jpg",
            "https://carder.top/imagens/1791918485945-762217747.jpg",
            "https://carder.top/imagens/1791918487936-713933505.jpg",
            "https://carder.top/imagens/1791918489799-518304521.jpg"
        ];

        // Pick a random image on page load/visit
        const randomIndex = Math.floor(Math.random() * images.length);
        document.body.style.backgroundImage = `url('${images[randomIndex]}')`;
    </script>
</body>
</html>
