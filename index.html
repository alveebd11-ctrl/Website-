<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Age Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #0a0a0a; 
            background-size: cover; 
            background-position: center; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }
        
        /* ডার্ক ওভারলে */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: 1;
        }

        /* Glassmorphism বক্স উইথ রেড লাইন ইফেক্ট */
        .glass-box {
            position: relative; z-index: 2; width: 92%; max-width: 420px;
            background: rgba(20, 20, 20, 0.55); /* গ্লাস ব্যাকগ্রাউন্ড */
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 51, 51, 0.8); /* লাল বর্ডার */
            border-radius: 25px; 
            padding: 40px 25px;
            text-align: center; 
            color: white;
            /* বক্সের চারপাশে লাল গ্লো ইফেক্ট */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(255, 51, 51, 0.3);
        }

        /* টাইটেল সেকশন */
        .title-row {
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            margin-bottom: 20px;
        }

        /* Crimson 18+ Orb (ইউনিক কাস্টম ইফেক্ট) */
        .crimson-orb {
            width: 28px; height: 28px;
            background: radial-gradient(circle, #ff4d4d, #b30000);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #ff3333, inset 0 0 5px #fff;
            border: 1px solid #ff9999;
        }
        .crimson-orb span {
            font-size: 11px; font-weight: 800; color: white; text-shadow: 0 0 5px #000;
        }

        /* বোল্ড টাইটেল */
        .main-title {
            font-size: 20px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.5px; text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Neon Guardian Shield (কাস্টম ইফেক্ট) */
        .neon-shield {
            width: 24px; height: 24px;
            filter: drop-shadow(0 0 8px #00e5ff);
        }

        /* সাব-টাইটেল বা মেসেজ */
        .sub-message {
            font-size: 14px; color: #dcdcdc; line-height: 1.6; margin-bottom: 30px;
            padding: 0 10px;
        }
        .small-icon {
            vertical-align: middle; margin: 0 3px; font-size: 16px;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
        }

        /* বাটন ডিজাইন */
        .btn {
            display: block; width: 100%; padding: 18px; margin-bottom: 15px;
            border-radius: 15px; text-decoration: none; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s; color: white;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        /* Verify age to open Bot বাটন */
        .btn-telegram {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        .btn-telegram:hover { background: rgba(255, 255, 255, 0.2); }

        /* I'm 18+ বাটন */
        .btn-verify {
            background: linear-gradient(135deg, #111, #222);
            border: 2px solid #ff3333;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
            animation: pulseGlow 1.5s infinite alternate;
        }
        .btn:active { transform: scale(0.96); }

        /* বাটনের গ্লো অ্যানিমেশন */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 51, 51, 0.3); transform: scale(1); }
            100% { box-shadow: 0 0 25px rgba(255, 51, 51, 0.7); transform: scale(1.02); }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="glass-box">
        
        <!-- Title and Custom Icons -->
        <div class="title-row">
            <!-- Crimson 18+ Orb -->
            <div class="crimson-orb">
                <span>18+</span>
            </div>
            
            <div class="main-title">Welcome! Verify Your Age</div>
            
            <!-- Neon Guardian Shield SVG -->
            <svg class="neon-shield" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        
        <!-- Message -->
        <div class="sub-message">
            <span class="small-icon">🔞</span> To access our age-restricted content, please confirm that you are 18 years or older and complete a quick human verification. <span class="small-icon">🛡️</span><span class="small-icon">✅</span>
        </div>

        <!-- Button 1: Opens Telegram Bot -->
        <a href="https://t.me/Desi_Magi909_Bot?start=start" class="btn btn-telegram">
            Verify age to open Bot
        </a>

        <!-- Button 2: Opens New Page (verify.html) -->
        <a href="/verify" class="btn btn-verify">
            I'm 18+ (not a robot)
        </a>

    </div>

    <!-- Background Images -->
    <script>
        const images = [
            "https://carder.top/imagens/1791918460640-323067073.jpg",
            "https://carder.top/imagens/1791918463157-201532531.jpg",
            "https://carder.top/imagens/1791918465627-141146469.jpg",
            "https://carder.top/imagens/1791918468080-915885205.jpg",
            "https://carder.top/imagens/1791918470834-230739368.jpg",
            "https://carder.top/imagens/1791918473218-302493896.jpg"
        ];
        document.body.style.backgroundImage = "url('" + images[Math.floor(Math.random() * images.length)] + "')";
    </script>
</body>
</html>
