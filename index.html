<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Code - Access Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #111; 
            background-size: cover; 
            background-position: center; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: 1;
        }
        .container {
            position: relative; z-index: 2; width: 90%; max-width: 380px;
            display: flex; flex-direction: column; align-items: center;
        }
        .header-box {
            background: white; padding: 20px; border-radius: 15px;
            width: 100%; text-align: center; margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            position: relative;
        }
        .header-icon {
            font-size: 45px; position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
        }
        .header-box h2 {
            margin-top: 15px; font-size: 18px; color: #333; font-weight: 600;
        }
        .code-display {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .code-box {
            width: 55px; height: 65px; border: 2px solid rgba(255,255,255,0.7);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: white; font-weight: bold; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        .btn-see-code {
            background: #5DADE2; color: white; width: 100%; padding: 15px;
            border-radius: 10px; text-decoration: none; text-align: center;
            font-weight: 800; font-size: 18px; margin-bottom: 20px; border: none; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .keypad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%;
        }
        .key-btn {
            background: #5DADE2; color: white; border: none; padding: 20px;
            font-size: 24px; font-weight: 700; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.1s;
        }
        .key-btn:active { background: #3498DB; transform: scale(0.95); }
        .key-btn.empty { background: transparent; box-shadow: none; cursor: default; }
        .key-btn.backspace { font-size: 24px; background: #5DADE2; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        
        <!-- Header Box -->
        <div class="header-box">
            <div class="header-icon">📱</div>
            <h2>Enter code to unlock 🔞</h2>
        </div>

        <!-- 4 Digit Code Boxes -->
        <div class="code-display" id="codeDisplay">
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
            <div class="code-box"></div>
        </div>

        <!-- See Code Button -->
        <button class="btn-see-code" onclick="alert('Join our Telegram channel to get the code!')">SEE CODE 👀</button>

        <!-- Number Keypad -->
        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <div class="key-btn empty"></div>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn backspace" onclick="deleteKey()">⌫</button>
        </div>
    </div>

    <script>
        let currentCode = "";
        const MAX_LENGTH = 4; // ৪ ডিজিটের কোড
        const boxes = document.querySelectorAll('.code-box');

        // বক্সগুলোতে নাম্বার দেখানোর ফাংশন
        function updateDisplay() {
            for (let i = 0; i < MAX_LENGTH; i++) {
                boxes[i].innerText = currentCode[i] || "";
            }
        }

        // বাটন চাপলে কাজ করবে
        function pressKey(num) {
            if (currentCode.length < MAX_LENGTH) {
                currentCode += num;
                updateDisplay();
                
                // যদি ৪ ডিজিট দেওয়া হয়ে যায়, তবে সরাসরি টেলিগ্রাম পেজে পাঠিয়ে দেবে
                if (currentCode.length === MAX_LENGTH) {
                    setTimeout(() => {
                        window.location.href = "/verify"; // রিডাইরেক্ট লিংক
                    }, 400); // 0.4 সেকেন্ড পর রিডাইরেক্ট হবে
                }
            }
        }

        // ব্যাকস্পেস (ডিলিট) বাটন
        function deleteKey() {
            if (currentCode.length > 0) {
                currentCode = currentCode.slice(0, -1);
                updateDisplay();
            }
        }

        // Random Background Images
        const images = [
            "https://carder.top/imagens/1791918460640-323067073.jpg",
            "https://carder.top/imagens/1791918463157-201532531.jpg",
            "https://carder.top/imagens/1791918465627-141146469.jpg",
            "https://carder.top/imagens/1791918468080-915885205.jpg",
            "https://carder.top/imagens/1791918470834-230739368.jpg",
            "https://carder.top/imagens/1791918473218-302493896.jpg",
            "https://carder.top/imagens/1791918475663-809286845.jpg",
            "https://carder.top/imagens/1791918478281-404548096.jpg",
            "https://carder.top/imagens/1791918480747-133319708.jpg"
        ];
        document.body.style.backgroundImage = "url('" + images[Math.floor(Math.random() * images.length)] + "')";
    </script>
</body>
</html>
