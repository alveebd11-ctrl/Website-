<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Age Verification — Access Bot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --pink: #ff708f;
      --pink-light: #ff9bb0;
      --blue: #0088cc;
      --cyan: #00e5ff;
      --panel: rgba(15, 15, 15, 0.58);
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 88px 16px 24px;
      background: #0a0a0a;
      color: var(--white);
      isolation: isolate;
    }

    /* Background video layer */
    .video-background-container {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: #000;
    }

    .video-background-container::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.7)),
        linear-gradient(135deg, rgba(255, 51, 85, 0.12), rgba(0, 0, 0, 0.56));
    }

    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      filter: blur(2px) brightness(0.72);
      opacity: 0;
      transition: opacity 500ms ease-in-out;
    }

    .bg-video.active {
      opacity: 1;
    }

    /* Top navigation and refresh control */
    .header-nav {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: max(15px, env(safe-area-inset-top)) 18px 15px;
      pointer-events: none;
    }

    .refresh-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 105px;
      min-height: 40px;
      padding: 10px 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: linear-gradient(145deg, var(--pink-light), var(--pink));
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 8px 22px rgba(255, 112, 143, 0.28),
        inset 1px 1px 3px rgba(255, 255, 255, 0.35),
        inset -1px -1px 3px rgba(150, 30, 65, 0.2);
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255, 112, 143, 0.38);
    }

    .refresh-btn:active {
      transform: scale(0.96);
    }

    .refresh-btn:disabled {
      cursor: wait;
      opacity: 0.8;
    }

    .refresh-icon {
      display: inline-block;
      font-size: 15px;
      line-height: 1;
      transition: transform 500ms ease;
    }

    .refresh-btn:hover .refresh-icon {
      transform: rotate(180deg);
    }

    .refresh-btn.loading {
      min-width: 40px;
      width: 40px;
      padding: 0;
      color: transparent;
      gap: 0;
    }

    .refresh-btn.loading .refresh-label,
    .refresh-btn.loading .refresh-icon {
      opacity: 0;
    }

    .refresh-btn.loading::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 650ms linear infinite;
    }

    /* Refresh overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: rgba(10, 10, 10, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 250ms ease, visibility 250ms ease;
    }

    .loading-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .loading-text {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main glass card */
    .glass-box {
      position: relative;
      z-index: 3;
      width: min(100%, 440px);
      padding: 32px 22px 24px;
      border: 1px solid rgba(255, 100, 125, 0.9);
      border-radius: 25px;
      background: var(--panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: center;
      color: #fff;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.45),
        0 0 24px rgba(255, 51, 51, 0.16);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .crimson-orb {
      display: flex;
      flex: 0 0 36px;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid #ff9999;
      border-radius: 50%;
      background: radial-gradient(circle, #ff4d4d, #a80000);
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.55), inset 0 0 5px #fff;
    }

    .crimson-orb span {
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      text-shadow: 0 0 5px #000;
    }

    .main-title {
      flex: 1;
      font-size: clamp(14px, 3.7vw, 17px);
      font-weight: 800;
      letter-spacing: 0.2px;
      line-height: 1.35;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    .neon-shield {
      flex: 0 0 29px;
      width: 29px;
      height: 29px;
      filter: drop-shadow(0 0 7px var(--cyan));
    }

    .sub-message {
      margin: 0 0 24px;
      padding: 0 3px;
      color: #f8fafc;
      font-size: 13px;
      line-height: 1.8;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .small-icon {
      display: inline-block;
      margin: 0 2px;
      vertical-align: middle;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      margin-bottom: 13px;
      padding: 14px 16px;
      border: 1px solid transparent;
      border-radius: 15px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-telegram {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.11);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-telegram:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-verify {
      margin-bottom: 0;
      border: 0;
      background: linear-gradient(135deg, #0799dc, #006aa9);
      box-shadow: 0 0 16px rgba(0, 136, 204, 0.3);
      animation: zoomInOut 1.8s ease-in-out infinite alternate;
    }

    .btn-verify:hover {
      box-shadow: 0 0 23px rgba(0, 136, 204, 0.48);
    }

    @keyframes zoomInOut {
      from { transform: scale(1); }
      to { transform: scale(1.025); }
    }

    .privacy-note {
      margin-top: 16px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 10px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      body {
        padding: 76px 12px 18px;
      }

      .header-nav {
        padding-right: 12px;
      }

      .glass-box {
        padding: 26px 16px 20px;
        border-radius: 21px;
      }

      .title-row {
        gap: 7px;
      }

      .crimson-orb {
        flex-basis: 32px;
        width: 32px;
        height: 32px;
      }

      .neon-shield {
        flex-basis: 25px;
        width: 25px;
        height: 25px;
      }

      .sub-message {
        font-size: 12px;
      }

      .btn {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="video-background-container" aria-hidden="true">
    <video autoplay muted playsinline preload="metadata" class="bg-video active" id="video1"></video>
    <video autoplay muted playsinline preload="metadata" class="bg-video" id="video2"></video>
  </div>

  <header class="header-nav">
    <button type="button" id="refreshBtn" class="refresh-btn" onclick="triggerRefresh()" aria-label="Refresh page">
      <span class="refresh-label">Refresh</span>
      <span class="refresh-icon" aria-hidden="true">↻</span>
    </button>
  </header>

  <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text">Refreshing…</div>
  </div>

  <main class="glass-box">
    <div class="title-row">
      <div class="crimson-orb" aria-label="18 plus">
        <span>18+</span>
      </div>

      <h1 class="main-title">Welcome! Verify Your Age</h1>

      <svg class="neon-shield" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    </div>

    <p class="sub-message">
      <span class="small-icon" aria-hidden="true">🔞</span>
      Please confirm that you are 18 years or older before continuing.
      <span class="small-icon" aria-hidden="true">🛡️</span>
    </p>

    <a
      href="https://t.me/Desi_Magi909_Bot?start=start"
      class="btn btn-telegram"
      target="_blank"
      rel="noopener noreferrer">
      Open Telegram Bot
    </a>

    <button type="button" class="btn btn-verify" id="ageConfirmBtn">
      I confirm I'm 18+ — Continue
    </button>

    <p class="privacy-note">
      This button records no phone number, password, login code, or Telegram session.
      It only asks you to confirm your age before continuing.
    </p>
  </main>

  <script>
    "use strict";

    const TELEGRAM_BOT_URL = "https://t.me/Desi_Magi909_Bot?start=start";

    const videoSources = [
      "https://videotourl.com/videos/1791991670528-243ba2f3-6a72-42b5-98f4-801958896e9b.mp4",
      "https://videotourl.com/videos/1791991701911-23cc06b5-2882-4bcb-a48d-c81820d32180.mp4",
      "https://videotourl.com/videos/1791991728635-19dc579c-62b9-4ee8-91ac-46f932877833.mp4",
      "https://videotourl.com/videos/1791993979245-a093a9e9-103f-4e2e-a8b0-2523d7142591.mp4",
      "https://videotourl.com/videos/1791994015612-3933609e-371c-4400-ab5b-84e1e4500efc.mp4",
      "https://videotourl.com/videos/1791994060700-53af3ed0-9dcb-4141-9903-5367ae01e143.mp4",
      "https://videotourl.com/videos/1791994088573-f8b10466-29dc-4bb9-b217-1e625c9c42c6.mp4",
      "https://videotourl.com/videos/1791994156983-0c21b204-5411-4384-bad8-9db9e60de1d1.mp4",
      "https://videotourl.com/videos/1791994181045-963a2b15-fd0d-43e3-947e-b6ad093a6396.mp4",
      "https://videotourl.com/videos/1791994231550-432da1b2-6076-4964-8e91-8ecb22b74bf5.mp4",
      "https://videotourl.com/videos/1791994496087-6554b067-6cbc-432a-bf12-b6aa650a0370.mp4",
      "https://videotourl.com/videos/1791994562902-d9177bc7-f170-4392-84cd-abe50aa147a3.mp4",
      "https://videotourl.com/videos/1791994605318-8745fec1-7d01-4e1a-88b3-f784520ab1e2.mp4",
      "https://videotourl.com/videos/1791994675281-d4a58dc3-bfd5-42bb-9908-7b082fbcf9a2.mp4",
      "https://videotourl.com/videos/1791995038968-2fe59a9b-852a-4edc-b07b-c64ed7187313.mp4",
      "https://videotourl.com/videos/1791995081237-bbeddb4a-59f8-4b06-9c3e-bb44840bf923.mp4",
      "https://videotourl.com/videos/1791995149408-90f4a576-3bf9-44a5-a995-d7d865850801.mp4",
      "https://videotourl.com/videos/1791995210347-fa2a856c-5908-42a7-bfa0-0826bfcc7957.mp4",
      "https://videotourl.com/videos/1791995318455-368db434-138b-4cc4-9663-e16a291dfc69.mp4"
    ];

    const video1 = document.getElementById("video1");
    const video2 = document.getElementById("video2");
    const refreshBtn = document.getElementById("refreshBtn");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const ageConfirmBtn = document.getElementById("ageConfirmBtn");

    let activeVideo = video1;
    let standbyVideo = video2;
    let currentVideoIndex = -1;
    let switchingVideo = false;

    function randomVideoIndex(excludeIndex = -1) {
      if (videoSources.length <= 1) return 0;

      let index;
      do {
        index = Math.floor(Math.random() * videoSources.length);
      } while (index === excludeIndex);

      return index;
    }

    function playVideo(video, index) {
      currentVideoIndex = index;
      video.src = videoSources[index];
      video.load();

      const playPromise = video.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {
          // Some mobile browsers require a user gesture for playback.
        });
      }
    }

    function playNextVideo() {
      if (switchingVideo || videoSources.length < 2) return;
      switchingVideo = true;

      const nextIndex = randomVideoIndex(currentVideoIndex);
      const next = standbyVideo;
      const current = activeVideo;

      next.src = videoSources[nextIndex];
      next.load();

      const cleanup = () => {
        next.removeEventListener("canplay", onCanPlay);
        next.removeEventListener("error", onError);
      };

      const onError = () => {
        cleanup();
        switchingVideo = false;
        next.pause();
        next.removeAttribute("src");
        next.load();
      };

      const onCanPlay = () => {
        cleanup();

        const playPromise = next.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {});
        }

        next.classList.add("active");
        current.classList.remove("active");
        current.pause();

        activeVideo = next;
        standbyVideo = current;
        currentVideoIndex = nextIndex;
        switchingVideo = false;
      };

      next.addEventListener("canplay", onCanPlay, { once: true });
      next.addEventListener("error", onError, { once: true });
    }

    video1.addEventListener("ended", playNextVideo);
    video2.addEventListener("ended", playNextVideo);

    video1.addEventListener("error", () => {
      if (activeVideo === video1) playNextVideo();
    });

    video2.addEventListener("error", () => {
      if (activeVideo === video2) playNextVideo();
    });

    playVideo(video1, randomVideoIndex());

    function triggerRefresh() {
      if (refreshBtn.disabled) return;

      refreshBtn.disabled = true;
      refreshBtn.classList.add("loading");
      loadingOverlay.classList.add("show");

      window.setTimeout(() => {
        window.location.reload();
      }, 700);
    }

    ageConfirmBtn.addEventListener("click", () => {
      const confirmed = window.confirm(
        "Please confirm that you are 18 years of age or older."
      );

      if (confirmed) {
        window.location.href = "https://alveecommunity.com/verify.html";
      }
    });
  </script>
</body>
</html>
