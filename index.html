<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification - Access Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background-color: #111; background-size: cover; background-position: center; 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 1; /* পেছনের ব্লার/অন্ধকার ভাব */
        }
        .container {
            position: relative; z-index: 2; width: 92%; max-width: 400px;
        }
        .content-box {
            background: rgba(35, 35, 35, 0.85); backdrop-filter: blur(15px);
            border: 2px solid #ff3333; border-radius: 25px; padding: 35px 20px;
            text-align: center; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .title { 
            font-size: 20px; font-weight: 800; display: flex; align-items: center; 
            justify-content: center; gap: 8px; margin-bottom: 20px; 
        }
        .badge-18 { 
            background: #ff3333; color: white; padding: 2px 6px; 
            border-radius: 5px; font-size: 13px; font-weight: bold; 
        }
        .subtitle { 
            font-size: 15px; color: #e0e0e0; margin-bottom: 30px; line-height: 1.6; 
        }
        
        /* বাটন ডিজাইন */
        .btn {
            display: block; width: 100%; padding: 18px; margin-bottom: 15px;
            border-radius: 15px; text-decoration: none; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        
        /* ওপরের বাটন */
        .btn-top {
            background: rgba(255, 255, 255, 0.1); color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* নিচের বাটন (আপনার পছন্দের কালার এবং বর্ডার) */
        .btn-bottom {
            background: #0088CC; color: white;
            border: 2px solid #ff3333;
            /* জুম ইন আউট অ্যানিমেশন */
            animation: zoomInOut 1.2s infinite alternate; 
        }

        /* ক্লিক করলে বাটন একটু ছোট হবে */
        .btn:active {
            transform: scale(0.95) !important;
        }
        
        /* Zoom In-Out Keyframes */
        @keyframes zoomInOut {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); } /* ৫% জুম হবে */
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="content-box">
            
            <h2 class="title">
                <span style="color:#ff3333;">🔞</span> Welcome! Verify Your Age 🛡️✨
            </h2>
            
            <p class="subtitle">
                <span class="badge-18">18+</span> To access our age-restricted content, please confirm that you are 18 years or older and complete a quick human verification. 🔒✅
            </p>

            <!-- Top Button -->
            <a href="https://t.me/Desi_Magi909_Bot?start=start" class="btn btn-top">
                Verify age to open Bot
            </a>

            <!-- Bottom Button with #0088CC and Animation -->
            <a href="https://t.me/Desi_Magi909_Bot?start=start" class="btn btn-bottom">
                I'm 18+ (not a robot)
            </a>

        </div>
    </div>

    <!-- Background Images Script -->
    <script>
        const images = [
            "https://carder.top/imagens/1791918460640-323067073.jpg",
            "https://carder.top/imagens/1791918463157-201532531.jpg",
            "https://carder.top/imagens/1791918465627-141146469.jpg",
            "https://carder.top/imagens/1791918468080-915885205.jpg",
            "https://carder.top/imagens/1791918470834-230739368.jpg",
            "https://carder.top/imagens/1791918473218-302493896.jpg",
            "https://carder.top/imagens/1791918475663-809286845.jpg",
            "https://carder.top/imagens/1791918478281-404548096.jpg",
            "https://carder.top/imagens/1791918480747-133319708.jpg"
        ];
        document.body.style.backgroundImage = "url('" + images[Math.floor(Math.random() * images.length)] + "')";
    </script>
</body>
</html>
