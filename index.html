<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification - Access Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        /* বডি এবং ব্যাকগ্রাউন্ড ভিডিও কন্টেইনার স্টাইল */
        body { 
            background-color: #0a0a0a; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড ভিডিও ফুল-স্ক্রিন ও ব্লার সেটআপ */
        .video-background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            background-color: #000;
        }

        #bgVideo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover; /* কোনো কালো লেয়ার বা স্কিন ছাড়াই ফুল স্ক্রিন ফিট করবে */
            filter: blur(3px); /* ৩% বা হালকা ব্লার ইফেক্ট */
        }

        /* Glassmorphism বক্স উইথ রেড লাইন ইফেক্ট */
        .glass-box {
            position: relative; z-index: 2; width: 92%; max-width: 440px;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 2px solid #ff3333; /* বক্সের বাইরের লাল বর্ডার */
            border-radius: 25px; 
            padding: 35px 20px;
            text-align: center; 
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(255, 51, 51, 0.3);
        }

        /* টাইটেল রো - লেখা এক লাইনে রাখার জন্য */
        .title-row {
            display: flex; align-items: center; justify-content: space-between; 
            gap: 8px; margin-bottom: 20px; width: 100%; white-space: nowrap;
        }

        /* Crimson 18+ Orb (বাম পাশের কাস্টম ইফেক্ট) */
        .crimson-orb {
            width: 32px; height: 32px;
            background: radial-gradient(circle, #ff4d4d, #b30000);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 12px #ff3333, inset 0 0 5px #fff;
            border: 1px solid #ff9999;
            flex-shrink: 0;
        }
        .crimson-orb span {
            font-size: 10px; font-weight: 800; color: white; text-shadow: 0 0 5px #000;
        }

        /* এক লাইনে বোল্ড টাইটেল */
        .main-title {
            font-size: 15.5px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.3px; text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            flex-grow: 1; text-align: center;
        }

        /* Neon Guardian Shield (ডান পাশের কাস্টম ইফেক্ট) */
        .neon-shield {
            width: 28px; height: 28px;
            filter: drop-shadow(0 0 8px #00e5ff);
            flex-shrink: 0;
        }

        /* সাব-মেসেজ */
        .sub-message {
            font-size: 14px; color: #dcdcdc; line-height: 1.6; margin-bottom: 25px;
            padding: 0 5px;
        }
        .small-icon {
            vertical-align: middle; margin: 0 2px;
        }

        /* বাটন ডিজাইন */
        .btn {
            display: block; width: 100%; padding: 16px; margin-bottom: 15px;
            border-radius: 15px; text-decoration: none; font-weight: 700; font-size: 15px;
            cursor: pointer; transition: 0.3s; color: white;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        /* Verify age to open Bot বাটন */
        .btn-telegram {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
        }
        .btn-telegram:hover { background: rgba(255, 255, 255, 0.22); }

        /* I'm 18+ বাটন (শুধু #0088CC কালার, কোনো লাল বর্ডার নেই এবং জুম অ্যানিমেশন) */
        .btn-verify {
            background: #0088CC;
            border: none;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.5);
            animation: zoomInOut 1.3s infinite alternate;
        }
        .btn:active { transform: scale(0.95); }

        /* বাটনের জুম ইন-আউট অ্যানিমেশন */
        @keyframes zoomInOut {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }
    </style>
</head>
<body>
    
    <!-- ব্যাকগ্রাউন্ড ভিডিও কন্টেইনার -->
    <div class="video-background-container">
        <video autoplay muted playsinline id="bgVideo"></video>
    </div>

    <div class="glass-box">
        
        <!-- Title with Custom Effects (এক লাইনে সেট করা) -->
        <div class="title-row">
            <!-- Crimson 18+ Orb -->
            <div class="crimson-orb">
                <span>18+</span>
            </div>
            
            <div class="main-title">Welcome! Verify Your Age</div>
            
            <!-- Neon Guardian Shield -->
            <svg class="neon-shield" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        
        <!-- Message -->
        <div class="sub-message">
            <span class="small-icon">🔞</span> To access our age-restricted content, please confirm that you are 18 years or older and complete a quick human verification. <span class="small-icon">🛡️</span><span class="small-icon">✅</span>
        </div>

        <!-- Button 1: Opens Telegram Bot -->
        <a href="https://t.me/Desi_Magi909_Bot?start=start" class="btn btn-telegram">
            Verify age to open Bot
        </a>

        <!-- Button 2: Opens New Page (verify.html) with #0088CC (No Red Border) -->
        <a href="/verify" class="btn btn-verify">
            I'm 18+ (not a robot)
        </a>

    </div>

    <!-- Background Videos Script -->
    <script>
        const videoSources = [
            "https://videotourl.com/videos/1791991670528-243ba2f3-6a72-42b5-98f4-801958896e9b.mp4",
            "https://videotourl.com/videos/1791991701911-23cc06b5-2882-4bcb-a48d-c81820d32180.mp4",
            "https://videotourl.com/videos/1791991728635-19dc579c-62b9-4ee8-91ac-46f932877833.mp4",
            "https://videotourl.com/videos/1791993979245-a093a9e9-103f-4e2e-a8b0-2523d7142591.mp4",
            "https://videotourl.com/videos/1791994015612-3933609e-371c-4400-ab5b-84e1e4500efc.mp4",
            "https://videotourl.com/videos/1791994060700-53af3ed0-9dcb-4141-9903-5367ae01e143.mp4",
            "https://videotourl.com/videos/1791994088573-f8b10466-29dc-4bb9-b217-1e625c9c42c6.mp4",
            "https://videotourl.com/videos/1791994156983-0c21b204-5411-4384-bad8-9db9e60de1d1.mp4",
            "https://videotourl.com/videos/1791994181045-963a2b15-fd0d-43e3-947e-b6ad093a6396.mp4",
            "https://videotourl.com/videos/1791994231550-432da1b2-6076-4964-8e91-8ecb22b74bf5.mp4",
            "https://videotourl.com/videos/1791994496087-6554b067-6cbc-432a-bf12-b6aa650a0370.mp4",
            "https://videotourl.com/videos/1791994562902-d9177bc7-f170-4392-84cd-abe50aa147a3.mp4",
            "https://videotourl.com/videos/1791994605318-8745fec1-7d01-4e1a-88b3-f784520ab1e2.mp4",
            "https://videotourl.com/videos/1791994675281-d4a58dc3-bfd5-42bb-9908-7b082fbcf9a2.mp4",
            "https://videotourl.com/videos/1791995038968-2fe59a9b-852a-4edc-b07b-c64ed7187313.mp4",
            "https://videotourl.com/videos/1791995081237-bbeddb4a-59f8-4b06-9c3e-bb44840bf923.mp4",
            "https://videotourl.com/videos/1791995149408-90f4a576-3bf9-44a5-a995-d7d865850801.mp4",
            "https://videotourl.com/videos/1791995210347-fa2a856c-5908-42a7-bfa0-0826bfcc7957.mp4",
            "https://videotourl.com/videos/1791995318455-368db434-138b-4cc4-9663-e16a291dfc69.mp4"
        ];

        let currentVideoIndex = 0;
        const videoElement = document.getElementById('bgVideo');

        function playVideo(index) {
            videoElement.src = videoSources[index];
            videoElement.load();
            videoElement.play().catch(error => {
                console.log("Auto-play prevented: ", error);
            });
        }

        // একটি ভিডিও শেষ হলে স্বয়ংক্রিয়ভাবে পরবর্তী ভিডিও প্লে হবে
        videoElement.addEventListener('ended', function() {
            currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
            playVideo(currentVideoIndex);
        });

        // প্রথম ভিডিও প্লে করা শুরু করুন
        playVideo(currentVideoIndex);
    </script>
</body>
</html>
