<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090B">
<title>ALVEE Premium Media Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- নতুন style.css এখান থেকে লোড হবে (পাথ আপনার সার্ভারের সাথে মিলিয়ে নিন)।
     ?v=2 ব্রাউজারের পুরনো ক্যাশ এড়ানোর জন্য; পরে বদলালে সংখ্যা বাড়িয়ে দিন -->
<link rel="stylesheet" href="/style.css?v=2">
</head>
<body>

<div id="ocChannelWindow" class="open" aria-hidden="false">

    <div class="oc-channel-header">
        <a href="/dashboard.html" class="oc-back-btn" aria-label="Back to dashboard">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        </a>

        <div class="oc-channel-title-pill">
            <div class="oc-channel-avatar">
                <img src="https://carder.top/imagens/1792065174675-662575987.jpg" alt="OC Collection Universe">
            </div>
            <div class="oc-channel-title-text">
                <h2>OC Collection Universe</h2>
                <p>Premium Media</p>
            </div>
        </div>

        <button class="oc-header-action-btn" type="button" aria-label="Search" onclick="toggleOCSearch()">
            <svg viewBox="0 0 24 24">
                <circle cx="10.8" cy="10.8" r="7.2"></circle>
                <path d="m16.2 16.2 4.5 4.5"></path>
            </svg>
        </button>

        <button class="oc-header-action-btn" type="button" aria-label="Menu" onclick="toggleOCMenu()">
            <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none">
                <circle cx="12" cy="5" r="2"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="12" cy="19" r="2"></circle>
            </svg>
        </button>
    </div>

    <div class="oc-menu-popover" id="ocMenuPopover">
        <strong>OC Collection Universe</strong>
        <small>Premium Dark Interface</small>
        <button type="button" onclick="window.location.href='/dashboard.html'">Exit Channel</button>
    </div>

    <div class="oc-search-panel" id="ocSearchPanel">
        <input type="search" id="ocSearchInput" placeholder="Search metadata..." aria-label="Search">
        <button type="button" aria-label="Close search" onclick="toggleOCSearch()" style="background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;">×</button>
    </div>

    <!-- ALVEE / Subscribe / Trending কার্ডটি oc-channel.js নিজেই এই স্ক্রল-এরিয়ার ভেতরে বসাবে -->
    <div class="oc-channel-body">
        <div id="channelPostsContainer">
        </div>
    </div>
</div>

<!-- নতুন oc-channel.js (defer: পেজ তৈরি হওয়ার পর চলবে) -->
<script src="/oc-channel.js?v=2" defer></script>
</body>
</html>
