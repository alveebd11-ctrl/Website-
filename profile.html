<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Style Profile Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: #0a1128; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 20px 15px 100px 15px; 
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* সিকিউরিটি গার্ড: লগইন করা না থাকলে প্রোফাইল দেখতে দেবে না */
        #profileWrapper {
            opacity: 0;
            transition: opacity 0.4s ease;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ব্যাকগ্রাউন্ড ভিডিও */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(0.4);
        }

        /* প্রথম স্ক্রিনশটের মতো প্রিমিয়াম কার্ড স্টাইল */
        .profile-card-modern {
            width: 100%;
            background: rgba(26, 31, 46, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 16px 16px 24px 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ওপরের বড় প্রোফাইল ইমেজ কার্ড */
        .card-image-wrapper {
            width: 100%;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            background: rgba(255, 255, 255, 0.05); /* লোডিংয়ের সময় সুন্দর ব্যাকগ্রাউন্ড দেখাবে */
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* ইউজার ইনফো সেকশন */
        .card-user-info {
            padding: 16px 6px 4px 6px;
        }

        .name-row {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .name-row h2 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            word-break: break-word;
        }

        .username-text {
            font-size: 13px;
            color: #00bfff;
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* বায়ো সেকশন */
        .card-bio {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 15px;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            word-break: break-word;
        }

        /* অ্যাকাউন্ট ডিটেইলস লিস্ট */
        .telegram-meta-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
            margin-top: 5px;
        }

        .meta-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
            word-break: break-all;
        }

        /* লগআউট বাটন */
        .logout-box {
            width: 100%;
            max-width: 380px;
            margin-top: 15px;
        }

        .logout-action-btn {
            width: 100%;
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 12px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-action-btn:active {
            transform: scale(0.97);
        }

        /* --- বটম গ্লাস ন্যাভবার --- */
        .bottom-glass-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: 90%;
            max-width: 380px;
            height: 70px;
            background: rgba(20, 25, 45, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.05);
            z-index: 100;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
        }

        .bottom-glass-nav.slide-up {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .nav-item {
            background: transparent;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: #94a3b8;
            transition: fill 0.3s ease;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.6), rgba(0, 191, 255, 0.8));
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.4);
            width: 58px;
            height: 58px;
        }

        .nav-item.active svg {
            fill: #ffffff;
            width: 26px;
            height: 26px;
        }

        .nav-item:hover svg {
            fill: #ffffff;
        }
    </style>

    <script>
        // সিকিউরিটি গার্ড: লগইন করা না থাকলে প্রোফাইলে ঢুকতে দেবে না
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("verify");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("profileWrapper").style.opacity = "1";
                setTimeout(() => {
                    document.getElementById('bottomNav').classList.add('slide-up');
                }, 100);

                // টেলিগ্রামের আসল রিয়েল-টাইম ডাটা ব্যাকএন্ড থেকে ফেচ করা
                fetchTelegramProfile();
            });
        }

        function fetchTelegramProfile() {
            let userPhone = localStorage.getItem("userPhone");
            
            if (userPhone) {
                fetch('/get-user-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: userPhone })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        let p = data.profile;
                        document.getElementById('profileName').innerText = p.name;
                        document.getElementById('profileUsername').innerText = p.username;
                        document.getElementById('profileId').innerText = p.id;
                        document.getElementById('profilePhone').innerText = p.phone;
                        document.getElementById('profileBio').innerText = p.bio;
                        
                        if (p.photo) {
                            let imgElement = document.getElementById('profileImage');
                            imgElement.src = p.photo;
                            imgElement.onload = () => {
                                imgElement.style.opacity = "1"; // ছবি লোড হওয়ার পর স্মুথলি ভেসে উঠবে
                            };
                        }
                    }
                })
                .catch(err => console.log("Profile fetch error"));
            }
        }
    </script>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ভিডিও -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
    </video>

    <div id="profileWrapper">
        <!-- কার্ড স্টাইল প্রোফাইল বক্স -->
        .  <div class="profile-card-modern">
            <!-- বড় প্রোফাইল ইমেজ -->
            <div class="card-image-wrapper">
                <img id="profileImage" src="" alt="Profile Picture">
            </div>

            <!-- টেলিগ্রাম ইনফো লিস্ট -->
            <div class="card-user-info">
                <div class="name-row">
                    <h2 id="profileName">Loading...</h2>
                </div>
                <div id="profileUsername" class="username-text">@username</div>

                <div id="profileBio" class="card-bio">
                    Loading bio...
                </div>

                <!-- টেলিগ্রাম মেটা ডিটেইলস (ফোন নম্বর ও আইডি) -->
                <div class="telegram-meta-details">
                    <div class="meta-row">
                        <span class="meta-label">Phone Number</span>
                        <span id="profilePhone" class="meta-value">+880 XXXXXXXXXX</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Telegram ID</span>
                        <span id="profileId" class="meta-value">000000000</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- লগআউট বাটন -->
        <div class="logout-box">
            <button onclick="logoutUser()" class="logout-action-btn">Log Out Account 🚪</button>
        </div>
    </div>

    <!-- বটম গ্লাস ন্যাভবার -->
    <div class="bottom-glass-nav" id="bottomNav">
        <!-- বাম পাশে: গ্রুপ বাটন -->
        <button onclick="handleNavAction('group')" class="nav-item" title="Group">
            <svg viewBox="0 0 24 24">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
        </button>

        <!-- মাঝে: হোম/ড্যাশবোর্ড বাটন -->
        <a href="dashboard.html" class="nav-item" title="Home">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>

        <!-- ডান পাশে: প্রোফাইল বাটন (বর্তমান পেজ, তাই একটিভ) -->
        <button class="nav-item active" title="Profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </button>
    </div>

    <script>
        function handleNavAction(type) {
            if (type === 'group') {
                alert("Telegram Group section coming soon!");
            }
        }

        function logoutUser() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userPhone");
            window.location.href = "verify";
        }
    </script>
</body>
</html>
