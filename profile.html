<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Profile Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: #0a1128; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 20px 15px 100px 15px; 
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* সিকিউরিটি গার্ড: লগইন করা না থাকলে প্রোফাইল দেখতে দেবে না */
        #profileWrapper {
            opacity: 0;
            transition: opacity 0.4s ease;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ব্যাকগ্রাউন্ড ভিডিও */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(0.4);
        }

        /* ছবির মতো ডান পাশের স্টাইলের মূল কার্ড বক্স */
        .profile-card-modern {
            width: 100%;
            background: rgba(26, 31, 46, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 16px 16px 20px 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ওপরের বড় কভার ইমেজ বা প্রোফাইল ছবি কার্ড */
        .card-image-wrapper {
            width: 100%;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* নাম এবং ভেরিফাইড টিকমার্ক */
        .card-user-info {
            padding: 18px 6px 12px 6px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .name-row h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        /* টেলিগ্রাম বা ছবির মতো ভেরিফাইড টিক আইকন */
        .verified-badge {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verified-badge svg {
            width: 12px;
            height: 12px;
            fill: #ffffff;
        }

        /* ইউজার আইডি বা বায়ো */
        .card-bio {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 400;
        }

        /* কার্ডের নিচের স্ট্যাটস এবং ফলো বাটন রো */
        .card-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .stat-item svg {
            width: 16px;
            height: 16px;
            fill: #94a3b8;
        }

        /* ডান পাশের প্রিমিয়াম হোয়াইট ফলো বাটন (ছবির ডান দিকের কার্ডের মতো) */
        .follow-btn {
            background: #ffffff;
            color: #0a1128;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s;
        }

        .follow-btn:active {
            transform: scale(0.95);
        }

        /* লগআউট বাটন */
        .logout-box {
            width: 100%;
            max-width: 360px;
            margin-top: 15px;
        }

        .logout-action-btn {
            width: 100%;
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 12px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-action-btn:active {
            transform: scale(0.97);
        }

        /* --- বটম গ্লাস ন্যাভবার --- */
        .bottom-glass-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: 90%;
            max-width: 380px;
            height: 70px;
            background: rgba(20, 25, 45, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.05);
            z-index: 100;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
        }

        .bottom-glass-nav.slide-up {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .nav-item {
            background: transparent;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: #94a3b8;
            transition: fill 0.3s ease;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.6), rgba(0, 191, 255, 0.8));
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.4);
            width: 58px;
            height: 58px;
        }

        .nav-item.active svg {
            fill: #ffffff;
            width: 26px;
            height: 26px;
        }

        .nav-item:hover svg {
            fill: #ffffff;
        }
    </style>

    <script>
        // সিকিউরিটি গার্ড: লগইন করা না থাকলে প্রোফাইলে ঢুকতে দেবে না
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("verify.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("profileWrapper").style.opacity = "1";
                setTimeout(() => {
                    document.getElementById('bottomNav').classList.add('slide-up');
                }, 100);
            });
        }
    </script>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ভিডিও -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://videotourl.com/videos/1791952459901-05439f7d-513c-4994-b03b-ca0ca313b9cc.mp4" type="video/mp4">
    </video>

    <div id="profileWrapper">
        <!-- ছবির ডান দিকের কার্ড স্টাইলের প্রোফাইল বক্স -->
        <div class="profile-card-modern">
            <!-- বড় প্রোফাইল ইমেজ -->
            <div class="card-image-wrapper">
                <img src="https://carder.top/imagens/1791918460640-323067073.jpg" alt="Profile Picture">
            </div>

            <!-- ইউজার ডিটেইলস -->
            <div class="card-user-info">
                <div class="name-row">
                    <h2>Royal_Ninja</h2>
                    <!-- ভেরিফাইড টিক মার্ক ব্যাজ -->
                    <div class="verified-badge" title="Verified">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    </div>
                </div>
                <p class="card-bio">
                    Telegram Verified Member & Community Leader focused on seamless digital experiences.
                </p>

                <!-- স্ট্যাটস এবং ফলো বাটন -->
                <div class="card-footer-row">
                    <div class="stats-group">
                        <div class="stat-item" title="Followers">
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            <span>312</span>
                        </div>
                        <div class="stat-item" title="Level / Badge">
                            <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99z"/></svg>
                            <span>48</span>
                        </div>
                    </div>
                    <button class="follow-btn" onclick="alert('You are already connected!')">Follow +</button>
                </div>
            </div>
        </div>

        <!-- লগআউট অপশন -->
        <div class="logout-box">
            <button onclick="logoutUser()" class="logout-action-btn">Log Out Account 🚪</button>
        </div>
    </div>

    <!-- বটম গ্লাস ন্যাভবার -->
    <div class="bottom-glass-nav" id="bottomNav">
        <!-- বাম পাশে: গ্রুপ বাটন -->
        <button onclick="handleNavAction('group')" class="nav-item" title="Group">
            <svg viewBox="0 0 24 24">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
        </button>

        <!-- মাঝে: হোম/ড্যাশবোর্ড বাটন -->
        <a href="dashboard.html" class="nav-item" title="Home">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>

        <!-- ডান পাশে: প্রোফাইল বাটন (বর্তমান পেজ, তাই একটিভ) -->
        <button class="nav-item active" title="Profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </button>
    </div>

    <script>
        function handleNavAction(type) {
            if (type === 'group') {
                alert("Telegram Group section coming soon!");
            }
        }

        function logoutUser() {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "verify.html";
        }
    </script>
</body>
</html>
