
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">

<title>Naughty NonStop — Media</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================
   GLOBAL STYLES
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: #080d20;
    color: #fff;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
}

button {
    font: inherit;
}

/* =========================
   BACKGROUND VIDEO
========================= */

.bg-video-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -2;
    pointer-events: none;
    background: #080d20;
}

.bg-video-container video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;

    /* Background video blur: 3px */
    filter: blur(3px) brightness(0.75);

    /* Prevent blurred edges */
    transform: scale(1.05);
}

/* =========================
   BACKGROUND OVERLAY
========================= */

.bg-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background: linear-gradient(
        135deg,
        rgba(255, 112, 143, 0.13),
        rgba(10, 17, 40, 0.45),
        rgba(8, 13, 32, 0.58)
    );

    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    z-index: -1;
    pointer-events: none;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 5;

    padding: 15px 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    background: rgba(10, 17, 40, 0.58);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
}

header h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.2px;
}

.back {
    flex-shrink: 0;

    color: #fff;
    background: rgba(255, 112, 143, 0.85);

    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 22px;

    padding: 9px 15px;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.back:hover {
    background: #ff547b;
    transform: translateY(-1px);
}

/* =========================
   MAIN CONTENT
========================= */

main {
    width: 100%;
    max-width: 900px;

    margin: auto;
    padding: 22px 15px 35px;

    position: relative;
    z-index: 1;
}

.notice {
    color: #f1f5f9;
    font-size: 13px;
    line-height: 1.7;

    margin-bottom: 18px;

    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}

/* =========================
   IMAGE GALLERY
========================= */

.gallery {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(130px, 1fr)
    );

    gap: 12px;
}

.tile {
    width: 100%;
    aspect-ratio: 3 / 4;

    position: relative;
    overflow: hidden;

    padding: 0;

    border: 1px solid rgba(255, 255, 255, 0.20);
    border-radius: 14px;

    background: rgba(20, 28, 58, 0.52);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    cursor: pointer;

    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);

    transition:
        border-color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.tile img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: transform 0.3s ease;
}

.tile:hover {
    border-color: rgba(255, 112, 143, 0.85);

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.30);

    transform: translateY(-2px);
}

.tile:hover img {
    transform: scale(1.045);
}

.tile:focus-visible,
.back:focus-visible,
.close:focus-visible {
    outline: 2px solid #ff9db3;
    outline-offset: 3px;
}

/* =========================
   POPUP / IMAGE VIEWER
   VIDEO VISIBLE BEHIND POPUP
========================= */

.viewer {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 15px;

    /*
       Transparent background allows the video
       behind the popup to remain visible.
    */

    background: rgba(8, 13, 32, 0.30);

    /* Popup background blur: 3px */
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    z-index: 20;

    visibility: hidden;
    opacity: 0;
    pointer-events: none;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}

.viewer.open {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
}

/* =========================
   GLASSMORPHISM POPUP PANEL
========================= */

.viewer-card {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: auto;
    max-width: calc(100vw - 30px);
    max-height: 90vh;
    max-height: 90dvh;

    padding: 12px;

    background: rgba(255, 255, 255, 0.09);

    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 20px;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);

    transform: scale(0.97);

    transition: transform 0.25s ease;
}

.viewer.open .viewer-card {
    transform: scale(1);
}

/* =========================
   POPUP IMAGE
========================= */

.viewer img {
    display: block;

    max-width: calc(100vw - 60px);
    max-height: 84vh;
    max-height: 84dvh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 12px;

    background: rgba(8, 13, 32, 0.25);

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
}

/* =========================
   CLOSE BUTTON
========================= */

.close {
    position: absolute;
    top: -10px;
    right: -10px;

    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 42px;
    height: 42px;

    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 50%;

    color: #fff;
    background: rgba(255, 112, 143, 0.82);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    font-size: 27px;
    line-height: 1;

    cursor: pointer;

    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.close:hover {
    background: #ff547b;
    transform: rotate(90deg);
}

/* =========================
   RESPONSIVE DESIGN
========================= */

@media (max-width: 600px) {
    header {
        padding: 13px 12px;
    }

    header h1 {
        font-size: 16px;
    }

    .back {
        padding: 8px 12px;
        font-size: 12px;
    }

    main {
        padding: 18px 10px 28px;
    }

    .gallery {
        grid-template-columns: repeat(
            auto-fit,
            minmax(105px, 1fr)
        );

        gap: 9px;
    }

    .tile {
        border-radius: 11px;
    }

    .viewer {
        padding: 12px;
    }

    .viewer-card {
        max-width: calc(100vw - 24px);
        padding: 8px;
        border-radius: 16px;
    }

    .viewer img {
        max-width: calc(100vw - 44px);
        max-height: 82vh;
        max-height: 82dvh;
        border-radius: 10px;
    }

    .close {
        top: -10px;
        right: -7px;

        width: 38px;
        height: 38px;

        font-size: 24px;
    }
}

/* Respect reduced-motion preference */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- =========================
     BACKGROUND VIDEO
========================= -->

<div class="bg-video-container" aria-hidden="true">
    <video
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        tabindex="-1"
    >
        <source
            src="https://videotourl.com/videos/1792086671209-6307f585-29a1-4494-a780-4dc3ccec9aa8.mp4"
            type="video/mp4"
        >
    </video>
</div>

<!-- BACKGROUND GLASS OVERLAY -->

<div class="bg-overlay" aria-hidden="true"></div>

<!-- =========================
     HEADER
========================= -->

<header>
    <h1>⛔ Naughty NonStop</h1>

    <button
        class="back"
        type="button"
        onclick="history.length > 1 ? history.back() : location.assign('index.html')"

        ← Back

<!-- =========================
     MAIN GALLERY
========================= -->

<main>
    <p class="notice">

    <div class="gallery" id="gallery"></div>
</main>

<!-- =========================
     GLASS IMAGE POPUP
========================= -->

<div
    class="viewer"
    id="viewer"
    role="dialog"
    aria-modal="true"
    aria-label="Image viewer"
    aria-hidden="true"
    inert
>
    <div class="viewer-card">

        <button
            class="close"
            id="closeViewer"
            type="button"
            aria-label="Close image viewer"
        >
            ×
        </button>

        <img
            id="largeImage"
            alt="Selected gallery image"
            decoding="async"

];

/* =========================
   ELEMENT REFERENCES
========================= */

const gallery = document.getElementById("gallery");
const viewer = document.getElementById("viewer");
const viewerCard = viewer.querySelector(".viewer-card");
const largeImage = document.getElementById("largeImage");
const closeButton = document.getElementById("closeViewer");

let lastFocusedTile = null;

/* =========================
   CREATE GALLERY
========================= */

images.forEach((src, index) => {
    const tile = document.createElement("button");

    tile.className = "tile";
    tile.type = "button";
    tile.setAttribute(
        "aria-label",
        "View gallery image " + (index + 1)
    );

    const img = document.createElement("img");

    img.src = src;
    img.alt = "Gallery image " + (index + 1);
    img.loading = "lazy";
    img.decoding = "async";

    tile.appendChild(img);

    tile.addEventListener("click", () => {
        openViewer(src, index, tile);
    });

    gallery.appendChild(tile);
});

/* =========================
   OPEN POPUP
========================= */

function openViewer(src, index, tile) {
    lastFocusedTile = tile;

    largeImage.src = src;
    largeImage.alt = "Gallery image " + (index + 1);

    viewer.classList.add("open");

    viewer.removeAttribute("inert");
    viewer.setAttribute("aria-hidden", "false");

    document.body.style.overflow = "hidden";

    closeButton.focus();
}

/* =========================
   CLOSE POPUP
========================= */

function closeViewer() {
    if (!viewer.classList.contains("open")) {
        return;
    }

    viewer.classList.remove("open");

    viewer.setAttribute("aria-hidden", "true");
    viewer.setAttribute("inert", "");

    largeImage.removeAttribute("src");

    document.body.style.overflow = "";

    if (lastFocusedTile) {
        lastFocusedTile.focus();
    }
}

/* Close button */

closeButton.addEventListener("click", closeViewer);

/* Close when clicking the outside area */

viewer.addEventListener("click", (event) => {
    if (
        event.target === viewer ||
        event.target === viewerCard
    ) {
        closeViewer();
    }
});

/* Close using Escape */

document.addEventListener("keydown", (event) => {
    if (
        event.key === "Escape" &&
        viewer.classList.contains("open")
    ) {
        closeViewer();
    }
});
</script>
