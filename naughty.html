<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">

<title>Naughty NonStop — Media</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: #080d20;
    color: #fff;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
}

/* =========================
   BACKGROUND MEDIA / IMAGE
========================= */

.bg-video-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -2;
    pointer-events: none;
    background: url('https://carder.top/imagens/1792298157180-542085424.jpg') no-repeat center center fixed;
    background-size: cover;

    /* Background blur: 3px */
    filter: blur(3px) brightness(0.75);
    transform: scale(1.05);
}

/* =========================
   BACKGROUND OVERLAY
========================= */

.bg-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background: linear-gradient(
        135deg,
        rgba(255, 112, 143, 0.13),
        rgba(10, 17, 40, 0.45),
        rgba(8, 13, 32, 0.58)
    );

    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    z-index: -1;
    pointer-events: none;
}

/* =========================
   MAIN CONTENT
========================= */

main {
    width: 100%;
    max-width: 900px;

    margin: auto;
    padding: 22px 15px 35px;

    position: relative;
    z-index: 1;
}

.notice {
    color: #f1f5f9;
    font-size: 13px;
    line-height: 1.7;

    margin-bottom: 18px;

    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- =========================
     BACKGROUND MEDIA
========================= -->

<div class="bg-video-container" aria-hidden="true"></div>

<!-- BACKGROUND GLASS OVERLAY -->

<div class="bg-overlay" aria-hidden="true"></div>

<!-- =========================
     MAIN CONTENT (HEADER REMOVED)
========================= -->

<main>
    <p class="notice">
        Welcome to Naughty NonStop. All media items have been removed.
    </p>
</main>

</body>
</html>
