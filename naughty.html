<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080d20">
<title>Naughty NonStop — Live Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================
   GLOBAL STYLES
========================= */
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
}
html,body{
    height:100%;
    height:100dvh;
    background:#080d20;
    color:#fff;
    overflow:hidden;
}

/* =========================
   BACKGROUND
========================= */
.bg-video-container{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-2;
    pointer-events:none;
    background:url('https://carder.top/imagens/1792298157180-542085424.jpg') no-repeat center center fixed;
    background-size:cover;
    filter:blur(3px) brightness(0.75);
    transform:scale(1.05);
}
.bg-overlay{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        135deg,
        rgba(255,112,143,0.13),
        rgba(10,17,40,0.45),
        rgba(8,13,32,0.75)
    );
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    z-index:-1;
    pointer-events:none;
}

/* =========================
   MAIN CONTAINER
========================= */
.chat-app-container{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    width:100%;
    max-width:900px;
    margin:0 auto;
    position:relative;
    z-index:1;
}

/* =========================
   HEADER
========================= */
.chat-header{
    flex:0 0 78px;
    min-height:78px;
    background:rgba(10,17,40,0.88);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    z-index:20;
}
.header-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}
.back-btn{
    width:40px;
    height:40px;
    border:none;
    background:transparent;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .25s ease;
}
.back-btn:hover{
    background:rgba(255,255,255,0.08);
}
.back-btn svg{
    width:24px;
    height:24px;
    stroke:#fff;
    stroke-width:2.2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.group-avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid rgba(255,255,255,0.18);
    flex-shrink:0;
}
.group-info h2{
    font-size:18px;
    font-weight:700;
    color:#fff;
    letter-spacing:0.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.menu-btn{
    width:40px;
    height:40px;
    border:none;
    background:transparent;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .25s ease;
    flex-shrink:0;
}
.menu-btn:hover{
    background:rgba(255,255,255,0.08);
}
.menu-btn svg{
    width:22px;
    height:22px;
    fill:#fff;
}

/* =========================
   CHAT AREA
========================= */
.chat-messages-area{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    scroll-behavior:smooth;
}
.chat-messages-area::-webkit-scrollbar{
    width:5px;
}
.chat-messages-area::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.2);
    border-radius:10px;
}
.empty-chat{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin:auto;
    background:rgba(255,255,255,0.03);
    padding:16px 20px;
    border-radius:22px;
    border:1px dashed rgba(255,255,255,0.10);
    max-width:630px;
    width:100%;
}

/* =========================
   CHAT BUBBLES
========================= */
.message-bubble{
    display:flex;
    gap:10px;
    max-width:82%;
    animation:fadeIn .3s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
}
.message-bubble.incoming{
    align-self:flex-start;
}
.message-bubble.outgoing{
    align-self:flex-end;
    flex-direction:row-reverse;
}
.msg-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.15);
}
.msg-content-wrap{
    background:rgba(20,28,58,0.78);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.10);
    padding:10px 14px;
    border-radius:18px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.outgoing .msg-content-wrap{
    background:rgba(255,112,143,0.18);
    border-color:rgba(255,112,143,0.32);
}
.msg-sender{
    font-size:11px;
    font-weight:700;
    color:#ff9db3;
    margin-bottom:3px;
}
.msg-text{
    font-size:13px;
    color:#f1f5f9;
    word-break:break-word;
    line-height:1.5;
}
.msg-media{
    max-width:220px;
    max-height:220px;
    border-radius:12px;
    margin-top:7px;
    display:block;
    object-fit:cover;
}
.msg-time{
    font-size:9px;
    color:#94a3b8;
    text-align:right;
    margin-top:4px;
}

/* =========================
   FILE PREVIEW
========================= */
.file-preview-container{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.10);
    padding:10px 14px;
    border-radius:16px;
    margin:0 16px 10px;
    font-size:12px;
    color:#ffd2dc;
    backdrop-filter:blur(12px);
}
.file-preview-left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}
.file-preview-icon{
    width:30px;
    height:30px;
    border-radius:10px;
    background:rgba(255,112,143,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}
.file-preview-icon svg{
    width:16px;
    height:16px;
    fill:#ff9bb0;
}
.file-preview-container span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:180px;
}
.remove-file-btn{
    background:transparent;
    border:none;
    color:#ff7f9b;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

/* =========================
   INPUT AREA
========================= */
.chat-input-container{
    flex:0 0 auto;
    background:rgba(10,17,40,0.90);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,0.10);
    padding:12px 14px max(12px, env(safe-area-inset-bottom));
    position:sticky;
    bottom:0;
    width:100%;
    z-index:15;
}
.chat-input-wrap{
    display:flex;
    align-items:center;
    gap:10px;
}
.chat-input-field{
    flex:1;
    height:58px;
    background:rgba(255,255,255,0.055);
    border:1.4px solid rgba(255,145,177,0.40);
    border-radius:999px;
    padding:0 20px;
    color:#fff;
    font-size:13px;
    outline:none;
    transition:all .28s ease;
    box-shadow:0 0 18px rgba(255,112,143,0.08);
    animation:subtleGlow 4s infinite ease-in-out;
}
.chat-input-field::placeholder{
    color:#93a0b7;
}
.chat-input-field:focus{
    border-color:rgba(255,112,143,0.85);
    box-shadow:0 0 18px rgba(255,112,143,0.22);
}
@keyframes subtleGlow{
    0%,100%{
        border-color:rgba(255,145,177,0.34);
        box-shadow:0 0 0 rgba(255,112,143,0);
    }
    50%{
        border-color:rgba(255,112,143,0.72);
        box-shadow:0 0 14px rgba(255,112,143,0.18);
    }
}

/* Right side action buttons */
.input-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
}
.action-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .28s ease;
    position:relative;
    overflow:hidden;
}

/* Upload button */
.media-upload-btn{
    background:linear-gradient(145deg, rgba(120,205,255,0.16), rgba(70,170,255,0.06));
    border:1px solid rgba(121,203,255,0.28);
    box-shadow:0 0 0 rgba(121,203,255,0);
}
.media-upload-btn::before{
    content:"";
    position:absolute;
    inset:-30%;
    background:conic-gradient(from 0deg, transparent, rgba(121,203,255,0.22), transparent 45%);
    animation:orbitGlow 3s linear infinite;
}
.media-upload-btn::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#7fd3ff;
    box-shadow:0 0 10px #7fd3ff;
    top:10px;
    right:10px;
    animation:pulseDot 1.8s infinite ease-in-out;
}
.media-upload-btn:hover{
    transform:translateY(-2px) scale(1.02);
    border-color:rgba(121,203,255,0.50);
    box-shadow:0 0 18px rgba(121,203,255,0.20);
}
.media-upload-btn svg{
    position:relative;
    z-index:1;
    width:23px;
    height:23px;
    stroke:#9de2ff;
    stroke-width:2.2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}
@keyframes orbitGlow{
    to{transform:rotate(360deg);}
}
@keyframes pulseDot{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.35);opacity:.7;}
}

/* Send button */
.send-msg-btn{
    background:linear-gradient(135deg,#6fc5ff,#5da8ff);
    box-shadow:0 8px 20px rgba(93,168,255,0.25);
    opacity:0;
    transform:scale(.82);
    pointer-events:none;
}
.send-msg-btn.show{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
}
.send-msg-btn:hover{
    transform:scale(1.05);
}
.send-msg-btn svg{
    width:24px;
    height:24px;
    fill:#fff;
    transform:translateX(1px);
}

/* Little shimmer */
.send-msg-btn::before{
    content:"";
    position:absolute;
    top:-30%;
    left:-40%;
    width:45%;
    height:160%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    transform:rotate(20deg);
    animation:sendShine 2.5s infinite;
}
@keyframes sendShine{
    0%{left:-50%;}
    100%{left:120%;}
}

@media (max-width:600px){
    .chat-header{
        min-height:72px;
        flex:0 0 72px;
        padding:0 12px;
    }
    .group-avatar{
        width:48px;
        height:48px;
    }
    .group-info h2{
        font-size:17px;
    }
    .chat-input-container{
        padding:10px 10px max(10px, env(safe-area-inset-bottom));
    }
    .chat-input-field{
        height:54px;
        font-size:13px;
    }
    .action-btn{
        width:48px;
        height:48px;
        border-radius:16px;
    }
}
</style>
</head>

<body>

<div class="bg-video-container" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<div class="chat-app-container">

    <!-- HEADER -->
    <header class="chat-header">
        <div class="header-left">
            <button class="back-btn" onclick="goToDashboard()" aria-label="Back to dashboard">
                <svg viewBox="0 0 24 24">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </button>

            <img src="https://carder.top/imagens/1792065172414-739661966.jpg" alt="Avatar" class="group-avatar">

            <div class="group-info">
                <h2>Naughty NonStop</h2>
            </div>
        </div>

        <button class="menu-btn" aria-label="Menu">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="1.8"></circle>
                <circle cx="12" cy="12" r="1.8"></circle>
                <circle cx="12" cy="19" r="1.8"></circle>
            </svg>
        </button>
    </header>

    <!-- CHAT DISPLAY -->
    <div class="chat-messages-area" id="chatMessagesArea">
        <div class="empty-chat" id="emptyChatNotice">
            No messages yet. Be the first to start the conversation!
        </div>
    </div>

    <!-- FILE PREVIEW -->
    <div id="filePreviewBox" class="file-preview-container">
        <div class="file-preview-left">
            <div class="file-preview-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M19 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 12H5V7h14v10ZM8.5 11.5A1.5 1.5 0 1 0 8.5 8a1.5 1.5 0 0 0 0 3.5Zm-2 4.5h11l-3.2-3.9-2.7 3.1-1.7-2.1L6.5 16Z"></path>
                </svg>
            </div>
            <span id="fileNameDisplay">Selected file</span>
        </div>
        <button class="remove-file-btn" onclick="clearSelectedFile()">✕</button>
    </div>

    <!-- INPUT AREA -->
    <div class="chat-input-container">
        <div class="chat-input-wrap">
            <input type="text"
                   id="chatInputText"
                   class="chat-input-field"
                   placeholder="Send anonymously..."
                   autocomplete="off"
                   onkeypress="checkEnter(event)"
                   oninput="toggleSendButton()">

            <div class="input-actions">
                <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">

                <button class="action-btn media-upload-btn"
                        onclick="document.getElementById('mediaInput').click()"
                        title="Upload Photo or Video"
                        aria-label="Upload">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <path d="M16 3h5v5"></path>
                        <path d="M10 14L21 3"></path>
                    </svg>
                </button>

                <button class="action-btn send-msg-btn"
                        id="sendButton"
                        onclick="sendMessage()"
                        aria-label="Send Message">
                    <svg viewBox="0 0 24 24">
                        <path d="M21.6 3.2a1 1 0 0 0-1.08-.16L3.6 10.8a1 1 0 0 0 .08 1.86l6.48 2.33 2.33 6.48a1 1 0 0 0 1.86.08L21.96 4.28a1 1 0 0 0-.36-1.08ZM11 14.2l-4.78-1.72L18.8 6.7 11 14.2Zm1.8 1.8 7.5-12.58-5.78 12.58-1.72 4.78L12.8 16Z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

</div>

<script>
let selectedFileObject = null;

function goToDashboard() {
    window.top.location.href = "https://alveecommunity.com/dashboard.html";
}

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
        selectedFileObject = file;
        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('filePreviewBox').style.display = 'flex';
        toggleSendButton();
    }
}

function clearSelectedFile() {
    selectedFileObject = null;
    document.getElementById('mediaInput').value = '';
    document.getElementById('filePreviewBox').style.display = 'none';
    toggleSendButton();
}

function checkEnter(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
}

function toggleSendButton() {
    const text = document.getElementById('chatInputText').value.trim();
    const sendBtn = document.getElementById('sendButton');

    if (text || selectedFileObject) {
        sendBtn.classList.add('show');
    } else {
        sendBtn.classList.remove('show');
    }
}

function sendMessage() {
    const textInput = document.getElementById('chatInputText');
    const text = textInput.value.trim();

    if (!text && !selectedFileObject) return;

    const area = document.getElementById('chatMessagesArea');
    const emptyNotice = document.getElementById('emptyChatNotice');
    if (emptyNotice) emptyNotice.style.display = 'none';

    const senderName = "Anonymous User";
    const senderAvatar = "https://carder.top/imagens/1791918460640-323067073.jpg";
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble outgoing';

    let mediaHTML = '';
    if (selectedFileObject) {
        const fileURL = URL.createObjectURL(selectedFileObject);
        if (selectedFileObject.type.startsWith('image/')) {
            mediaHTML = `<img src="${fileURL}" class="msg-media" alt="Uploaded Image">`;
        } else if (selectedFileObject.type.startsWith('video/')) {
            mediaHTML = `<video src="${fileURL}" class="msg-media" controls></video>`;
        }
    }

    bubble.innerHTML = `
        <img src="${senderAvatar}" alt="Avatar" class="msg-avatar">
        <div class="msg-content-wrap">
            <div class="msg-sender">${senderName}</div>
            ${text ? `<div class="msg-text">${escapeHtml(text)}</div>` : ''}
            ${mediaHTML}
            <div class="msg-time">${timeStr}</div>
        </div>
    `;

    area.appendChild(bubble);
    textInput.value = '';
    clearSelectedFile();
    toggleSendButton();
    area.scrollTop = area.scrollHeight;
}

function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}

window.addEventListener('load', toggleSendButton);
</script>

</body>
</html>
