<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#080d20">
<title>Naughty NonStop — Live Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --app-height:100vh;
  --app-top:0px;
}
@supports(height:100dvh){
  :root{--app-height:100dvh}
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',sans-serif;
}

html{
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:#080d20;
}

body{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:#080d20;
  color:#fff;
  isolation:isolate;
}

.bg-video-container{
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:url('https://carder.top/imagens/1792298157180-542085424.jpg') center/cover no-repeat;
  filter:blur(3px) brightness(.75);
  transform:scale(1.05);
}

.bg-overlay{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,112,143,.13),rgba(10,17,40,.45),rgba(8,13,32,.75));
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}

/*
  Fixed viewport shell:
  row 1 = header
  row 2 = scrollable messages
  row 3 = composer and selected-file preview
*/
.chat-app-container{
  position:fixed;
  top:var(--app-top);
  left:0;
  right:0;
  width:100%;
  max-width:900px;
  height:var(--app-height);
  margin-inline:auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden;
  z-index:1;
}

.chat-header{
  min-width:0;
  min-height:calc(72px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 12px 0;
  background:rgba(10,17,40,.88);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:20;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.back-btn,.menu-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .25s;
}

.back-btn:hover,.menu-btn:hover{
  background:rgba(255,255,255,.08);
}

.back-btn svg{
  width:25px;
  height:25px;
  stroke:#fff;
  stroke-width:2.2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.group-avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid rgba(255,255,255,.18);
}

.group-info{min-width:0}

.group-info h2{
  font-size:17px;
  font-weight:700;
  color:#fff;
  letter-spacing:.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.menu-btn svg{
  width:22px;
  height:22px;
  fill:#fff;
}

/* Only this middle section scrolls. */
.chat-messages-area{
  min-width:0;
  min-height:0;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  padding:18px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.chat-messages-area::-webkit-scrollbar{width:4px}

.chat-messages-area::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.18);
  border-radius:10px;
}

.empty-chat{
  flex-shrink:0;
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin:auto;
  background:rgba(255,255,255,.03);
  padding:14px 18px;
  border-radius:20px;
  border:1px dashed rgba(255,255,255,.1);
  max-width:630px;
  width:100%;
}

.message-bubble{
  display:flex;
  flex-shrink:0;
  gap:9px;
  max-width:84%;
  animation:fadeIn .3s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

.message-bubble.incoming{align-self:flex-start}

.message-bubble.outgoing{
  align-self:flex-end;
  flex-direction:row-reverse;
}

.msg-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.15);
}

.msg-content-wrap{
  min-width:0;
  background:rgba(20,28,58,.78);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);
  padding:9px 12px;
  border-radius:17px;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.outgoing .msg-content-wrap{
  background:rgba(255,112,143,.18);
  border-color:rgba(255,112,143,.32);
}

.msg-sender{
  font-size:11px;
  font-weight:700;
  color:#ff9db3;
  margin-bottom:3px;
}

.msg-text{
  font-size:13px;
  color:#f1f5f9;
  overflow-wrap:anywhere;
  line-height:1.5;
  white-space:pre-wrap;
}

.msg-media{
  max-width:min(220px,100%);
  max-height:220px;
  border-radius:11px;
  margin-top:7px;
  display:block;
  object-fit:cover;
}

.msg-time{
  font-size:9px;
  color:#94a3b8;
  text-align:right;
  margin-top:4px;
}

/* Bottom section stays outside the scrolling area. */
.chat-bottom{
  min-width:0;
  z-index:15;
  background:rgba(10,17,40,.95);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

.file-preview-container{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  padding:7px 10px;
  border-radius:14px;
  margin:7px 14px 0;
  font-size:12px;
  color:#ffd2dc;
}

.file-preview-left{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.file-preview-icon{
  width:28px;
  height:28px;
  border-radius:9px;
  background:rgba(255,112,143,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.file-preview-icon svg{
  width:16px;
  height:16px;
  fill:#ff9bb0;
}

.file-preview-container span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:180px;
}

.remove-file-btn{
  background:transparent;
  border:0;
  color:#ff7f9b;
  cursor:pointer;
  font-size:17px;
  font-weight:bold;
  padding:4px 7px;
}

.remove-file-btn:disabled{opacity:.5}

.chat-input-container{
  width:100%;
  padding:7px 18px;
}

.chat-input-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  min-width:0;
}

.chat-input-field{
  display:block;
  flex:1 1 0%;
  width:0;
  min-width:0;
  height:48px;
  background:rgba(255,255,255,.055);
  border:1.3px solid rgba(255,145,177,.48);
  border-radius:999px;
  padding:0 16px;
  color:#fff;
  /* Avoid automatic input zoom on mobile browsers. */
  font-size:16px;
  outline:none;
  transition:border-color .25s,box-shadow .25s;
  box-shadow:0 0 14px rgba(255,112,143,.07);
  animation:subtleGlow 4s infinite ease-in-out;
}

.chat-input-field::placeholder{
  color:#8996ad;
  font-size:13px;
}

.chat-input-field:focus{
  border-color:rgba(255,112,143,.9);
  box-shadow:0 0 15px rgba(255,112,143,.2);
}

.chat-input-field:disabled{
  opacity:.7;
  cursor:wait;
}

@keyframes subtleGlow{
  0%,100%{
    border-color:rgba(255,145,177,.34);
    box-shadow:0 0 0 rgba(255,112,143,0);
  }
  50%{
    border-color:rgba(255,112,143,.72);
    box-shadow:0 0 12px rgba(255,112,143,.15);
  }
}

.input-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
}

.action-btn{
  width:43px;
  height:43px;
  flex:0 0 43px;
  border:0;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .22s ease,box-shadow .22s ease,opacity .2s ease;
}

.action-btn:active{transform:scale(.94)}
.action-btn:disabled{opacity:.55;cursor:not-allowed}

.media-upload-btn{
  background:linear-gradient(145deg,rgba(120,205,255,.18),rgba(70,170,255,.07));
  border:1px solid rgba(121,203,255,.32);
  box-shadow:0 0 12px rgba(121,203,255,.08);
}

.media-upload-btn::before{
  content:"";
  position:absolute;
  inset:-45%;
  background:conic-gradient(from 0deg,transparent,rgba(121,203,255,.22),transparent 42%);
  animation:orbitGlow 3.5s linear infinite;
}

.media-upload-btn::after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#8cddff;
  box-shadow:0 0 9px #7fd3ff;
  top:7px;
  right:7px;
  animation:pulseDot 1.8s infinite ease-in-out;
}

.media-upload-btn:hover{
  transform:translateY(-1px);
  border-color:rgba(121,203,255,.55);
  box-shadow:0 0 16px rgba(121,203,255,.18);
}

.media-upload-btn svg{
  position:relative;
  z-index:1;
  width:22px;
  height:22px;
  stroke:#9de2ff;
  stroke-width:1.9;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

@keyframes orbitGlow{to{transform:rotate(360deg)}}
@keyframes pulseDot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.35);opacity:.7}
}

.send-msg-btn{
  display:none;
  background:linear-gradient(135deg,#78d0ff,#529bff);
  box-shadow:0 5px 14px rgba(82,155,255,.24);
  color:#fff;
}

.send-msg-btn.show{
  display:flex;
  animation:sendPop .2s ease-out;
}

@keyframes sendPop{
  from{opacity:0;transform:scale(.78)}
  to{opacity:1;transform:scale(1)}
}

.send-msg-btn:hover{
  box-shadow:0 7px 18px rgba(82,155,255,.34);
}

.send-msg-btn svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:#fff;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.chat-toast{
  position:absolute;
  z-index:50;
  top:calc(82px + env(safe-area-inset-top,0px));
  left:50%;
  width:calc(100% - 28px);
  max-width:600px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  background:rgba(20,28,58,.97);
  color:#fff;
  font-size:12px;
  line-height:1.45;
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translate(-50%,-8px);
  transition:opacity .2s ease,transform .2s ease,visibility .2s;
}

.chat-toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

.chat-toast.error{border-color:rgba(255,112,143,.55)}
.chat-toast.success{border-color:rgba(120,208,255,.45)}

@media(max-width:380px){
  .chat-header{padding-left:9px;padding-right:9px}
  .header-left{gap:8px}
  .group-avatar{width:44px;height:44px;flex-basis:44px}
  .group-info h2{font-size:15px}
  .chat-input-container{padding-left:12px;padding-right:18px}
  .chat-input-wrap{gap:7px}
  .action-btn{width:41px;height:41px;flex-basis:41px;border-radius:14px}
  .input-actions{gap:6px}
  .chat-input-field{height:46px;padding:0 14px}
  .chat-input-field::placeholder{font-size:12px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="bg-video-container" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<div class="chat-app-container">
  <header class="chat-header">
    <div class="header-left">
      <button class="back-btn" type="button"
              onclick="goToDashboard()" aria-label="Back to dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>

      <img src="https://carder.top/imagens/1792065172414-739661966.jpg"
           alt="Naughty NonStop avatar" class="group-avatar">

      <div class="group-info">
        <h2>Naughty NonStop</h2>
      </div>
    </div>

    <button class="menu-btn" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5" r="1.8"></circle>
        <circle cx="12" cy="12" r="1.8"></circle>
        <circle cx="12" cy="19" r="1.8"></circle>
      </svg>
    </button>
  </header>

  <main class="chat-messages-area" id="chatMessagesArea"
        aria-label="Chat messages" aria-live="polite" tabindex="0">
    <div class="empty-chat" id="emptyChatNotice">
      No messages yet. Be the first to start the conversation!
    </div>
  </main>

  <div class="chat-bottom">
    <div id="filePreviewBox" class="file-preview-container">
      <div class="file-preview-left">
        <div class="file-preview-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2ZM5 6h14v12H5V6Zm3.5 4.5A1.5 1.5 0 1 0 8.5 7.5a1.5 1.5 0 0 0 0 3Zm-2 5.5h11l-3.2-4-2.7 3.1-1.7-2.1L6.5 16Z"></path>
          </svg>
        </div>
        <span id="fileNameDisplay">Selected file</span>
      </div>

      <button class="remove-file-btn" id="removeFileButton"
              type="button" onclick="clearSelectedFile()"
              aria-label="Remove selected file">×</button>
    </div>

    <form class="chat-input-container" id="chatForm">
      <div class="chat-input-wrap">
        <input type="text" id="chatInputText"
               class="chat-input-field"
               placeholder="Send anonymously..."
               autocomplete="off" enterkeyhint="send"
               aria-label="Message">

        <div class="input-actions">
          <input type="file" id="mediaInput"
                 accept="image/*,video/*" hidden>

          <button class="action-btn media-upload-btn" type="button"
                  id="uploadButton" title="Upload photo or video"
                  aria-label="Upload photo or video">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5" width="13" height="14" rx="2.5"></rect>
              <path d="m5.5 16 3.2-3.4 2.4 2.3 2.1-2.1 3.3 3.2"></path>
              <path d="M14.5 8.5h6M17.5 5.5l3 3-3 3"></path>
            </svg>
          </button>

          <button class="action-btn send-msg-btn" type="submit"
                  id="sendButton" aria-label="Send message"
                  title="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 11.5 20 4l-6.5 16-2.2-6.3L4 11.5Z"></path>
              <path d="m11.3 13.7 4.1-4.1"></path>
            </svg>
          </button>
        </div>
      </div>
    </form>
  </div>

  <div id="chatToast" class="chat-toast"
       role="status" aria-live="polite"></div>
</div>

<script>
'use strict';

/*
  Keep empty when the API runs on the same domain.
  Never place a Telegram token or other secret here.
*/
const CHAT_API_BASE_URL = '';
const CHAT_MESSAGES_ENDPOINT = '/api/chat/messages';
const CHAT_POLL_INTERVAL = 5000;
const CHAT_HISTORY_LIMIT = 100;

let selectedFileObject = null;
let selectedFileUrl = null;
let isSending = false;
let isLoadingMessages = false;
let toastTimer = null;
let pollTimer = null;
let hasShownInitialError = false;

const renderedMessageKeys = new Set();
const pendingClientMessageIds = new Set();
const activeObjectUrls = new Set();

const textInput = document.getElementById('chatInputText');
const mediaInput = document.getElementById('mediaInput');
const sendButton = document.getElementById('sendButton');
const uploadButton = document.getElementById('uploadButton');
const removeFileButton = document.getElementById('removeFileButton');
const chatForm = document.getElementById('chatForm');
const previewBox = document.getElementById('filePreviewBox');
const fileNameDisplay = document.getElementById('fileNameDisplay');
const messagesArea = document.getElementById('chatMessagesArea');
const emptyChatNotice = document.getElementById('emptyChatNotice');
const chatToast = document.getElementById('chatToast');

/* Keep the shell inside the visible mobile viewport. */
let viewportFrame = null;

function isNearBottom(){
  return messagesArea.scrollHeight -
    messagesArea.scrollTop -
    messagesArea.clientHeight < 100;
}

function scrollToBottom(){
  messagesArea.scrollTop = messagesArea.scrollHeight;
}

function updateViewport(){
  viewportFrame = null;

  const viewport = window.visualViewport;

  // Preserve pinch zoom instead of resizing the layout during zoom.
  if(viewport && Math.abs(viewport.scale - 1) > 0.01){
    return;
  }

  const stayAtBottom = isNearBottom();
  const height = viewport ? viewport.height : window.innerHeight;
  const top = viewport ? viewport.offsetTop : 0;

  document.documentElement.style.setProperty(
    '--app-height', height + 'px'
  );
  document.documentElement.style.setProperty(
    '--app-top', top + 'px'
  );

  if(stayAtBottom){
    scrollToBottom();
  }
}

function scheduleViewportUpdate(){
  if(viewportFrame !== null) return;
  viewportFrame = requestAnimationFrame(updateViewport);
}

window.addEventListener('resize', scheduleViewportUpdate);
window.addEventListener('orientationchange', scheduleViewportUpdate);

if(window.visualViewport){
  window.visualViewport.addEventListener(
    'resize', scheduleViewportUpdate
  );
  window.visualViewport.addEventListener(
    'scroll', scheduleViewportUpdate
  );
}

textInput.addEventListener('focus', scheduleViewportUpdate);
textInput.addEventListener('blur', scheduleViewportUpdate);

updateViewport();

function createUniqueId(){
  try{
    if(window.crypto &&
       typeof window.crypto.randomUUID === 'function'){
      return window.crypto.randomUUID();
    }
  }catch(error){}

  return 'nc-' + Date.now().toString(36) + '-' +
    Math.random().toString(36).slice(2);
}

function getClientId(){
  const storageKey = 'naughty_chat_client_id';

  try{
    let clientId = sessionStorage.getItem(storageKey);

    if(!clientId){
      clientId = createUniqueId();
      sessionStorage.setItem(storageKey, clientId);
    }

    return clientId;
  }catch(error){
    return createUniqueId();
  }
}

const CLIENT_ID = getClientId();

function apiUrl(path){
  return CHAT_API_BASE_URL.trim().replace(/\/+$/, '') + path;
}

function goToDashboard(){
  window.top.location.href =
    'https://alveecommunity.com/dashboard.html';
}

function showToast(message, type = 'success'){
  clearTimeout(toastTimer);
  chatToast.textContent = message;
  chatToast.className = 'chat-toast show ' + type;

  toastTimer = setTimeout(() => {
    chatToast.className = 'chat-toast';
  }, 3500);
}

function revokeObjectUrl(url){
  if(!url) return;

  try{
    URL.revokeObjectURL(url);
  }catch(error){}

  activeObjectUrls.delete(url);
}

function clearSelectedFile(){
  if(isSending) return;

  const stayAtBottom = isNearBottom();

  selectedFileObject = null;

  if(selectedFileUrl){
    revokeObjectUrl(selectedFileUrl);
    selectedFileUrl = null;
  }

  mediaInput.value = '';
  previewBox.style.display = 'none';
  toggleSendButton();

  if(stayAtBottom) scrollToBottom();
}

uploadButton.addEventListener('click', () => {
  if(isSending) return;
  mediaInput.value = '';
  mediaInput.click();
});

mediaInput.addEventListener('change', event => {
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  if(!file.type.startsWith('image/') &&
     !file.type.startsWith('video/')){
    showToast('Please select an image or video.', 'error');
    mediaInput.value = '';
    return;
  }

  const stayAtBottom = isNearBottom();

  if(selectedFileUrl){
    revokeObjectUrl(selectedFileUrl);
  }

  selectedFileObject = file;
  selectedFileUrl = URL.createObjectURL(file);
  activeObjectUrls.add(selectedFileUrl);

  fileNameDisplay.textContent = file.name;
  previewBox.style.display = 'flex';
  toggleSendButton();

  if(stayAtBottom) scrollToBottom();
});

function toggleSendButton(){
  const hasContent = textInput.value.trim().length > 0 ||
    Boolean(selectedFileObject);

  sendButton.classList.toggle('show', hasContent);
  sendButton.setAttribute('aria-hidden', String(!hasContent));
  sendButton.disabled = isSending || !hasContent;
  uploadButton.disabled = isSending;
  removeFileButton.disabled = isSending;

  // Read-only keeps the keyboard from closing during a send.
  textInput.readOnly = isSending;
  textInput.setAttribute('aria-busy', String(isSending));
}

textInput.addEventListener('input', toggleSendButton);

async function readJsonResponse(response){
  let payload;

  try{
    payload = await response.json();
  }catch(error){
    throw new Error('The server returned an invalid response.');
  }

  if(!response.ok || payload?.ok === false){
    throw new Error(
      payload?.error ||
      payload?.message ||
      ('Server request failed (' + response.status + ').')
    );
  }

  return payload;
}

function extractMessages(payload){
  if(Array.isArray(payload)) return payload;
  if(Array.isArray(payload?.messages)) return payload.messages;
  if(Array.isArray(payload?.data?.messages)){
    return payload.data.messages;
  }
  return [];
}

function getMessageId(message){
  return String(
    message.client_message_id ||
    message.clientMessageId ||
    message.id ||
    message._id ||
    message.message_id ||
    message.messageId ||
    ''
  );
}

function getMessageTimestamp(message){
  const value =
    message.created_at ||
    message.createdAt ||
    message.timestamp ||
    message.time ||
    '';

  if(typeof value === 'number'){
    return value < 1000000000000 ? value * 1000 : value;
  }

  const parsed = value ? Date.parse(value) : NaN;
  return Number.isFinite(parsed) ? parsed : 0;
}

function formatMessageTime(message){
  const timestamp = getMessageTimestamp(message);
  const date = timestamp ? new Date(timestamp) : new Date();

  return date.toLocaleTimeString([], {
    hour:'2-digit',
    minute:'2-digit'
  });
}

function resolveMediaUrl(rawUrl){
  if(!rawUrl || typeof rawUrl !== 'string') return '';

  try{
    const base = CHAT_API_BASE_URL.trim()
      ? CHAT_API_BASE_URL.trim().replace(/\/+$/, '') + '/'
      : window.location.origin + '/';

    const resolved = new URL(rawUrl, base);

    if(resolved.protocol !== 'http:' &&
       resolved.protocol !== 'https:'){
      return '';
    }

    return resolved.href;
  }catch(error){
    return '';
  }
}

function isVideoMessage(message, mediaUrl){
  const mediaType = String(
    message.media_type ||
    message.mediaType ||
    message.mime_type ||
    message.mimeType ||
    message.file_type ||
    message.fileType ||
    message.media?.mime_type ||
    ''
  ).toLowerCase();

  return mediaType === 'video' ||
    mediaType.startsWith('video/') ||
    /\.(mp4|webm|mov|m4v|ogv)([?#].*)?$/i.test(mediaUrl);
}

function renderMessage(rawMessage, options = {}){
  if(!rawMessage || typeof rawMessage !== 'object'){
    return false;
  }

  const message = rawMessage;
  const clientMessageId = String(
    message.client_message_id ||
    message.clientMessageId ||
    ''
  );

  const messageKey = getMessageId(message) || [
    message.client_id || message.clientId || '',
    message.created_at || message.createdAt || '',
    message.text || '',
    message.media_url || message.mediaUrl || ''
  ].join('|');

  if(renderedMessageKeys.has(messageKey)) return false;
  renderedMessageKeys.add(messageKey);

  if(emptyChatNotice?.parentNode){
    emptyChatNotice.remove();
  }

  const clientId = String(
    message.client_id || message.clientId || ''
  );

  const outgoing = clientId === CLIENT_ID ||
    (clientMessageId &&
     pendingClientMessageIds.has(clientMessageId));

  const bubble = document.createElement('div');
  bubble.className =
    'message-bubble ' + (outgoing ? 'outgoing' : 'incoming');

  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.alt = 'Avatar';
  avatar.loading = 'lazy';
  avatar.src =
    'https://carder.top/imagens/1791918460640-323067073.jpg';

  const wrap = document.createElement('div');
  wrap.className = 'msg-content-wrap';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = outgoing
    ? 'Anonymous User'
    : String(
        message.sender_name ||
        message.senderName ||
        message.sender ||
        'Anonymous User'
      );

  wrap.appendChild(sender);

  if(typeof message.text === 'string' && message.text){
    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = message.text;
    wrap.appendChild(text);
  }

  const rawMediaUrl =
    message.media_url ||
    message.mediaUrl ||
    message.file_url ||
    message.fileUrl ||
    message.media?.url ||
    '';

  const mediaUrl = resolveMediaUrl(rawMediaUrl) ||
    options.localMediaUrl || '';

  if(mediaUrl){
    const video = isVideoMessage(message, mediaUrl);
    const media = document.createElement(video ? 'video' : 'img');

    if(video){
      media.controls = true;
      media.playsInline = true;
      media.preload = 'metadata';
    }else{
      media.alt = 'Uploaded image';
      media.loading = 'lazy';
    }

    media.className = 'msg-media';

    // Follow media expansion only when the reader is at the bottom.
    let followMedia = isNearBottom();
    const trackPosition = () => {
      followMedia = isNearBottom();
    };
    const mediaReady = () => {
      messagesArea.removeEventListener('scroll', trackPosition);
      if(followMedia) scrollToBottom();
    };

    messagesArea.addEventListener('scroll', trackPosition, {
      passive:true
    });
    media.addEventListener(
      video ? 'loadedmetadata' : 'load',
      mediaReady,
      {once:true}
    );
    media.addEventListener('error', mediaReady, {once:true});

    media.src = mediaUrl;
    wrap.appendChild(media);
  }

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatMessageTime(message);

  wrap.appendChild(time);
  bubble.append(avatar, wrap);
  messagesArea.appendChild(bubble);

  return true;
}

async function loadMessages(options = {}){
  if(isLoadingMessages) return false;
  isLoadingMessages = true;

  try{
    const response = await fetch(
      apiUrl(
        CHAT_MESSAGES_ENDPOINT +
        '?limit=' + CHAT_HISTORY_LIMIT
      ),
      {
        method:'GET',
        headers:{'Accept':'application/json'},
        cache:'no-store'
      }
    );

    const payload = await readJsonResponse(response);
    const messages = extractMessages(payload);

    messages.sort(
      (a, b) => getMessageTimestamp(a) - getMessageTimestamp(b)
    );

    // Check position after the request, in case the user scrolled.
    const stayAtBottom = isNearBottom();
    const hadMessages =
      Boolean(messagesArea.querySelector('.message-bubble'));

    let addedCount = 0;

    for(const message of messages){
      if(renderMessage(message)) addedCount++;
    }

    if(addedCount > 0 && (!hadMessages || stayAtBottom)){
      scrollToBottom();
    }

    return true;
  }catch(error){
    console.error('Chat history error:', error);

    if(!options.silent && !hasShownInitialError){
      hasShownInitialError = true;
      showToast(
        'Chat server is not connected yet. The app.py API must be configured.',
        'error'
      );
    }

    return false;
  }finally{
    isLoadingMessages = false;
  }
}

async function sendMessage(){
  if(isSending) return;

  const text = textInput.value.trim();
  const file = selectedFileObject;
  const localMediaUrl = selectedFileUrl;

  if(!text && !file) return;

  const clientMessageId = createUniqueId();
  const formData = new FormData();

  formData.append('text', text);
  formData.append('sender_name', 'Anonymous User');
  formData.append('client_id', CLIENT_ID);
  formData.append('client_message_id', clientMessageId);

  if(file){
    formData.append('media', file, file.name);
  }

  pendingClientMessageIds.add(clientMessageId);
  isSending = true;
  toggleSendButton();

  try{
    const response = await fetch(
      apiUrl(CHAT_MESSAGES_ENDPOINT),
      {
        method:'POST',
        headers:{'Accept':'application/json'},
        body:formData
      }
    );

    const payload = await readJsonResponse(response);
    const candidate =
      payload?.message || payload?.data?.message || payload;

    const serverMessage =
      candidate && typeof candidate === 'object'
        ? candidate
        : {};

    const messageToRender = {
      ...serverMessage,
      text:typeof serverMessage.text === 'string'
        ? serverMessage.text
        : text,
      sender_name:
        serverMessage.sender_name ||
        serverMessage.senderName ||
        'Anonymous User',
      client_id:
        serverMessage.client_id ||
        serverMessage.clientId ||
        CLIENT_ID,
      client_message_id:
        serverMessage.client_message_id ||
        serverMessage.clientMessageId ||
        clientMessageId,
      created_at:
        serverMessage.created_at ||
        serverMessage.createdAt ||
        new Date().toISOString(),
      media_type:
        serverMessage.media_type ||
        serverMessage.mediaType ||
        (file ? file.type : ''),
      media_url:
        serverMessage.media_url ||
        serverMessage.mediaUrl ||
        ''
    };

    renderMessage(messageToRender, {localMediaUrl});

    // Retain the object URL for locally displayed uploaded media.
    if(file && selectedFileObject === file){
      selectedFileObject = null;
      selectedFileUrl = null;
      mediaInput.value = '';
      previewBox.style.display = 'none';
    }

    textInput.value = '';
    scrollToBottom();

    if(payload?.telegram_saved === false ||
       payload?.telegram_backup === false){
      showToast(
        'Message received, but Telegram backup failed.',
        'error'
      );
    }else{
      showToast('Message sent successfully.', 'success');
    }

    await loadMessages({silent:true});
  }catch(error){
    console.error('Send message error:', error);
    showToast(
      error.message ||
      'Message could not be sent. Please try again.',
      'error'
    );
  }finally{
    pendingClientMessageIds.delete(clientMessageId);
    isSending = false;
    toggleSendButton();
  }
}

chatForm.addEventListener('submit', event => {
  event.preventDefault();
  sendMessage();
});

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);

  pollTimer = setInterval(() => {
    if(document.visibilityState === 'visible'){
      loadMessages({silent:true});
    }
  }, CHAT_POLL_INTERVAL);
}

toggleSendButton();
loadMessages();
startPolling();

window.addEventListener('pagehide', event => {
  clearInterval(pollTimer);
  pollTimer = null;
  clearTimeout(toastTimer);

  // Keep object URLs when the page enters the back/forward cache.
  if(event.persisted) return;

  for(const url of activeObjectUrls){
    try{
      URL.revokeObjectURL(url);
    }catch(error){}
  }

  activeObjectUrls.clear();
});

window.addEventListener('pageshow', event => {
  scheduleViewportUpdate();

  if(event.persisted){
    loadMessages({silent:true});
    startPolling();
  }
});
</script>
