<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080d20">

<title>Naughty NonStop — Live Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
}

html, body {
    height: 100%;
    height: 100dvh;
    background: #080d20;
    color: #fff;
    overflow: hidden;
}

/* BACKGROUND IMAGE & OVERLAY */
.bg-video-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -2;
    pointer-events: none;
    background: url('https://carder.top/imagens/1792298157180-542085424.jpg') no-repeat center center fixed;
    background-size: cover;
    filter: blur(3px) brightness(0.75);
    transform: scale(1.05);
}

.bg-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        135deg,
        rgba(255, 112, 143, 0.13),
        rgba(10, 17, 40, 0.45),
        rgba(8, 13, 32, 0.75)
    );
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: -1;
    pointer-events: none;
}

/* CHAT APP CONTAINER */
.chat-app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    position: relative;
    z-index: 1;
}

/* TOP HEADER (WITH BACK BUTTON LINKING TO DASHBOARD) */
.chat-custom-header {
    flex: 0 0 56px;
    background: rgba(10, 17, 40, 0.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 10;
}

.header-left-part {
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-to-dashboard-btn {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    transition: background 0.2s;
    text-decoration: none;
}

.back-to-dashboard-btn:hover {
    background: rgba(255, 255, 255, 0.18);
}

.header-title-text {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
}

/* CHAT MESSAGES DISPLAY AREA */
.chat-messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
}

.chat-messages-area::-webkit-scrollbar {
    width: 5px;
}
.chat-messages-area::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
}

.empty-chat {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    margin: auto;
    background: rgba(255, 255, 255, 0.03);
    padding: 12px 20px;
    border-radius: 14px;
    border: 1px dashed rgba(255, 255, 255, 0.1);
}

/* CHAT BUBBLES */
.message-bubble {
    display: flex;
    gap: 10px;
    max-width: 80%;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message-bubble.outgoing {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.msg-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.msg-content-wrap {
    background: rgba(20, 28, 58, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 10px 14px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.outgoing .msg-content-wrap {
    background: rgba(255, 112, 143, 0.25);
    border-color: rgba(255, 112, 143, 0.35);
}

.msg-sender {
    font-size: 11px;
    font-weight: 700;
    color: #ff9db3;
    margin-bottom: 3px;
}

.msg-text {
    font-size: 13px;
    color: #f1f5f9;
    word-break: break-word;
    line-height: 1.5;
}

.msg-media {
    max-width: 200px;
    max-height: 200px;
    border-radius: 10px;
    margin-top: 5px;
    display: block;
    object-fit: cover;
}

.msg-time {
    font-size: 9px;
    color: #94a3b8;
    text-align: right;
    margin-top: 4px;
}

/* BOTTOM FIXED CHAT INPUT BOX */
.chat-input-container {
    flex: 0 0 auto;
    background: rgba(10, 17, 40, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    width: 100%;
    z-index: 50;
    box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.3);
}

.media-upload-btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
}

.media-upload-btn:hover {
    color: #ff708f;
}

.chat-input-field {
    flex: 1;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 10px 16px;
    color: #fff;
    font-size: 13px;
    outline: none;
    animation: subtleGlow 4s infinite ease-in-out;
}

@keyframes subtleGlow {
    0%, 100% { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 0 0 rgba(255, 112, 143, 0); }
    50% { border-color: rgba(255, 112, 143, 0.6); box-shadow: 0 0 10px rgba(255, 112, 143, 0.2); }
}

.send-msg-btn {
    background: linear-gradient(135deg, #ff9bb0, #ff708f);
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 112, 143, 0.3);
    flex-shrink: 0;
}

/* FILE PREVIEW */
.file-preview-container {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px 12px;
    border-radius: 12px;
    margin: 0 16px 8px;
    font-size: 12px;
    color: #ff9db3;
    position: relative;
    z-index: 50;
}
.file-preview-container span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 200px;
}
.remove-file-btn {
    background: transparent;
    border: none;
    color: #ff4d4d;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- BACKGROUND MEDIA -->
<div class="bg-video-container" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<div class="chat-app-container">

    <!-- CUSTOM TOP HEADER WITH BACK BUTTON -->
    <div class="chat-custom-header">
        <div class="header-left-part">
            <a href="https://alveecommunity.com/dashboard.html" class="back-to-dashboard-btn" title="Back to Dashboard">
                ← Back
            </a>
            <span class="header-title-text">Naughty NonStop Chat</span>
        </div>
    </div>

    <!-- MIDDLE CHAT DISPLAY AREA -->
    <div class="chat-messages-area" id="chatMessagesArea">
        <div class="empty-chat" id="emptyChatNotice">
            No messages yet. Be the first to start the conversation!
        </div>
    </div>

    <!-- FILE PREVIEW CONTAINER -->
    <div id="filePreviewBox" class="file-preview-container">
        <span id="fileNameDisplay">Selected file</span>
        <button class="remove-file-btn" onclick="clearSelectedFile()">✕</button>
    </div>

    <!-- BOTTOM CHAT INPUT BOX -->
    <div class="chat-input-container">
        <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
        
        <button class="media-upload-btn" onclick="document.getElementById('mediaInput').click()" title="Upload Photo or Video">
            📎
        </button>

        <input 
            type="text" 
            id="chatInputText" 
            class="chat-input-field" 
            placeholder="Send anonymously..." 
            autocomplete="off"
            onkeypress="checkEnter(event)"
        >

        <button class="send-msg-btn" onclick="sendMessage()" aria-label="Send Message">
            ➤
        </button>
    </div>

</div>

<script>
let selectedFileObject = null;

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
        selectedFileObject = file;
        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('filePreviewBox').style.display = 'flex';
    }
}

function clearSelectedFile() {
    selectedFileObject = null;
    document.getElementById('mediaInput').value = '';
    document.getElementById('filePreviewBox').style.display = 'none';
}

function checkEnter(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
}

function sendMessage() {
    const textInput = document.getElementById('chatInputText');
    const text = textInput.value.trim();

    if (!text && !selectedFileObject) return;

    const area = document.getElementById('chatMessagesArea');
    const emptyNotice = document.getElementById('emptyChatNotice');
    if (emptyNotice) emptyNotice.style.display = 'none';

    const senderName = "Anonymous User";
    const senderAvatar = "https://carder.top/imagens/1791918460640-323067073.jpg";
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble outgoing';

    let mediaHTML = '';
    if (selectedFileObject) {
        const fileURL = URL.createObjectURL(selectedFileObject);
        if (selectedFileObject.type.startsWith('image/')) {
            mediaHTML = `<img src="${fileURL}" class="msg-media" alt="Uploaded Image">`;
        } else if (selectedFileObject.type.startsWith('video/')) {
            mediaHTML = `<video src="${fileURL}" class="msg-media" controls></video>`;
        }
    }

    bubble.innerHTML = `
        <img src="${senderAvatar}" alt="Avatar" class="msg-avatar">
        <div class="msg-content-wrap">
            <div class="msg-sender">${senderName}</div>
            ${text ? `<div class="msg-text">${escapeHtml(text)}</div>` : ''}
            ${mediaHTML}
            <div class="msg-time">${timeStr}</div>
        </div>
    `;

    area.appendChild(bubble);
    textInput.value = '';
    clearSelectedFile();
    area.scrollTop = area.scrollHeight;
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}
</script>

</body>
</html>
